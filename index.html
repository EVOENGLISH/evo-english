<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066FF">
<title>EVO English</title>
<!-- ============================================================
     PWA: manifest + metaetiquetas de instalación (Android/iOS)
     ============================================================ -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<!-- Android/Chrome: permite "modo app" sin la etiqueta apple-* -->
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS/Safari: no lee manifest.json para el modo standalone, necesita estas -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EVO">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--s1:#fff;--s2:#E5F0FF;--ink:#0B2247;--mut:#516A8C;--line:#D3E4F7;--leaf:#0C9450;--neon:#0066FF;--cy:#14C2F5;--onl:#fff;--fur:#8FA6B8;--mz:#EEF5FA;--dk:#0B1F3A;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;background:#F8FAFC}
h1,h2,h3,b,.wm,.pill,nav a{font-family:"Space Grotesk","Trebuchet MS",Arial,sans-serif}
#app{position:relative;max-width:980px;margin:0 auto;padding:20px 20px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.backfab{position:fixed;top:14px;left:14px;z-index:7;width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--neon);color:var(--neon);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 6px 16px rgba(15,23,42,.16);-webkit-tap-highlight-color:transparent}
.backfab.show{display:flex}
.backfab:active{transform:scale(.92)}
@keyframes evoBackOut{from{transform:translateX(0);opacity:1}to{transform:translateX(48px);opacity:0}}
@keyframes evoBackIn{from{transform:translateX(-28px);opacity:0}to{transform:translateX(0);opacity:1}}
.app-leaving{animation:evoBackOut .16s ease forwards}
.app-entering{animation:evoBackIn .22s ease}
.wm{font-weight:700;font-size:20px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.wm svg{width:24px;height:24px;fill:var(--leaf)}
.wm span{color:var(--neon)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:28px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0}
.sub{color:var(--mut);font-size:18px;margin:6px 0 0}
.wolf{flex:none}
h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
section{margin-bottom:36px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px}
.trail{display:flex;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.node{position:relative;min-width:104px;flex:1;text-align:center;scroll-snap-align:center}
.node+.node::before{content:"";position:absolute;top:37px;left:-50%;width:100%;height:3px;background:var(--line)}
.node.done+.node::before,.node.done+.node.cur::before{background:var(--leaf)}
.blk{width:56px;height:56px;margin:8px auto 0;display:grid;place-items:center;font-size:24px;position:relative;z-index:1;background:var(--s2);color:var(--mut);clip-path:polygon(0 22%,22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%)}
.done .blk{background:var(--leaf);color:var(--onl)}
.cur .blk{background:var(--neon);color:var(--onl)}
.lock .blk{opacity:.65}
.ic{width:26px;height:26px;fill:currentColor}
.node b{display:block;font-size:13px;margin-top:8px}
.node span{font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kick{color:var(--mut);font-size:14px;margin:0}
h3{font-size:22px;margin:2px 0 12px}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;min-width:180px;flex:1}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.btn{border:0;cursor:pointer;min-height:48px;padding:0 24px;border-radius:14px;font:700 16px "Space Grotesk",Arial,sans-serif;color:var(--onl);background:var(--neon)}
.btn:focus-visible,nav a:focus-visible,.tool:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tool{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tool.feat{border:2px solid var(--neon)}
.tool b{font-size:17px}
.tool small{color:var(--mut);font-size:14px;line-height:1.35}
.pill{align-self:flex-start;margin-top:auto;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--s2);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px 40px}
.chips span{font-size:13px;background:var(--s2);border-radius:99px;padding:2px 10px}
details.unit{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:0 16px}
summary{display:flex;align-items:center;gap:14px;cursor:pointer;padding:12px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary .blk{margin:0;width:44px;height:44px;font-size:20px;flex:none}
summary b{display:block}
summary span{color:var(--mut);font-size:14px}
.ls{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ls i{width:28px;font-style:normal;text-align:center}
.ls.lock{color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{font:700 15px "Space Grotesk",Arial,sans-serif;min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--neon);color:var(--onl);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat b{font-size:28px;display:block}.stat span{color:var(--mut);font-size:14px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:6px 0;min-height:48px;font-size:12px;font-weight:500;color:var(--mut);text-decoration:none;border-radius:12px}
nav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
nav a.on{color:var(--neon);background:var(--s2)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
.card,.tool,details.unit{background:#fff}
.sb{display:none;justify-content:center;padding:0 0 18px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.sb img{width:100%;max-width:170px;height:auto;display:block}
.emb{height:40px;width:auto;margin-right:12px}
.top{justify-content:flex-start}
.card.hot{background:var(--neon);border:0;color:#fff}
.hot .kick,.hot h3{color:#fff}
.hot .bar{background:rgba(255,255,255,.3)}
.hot .bar i{background:#fff}
.hot .btn{background:#fff;color:var(--neon)}
.wolf.b{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* ==========================================================================
   RETO ENGINE — ESTILOS
   Pantalla de juego 3D compartida por Lecciones y Mapa de Aventuras.
   ========================================================================== */
/* --- 1) MODO ENFOCADO: pantalla limpia, sin nav ni cabecera global --- */
body.modo-enfocado #nav{display:none}
body.modo-enfocado .top{display:none}
body.modo-enfocado .backfab{display:none!important}
body.modo-enfocado .fab{display:none!important}
body.modo-enfocado #app{padding-bottom:0}
body.modo-enfocado .run,body.modo-enfocado .av-run{padding-bottom:100px}

/* --- Barra de progreso con relieve 3D (reutiliza .bar.rbar ya existente) --- */
.rtop{position:relative}
.rbar{background:#0000000f;border-radius:99px;box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.rbar i{background:linear-gradient(180deg,#3D95FF,#0052D6);box-shadow:0 0 10px rgba(0,102,255,.7);border-radius:99px}
.av-run .rbar{background:rgba(255,255,255,.08);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}

/* --- 2) EL LOBO CON SU BOCADILLO, arriba y al centro del reto --- */
.rw-wolf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:6px 0 18px;position:relative}
.rw-wolf .wolf{width:64px;height:auto}
.rw-bubble{background:#fff;border:1px solid #E1E9F7;border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 4px 12px rgba(15,23,42,.1);max-width:280px}
.av-run .rw-bubble{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
/* Destello neón + estrellas al acertar / ganar XP */
.rw-celebrar{animation:rw-bounce .5s ease}
.rw-celebrar::before{content:"\2728";position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:28px;animation:rw-spark .9s ease forwards;pointer-events:none}
.rw-celebrar .wolf,.rw-celebrar .rostro-levo{filter:drop-shadow(0 0 14px rgba(255,214,10,.9)) drop-shadow(0 0 22px rgba(0,102,255,.7))}
.rw-wolf .rostro-levo{width:64px;height:64px}
@keyframes rw-bounce{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes rw-spark{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1.3)}}

/* --- Botón de acción FIJO, de lado a lado, con relieve 3D neón --- */
.rcheck-wrap{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
body:not(.modo-enfocado) .rcheck-wrap{position:static;padding:0}
.rcheck{width:100%;min-height:58px;font-size:17px;border-radius:16px;
 background:linear-gradient(180deg,#3D95FF 0%,#0052D6 100%);border-bottom:6px solid #00308A;
 box-shadow:0 8px 20px rgba(0,102,255,.4);display:flex;align-items:center;justify-content:center;gap:8px;
 transition:transform .08s ease,border-bottom-width .08s ease}
.rcheck:active{transform:translateY(4px);border-bottom-width:2px}
.rcheck:disabled{background:linear-gradient(180deg,#C7D0DE 0%,#A9B4C6 100%);border-bottom:6px solid #8B96A8;box-shadow:none;opacity:1;color:#fff}

/* --- 3) OPCIONES EN 3D ("push button"): borde inferior grueso + hundimiento --- */
.op{border-bottom:4px solid #C7D6EC;box-shadow:0 2px 0 rgba(15,23,42,.02);transition:transform .08s ease,border-bottom-width .08s ease}
.op:active{transform:translateY(2px);border-bottom-width:2px}
.op.sel{border-bottom-color:#0052D6}
.op.ok{border-bottom-color:#0C7A45}
.op.bad{border-bottom-color:#B83236}

.av-op{border-bottom:4px solid rgba(0,0,0,.35);transition:transform .08s ease,border-bottom-width .08s ease,border-color .12s,background .12s}
.av-op:active{transform:translateY(2px);border-bottom-width:2px}
.av-op.sel{border-bottom-color:#B8930A}
.av-op.ok{border-bottom-color:#0C7A45}
.av-op.bad{border-bottom-color:#8A1F24}

/* --- 4) PANTALLA DE RESULTADOS GAMIFICADA (fin de reto/lección) --- */
.rres{background:radial-gradient(ellipse 100% 60% at 50% -10%,#16305C 0%,#050B16 68%);position:relative;overflow:hidden;color:#EAF2FF;text-align:center;padding:38px 20px 120px;min-height:100%}
.rres-destellos{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.rres-destellos::before,.rres-destellos::after{content:"";position:absolute;top:0;left:0;width:3px;height:3px;border-radius:50%;background:transparent;
 box-shadow:18px 40px 0 1px rgba(255,214,10,.9),120px 90px 0 0 rgba(0,178,255,.85),60px 180px 0 1px rgba(255,214,10,.7),
 220px 60px 0 0 rgba(255,255,255,.8),280px 220px 0 1px rgba(0,178,255,.7),40px 300px 0 0 rgba(255,214,10,.8),
 200px 340px 0 1px rgba(255,255,255,.7),320px 140px 0 0 rgba(255,214,10,.6),10px 220px 0 0 rgba(0,178,255,.6);
 animation:rres-tw 2.4s ease-in-out infinite alternate}
.rres-destellos::after{animation-delay:.6s;
 box-shadow:260px 30px 0 0 rgba(0,178,255,.7),100px 260px 0 1px rgba(255,214,10,.8),340px 300px 0 0 rgba(255,255,255,.7),
 160px 40px 0 1px rgba(255,214,10,.6),300px 160px 0 0 rgba(0,178,255,.6),40px 120px 0 1px rgba(255,255,255,.6)}
@keyframes rres-tw{0%{opacity:.35}100%{opacity:1}}
.rres-wolf{position:relative;z-index:1;filter:drop-shadow(0 0 18px rgba(0,102,255,.55)) drop-shadow(0 10px 18px rgba(0,0,0,.5));margin-bottom:6px}
.rres-wolf .wolf{width:150px;height:auto}
.rres-h{position:relative;z-index:1;color:#fff;font-size:23px;margin:8px 0 2px}
.rres-sub{position:relative;z-index:1;color:#B9C8E6;margin:0 0 8px}
.rres-cards{position:relative;z-index:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 8px}
.rres-card{flex:1 1 140px;max-width:170px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
 border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 10px;
 box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 26px rgba(0,0,0,.35);
 opacity:0;transform:translateY(26px) scale(.82)}
.rres-card svg{color:#FFD60A;filter:drop-shadow(0 0 6px rgba(255,214,10,.6))}
.rres-card.in{animation:rres-bounce .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes rres-bounce{0%{opacity:0;transform:translateY(26px) scale(.8)}55%{opacity:1;transform:translateY(-6px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
.rres-num{font:800 22px "Space Grotesk",Arial,sans-serif;color:#fff;margin:8px 0 2px}
.rres-lbl{font-size:11.5px;color:#9FB3D6;line-height:1.3}
.rres-sec{position:relative;z-index:1;display:inline-block;margin-top:14px;color:#9FB3D6;font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* ==========================================================================
   MAPA DE AVENTURAS — ESTILOS (capa estética de AventuraEngine)
   Fullscreen inmersivo en móvil, relieve 3D en los nodos, acentos azul/oro
   sobre fondo oscuro tipo consola. No modifica ninguna clase de Lecciones.
   ========================================================================== */
.av-wrap,.av-run{background:radial-gradient(ellipse 100% 60% at 50% -10%,#16305C 0%,#050B16 68%);position:relative;overflow:hidden}
.av-wrap{padding:22px 10px 60px}
.av-run{padding:22px 18px 30px;color:#EAF2FF}
/* --- Fullscreen de borde a borde en móvil: se sale del contenedor #app --- */
@media (max-width:899px){
 .av-fullscreen{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0}
}
@media (min-width:900px){ .av-fullscreen{border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.4)} }

.av-head{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;position:relative;z-index:2}
/* --- HUD como cristal integrado a la escena, no cajas blancas pegadas --- */
.av-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,214,10,.4);border-radius:99px;padding:8px 14px;font:700 13px "Space Grotesk",Arial,sans-serif;color:#FFD60A;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.av-pill svg{width:16px;height:16px;stroke:#FFD60A}
/* --- Barra de progreso total del mapa (HUD) --- */
.av-prog{position:relative;z-index:2;max-width:340px;margin:2px auto 4px;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.av-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0066FF,#14C2F5);transition:width .4s ease}
.av-progtxt{position:relative;z-index:2;text-align:center;color:#9FB3D6;font-size:11.5px;font-weight:700;margin:0 0 14px}

.av-path{position:relative;z-index:1}
.av-line{position:absolute;top:0;left:0}
.av-lineon{filter:drop-shadow(0 0 5px rgba(0,102,255,.7))}
/* --- Decorado ambiental con vida propia: el vapor del café sube, los
   paneles tecnológicos laten muy suave — sutil, nunca la protagonista. --- */
.av-vapor{animation:av-vapor 3.4s ease-in-out infinite}
@keyframes av-vapor{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.av-deco-b{animation:av-glow 4.6s ease-in-out infinite}
@keyframes av-glow{0%,100%{opacity:.4}50%{opacity:.7}}
/* --- Separador de "mundo" (zona): además de título, hace de punto de
   control real mostrando cuántos retos de esa zona ya se superaron. --- */
.av-mundo{position:absolute;left:0;right:0;text-align:center;z-index:1}
.av-mundo span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(0,102,255,.4);color:#9FB3D6;font:700 11px "Space Grotesk",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:6px 16px;border-radius:99px}
.av-mundo span svg{stroke:#FFD60A;width:13px;height:13px}
.av-mundo span em{font-style:normal;color:#fff;background:rgba(255,255,255,.12);border-radius:99px;padding:1px 8px;margin-left:2px}
.av-mundo.listo span{background:rgba(255,214,10,.14);color:#FFD60A}

/* --- NODOS: posicionados sobre la curva en "S" --- */
.av-node{position:absolute;width:88px;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);z-index:1}
/* --- BOTÓN 3D: relieve real con sombra inferior gruesa; se hunde al presionar --- */
.av-btn{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;cursor:pointer;
 background:linear-gradient(180deg,#28395A 0%,#182238 100%);
 box-shadow:0 6px 0 #0A1424,0 10px 16px rgba(0,0,0,.4);
 transform:translateY(0);transition:transform .1s ease,box-shadow .1s ease}
.av-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0A1424,0 3px 8px rgba(0,0,0,.4)}
.av-btn svg{width:28px;height:28px;stroke:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.6))}
.av-node.hecho .av-btn{background:linear-gradient(180deg,#1FD37F 0%,#0C9450 100%);box-shadow:0 6px 0 #076536,0 10px 18px rgba(12,148,80,.4)}
.av-node.actual .av-btn{background:linear-gradient(180deg,#3D95FF 0%,#0052D6 100%);box-shadow:0 6px 0 #00308A,0 10px 22px rgba(0,102,255,.5)}
.av-node.actual .av-btn svg{filter:none}
/* --- Retos futuros: bloqueados hasta llegar a ellos en orden --- */
.av-node.bloqueado .av-btn{background:linear-gradient(180deg,#232E44 0%,#161E30 100%);box-shadow:0 5px 0 #0A1220,0 8px 14px rgba(0,0,0,.35);cursor:not-allowed}
.av-node.bloqueado .av-btn svg{stroke:#5A6B8C;filter:none}
.av-node.bloqueado .av-lbl{color:#5A6B8C}
/* --- Desafío de zona: no es un círculo más — forma hexagonal, más grande,
   con acento violeta, para que se lea como "esto es distinto y más grande"
   apenas se ve el mapa, sin depender solo de texto. --- */
.av-node.tipo-desafio .av-btn{width:76px;height:76px;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%)}
.av-node.tipo-desafio.hecho .av-btn{box-shadow:0 6px 0 #076536,0 0 26px rgba(124,58,237,.35),0 10px 18px rgba(12,148,80,.4)}
.av-node.tipo-desafio.actual .av-btn{background:linear-gradient(180deg,#8B5CF6 0%,#5B21B6 100%);box-shadow:0 6px 0 #4C1D95,0 10px 26px rgba(124,58,237,.55)}
.av-node.tipo-desafio.bloqueado .av-btn{clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%)}
/* --- Reto dominado (100% de aciertos): corona en vez de estrella, con un
   leve resplandor dorado extra — distingue "lo hice" de "lo domino". --- */
.av-node.dominada .av-btn{box-shadow:0 6px 0 #076536,0 0 18px rgba(255,214,10,.35),0 10px 18px rgba(12,148,80,.4)}

{t:"understand",title:"“I'm {n}” ya es completamente natural",body:"En inglés se usa mucho la forma corta: I'm = I am. Suena natural en casi cualquier situación cotidiana. Si quieres sonar un poco más formal, puedes decir “My name is {n}”. Las dos son correctas.",note:"Un saludo con una sonrisa y tu nombre es suficiente. No necesitas explicar más."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alex dice: “Hey, I'm Alex.” ¿Qué respuesta suena más natural?",say:"Hey, I'm Alex.",opts:["Hey, I'm {n}.","I am called {n} by my parents.","My name is {n}, and I am pleased to make your acquaintance."],a:0,why:"Corta, clara y natural. Las otras dos son posibles, pero suenan raras o demasiado formales para conocer a alguien."},
{t:"build",q:"Arma la frase: “Mucho gusto también.”",words:["you","Nice","meet","too","to"],a:"Nice to meet you too"},

{t:"speak",say:"Hey, I'm {n}. Nice to meet you.",es:"Imagina que conoces a alguien nuevo.",tip:"Sonríe mientras lo dices: cambia tu tono."},
{t:"choose",tag:"LEVO Challenge",q:"Alguien te pregunta: “What's your name?” ¿Qué respondes?",say:"What's your name?",opts:["I'm {n}.","Yes, thank you.","Nice to meet you, {n}."],a:0,why:"Te preguntó tu nombre, así que respondes con tu nombre. Después puedes agregar “Nice to meet you.”"},
{t:"fact",body:"En Estados Unidos es normal saludar con un apretón de manos en situaciones formales, pero entre amigos jóvenes es más común solo decir “Hey” o chocar los puños.",note:"No hay una sola forma “correcta” de saludar: depende de qué tan formal sea la situación."},
{t:"trivia",qs:[
{q:"¿Cuál es la forma más natural de decir “Mucho gusto”?",opts:["Nice to meet you.","I am pleased to make your acquaintance.","Meet nice you."],a:0,why:"“Nice to meet you” es la expresión estándar y natural."},
{q:"Alguien te dice “Hey, I'm Sam.” ¿Qué respondes tú?",opts:["Hey, I'm {n}.","I am {n} person.","Hey you Sam."],a:0,why:"Solo repites la estructura con tu propio nombre."}]}]},

{t:"dialog",lines:[["Alex","Hey, are you new here?","Oye, ¿eres nuevo aquí?"],["You","Sorry, could you say that again?","Perdón, ¿podrías repetirlo?"],["Alex","Sure. Are you new here?","Claro. ¿Eres nuevo aquí?"],["You","Oh, yes! I'm new.","¡Ah, sí! Soy nuevo."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Sorry?","¿Perdón? / ¿Cómo?","Everyday","sóri"],["Could you say that again?","¿Podrías repetirlo?","Neutral","kud yu séi dat eguén"],["Could you speak more slowly?","¿Podrías hablar más despacio?","Neutral","kud yu spík mor slóuli"],["I don't understand.","No entiendo.","Neutral","ai dóunt anderstánd"]]},
{t:"understand",title:"Pedir que repitan es completamente normal",body:"Los hablantes nativos también piden que les repitan cosas todo el tiempo. No es de mala educación ni significa que hablas mal. Es parte de cualquier conversación.",note:"En español a veces decimos “¿mande?”. En inglés, “Sorry?” cumple ese papel. Decir solo “What?” puede sonar brusco."},
{t:"choose",tag:"Elige la respuesta natural",q:"No escuchaste bien lo que dijo Alex. ¿Qué dices?",opts:["Sorry? Could you say that again?","What?! Again!","I don't speak."],a:0,why:"“Sorry?” y “Could you say that again?” son amables y claras. “What?!” puede sonar molesto."},
{t:"choose",tag:"Listening",q:"Escucha y elige qué significa.",say:"Could you speak more slowly, please?",opts:["¿Podrías hablar más despacio, por favor?","¿Podrías hablar más fuerte?","¿Puedes escribirlo?"],a:0,why:"“Slowly” = despacio. “Could you…?” es una forma cortés de pedir algo."},
{t:"build",q:"Arma la frase: “No entiendo.”",words:["understand","I","don't"],a:"I don't understand"},
{t:"real",book:"Could you repeat that, please?",real:"Sorry, what was that?",es:"¿Perdón, qué dijiste?",ctx:"Con amigos o compañeros funciona muy bien. Con un cliente o un jefe, “Could you say that again?” suena más cuidadoso.",tags:["Informal","Everyday"],fast:"sóri, juat wós dat"},
{t:"speak",say:"Sorry, could you say that again?",es:"Practica pedir que repitan.",tip:"Sube un poco el tono al final de “Sorry?”, como pregunta."},
{t:"fact",body:"La palabra “Sorry” no solo significa “perdón”: también se usa con tono de pregunta para decir “¿cómo?” cuando no escuchaste algo bien.",note:"Usar “Sorry?” con tono de pregunta es siempre una opción segura y educada."},
{t:"trivia",qs:[
{q:"¿Qué significa “Could you say that again?”",opts:["¿Podrías repetirlo?","¿Podrías callarte?","¿Podrías venir aquí?"],a:0,why:"“Say that again” = decirlo otra vez."},
{q:"¿Cuál es la forma más educada de pedir que hablen más despacio?",opts:["Could you speak more slowly?","Speak slow now.","Slower!"],a:0,why:"“Could you...?” es la forma cortés de pedir algo."}]}]},

{t:"discover",title:"Expresiones nuevas",items:[["How do you say “mesa” in English?","¿Cómo se dice “mesa” en inglés?","Neutral","jau du yu séi ... in ínglish"],["What does “wanna” mean?","¿Qué significa “wanna”?","Neutral","juat das guána mín"],["How do you spell that?","¿Cómo se deletrea eso?","Neutral","jau du yu spél dat"],["Can you help me, please?","¿Me puedes ayudar, por favor?","Neutral","kan yu jélp mi plíis"]]},
{t:"understand",title:"Puedes preguntar sobre el inglés… en inglés",body:"Con estas preguntas puedes seguir hablando sin cambiar al español. Es una de las habilidades más útiles de A1: cuando te falta una palabra, la pides.",note:"Si no sabes cómo se dice algo, señala el objeto y pregunta: “What's this?”"},
{t:"choose",tag:"Detecta el error",q:"Hay algo incorrecto en esta conversación. ¿Dónde?",ctx:[["You","How you say “mesa” in English?"],["Alex","Table."]],opts:["En la primera línea: falta “do” (How do you say…?)","En la segunda línea","No hay ningún error"],a:0,why:"En preguntas en inglés normalmente usamos “do”: How do you say…?"},

{t:"choose",tag:"Elige la respuesta natural",q:"Alguien te pregunta: “Can you help me?” ¿Qué respuesta es natural?",say:"Can you help me?",opts:["Sure! What do you need?","I am a help.","Yes, table."],a:0,why:"“Sure!” + una pregunta es una respuesta cotidiana y amable."},
{t:"speak",say:"How do you spell that?",es:"Practica esta pregunta útil.",tip:"Escucha el modelo y repite dos veces: primero lento, luego normal."},
{t:"fact",body:"Deletrear en voz alta es muy común en inglés porque muchas palabras no se escriben como suenan. Por eso “How do you spell that?” se usa todo el tiempo, incluso entre hablantes nativos.",note:"El alfabeto en inglés suena distinto al español: la “G” se dice “yi” y la “W” se dice “dábliu”."},
{t:"trivia",qs:[
{q:"¿Cómo preguntas “¿Cómo se dice esto en inglés?”",opts:["How do you say this in English?","How you say this?","What is say this?"],a:0,why:"La pregunta correcta usa “do”: How do you say...?"},
{q:"¿Qué significa “Can you help me, please?”",opts:["¿Me puedes ayudar, por favor?","¿Puedes verme, por favor?","¿Puedes venir, por favor?"],a:0,why:"“Help” significa ayudar."}]}]},
{t:"Formal vs. Casual Greetings",m:8,c:[
{t:"mission",title:"You need to greet different people today.",goal:"Aprende cuándo usar un saludo formal y cuándo uno casual.",wolf:"Ready?"},
{t:"discover",title:"Expresiones nuevas",items:[["Hi! How's it going?","¡Hola! ¿Cómo te va?","Informal","jai jaus it góuin"],["Good morning. How are you?","Buenos días. ¿Cómo está?","Formal","gud mórning jau ar yu"],["Hey! What's up?","¡Oye! ¿Qué onda?","Informal","jei uats ap"],["Good afternoon.","Buenas tardes.","Formal","gud áfternun"]]},
{t:"understand",title:"El mismo idioma, diferentes niveles",body:"En inglés, igual que en español, hablamos distinto con un amigo que con un maestro o un jefe. “Hey” y “What's up?” son perfectos entre amigos; “Good morning” y “How are you?” funcionan mejor en situaciones formales.",note:"No hay una forma “incorrecta”: depende de con quién hablas."},
{t:"choose",tag:"Elige la respuesta natural",q:"Vas a saludar a tu maestro por primera vez en la mañana. ¿Qué opciones son apropiadas?",opts:["Good morning.","Hey, what's up?","Good morning. How are you?"],a:[0,2],why:"Con un maestro, usa un saludo formal. “Good morning” o “Good morning. How are you?” funcionan bien."},
{t:"build",q:"Arma la frase: “Buenas tardes.”",words:["afternoon","Good"],a:"Good afternoon"},
{t:"real",book:"Good morning. How are you today?",real:"Morning! How's it going?",es:"¡Buenos días! ¿Cómo va todo?",ctx:"“Morning!” corto es súper común entre compañeros de trabajo o vecinos, incluso en contextos semi-formales.",tags:["Informal","Everyday"],fast:"mórnin jaus it góuin"},
{t:"speak",say:"Good morning. How are you?",es:"Practica un saludo formal.",tip:"Habla despacio y claro, como si saludaras a tu maestro."},
{t:"fact",body:"En Estados Unidos, decir solo “Morning!” (sin “Good”) es muy común y no suena grosero, incluso en la oficina.",note:"En el Reino Unido, “Alright?” se usa como saludo informal: literalmente significa “¿bien?” pero es solo un “hola”."},
{t:"trivia",qs:[
{q:"Vas a saludar a un amigo en la calle. ¿Qué sería lo más natural?",opts:["Hey! What's up?","Good afternoon, sir.","How do you do?"],a:0,why:"Con un amigo, un saludo casual es lo natural."},
{q:"¿Qué tienen en común “Good morning” y “Good afternoon”?",opts:["Son saludos formales según la hora del día.","Solo se usan en Inglaterra.","Significan lo mismo que “Bye”."],a:0,why:"Ambos son saludos formales/neutrales que cambian según la hora."}]}]},
{t:"Saying Goodbye",m:7,c:[
{t:"mission",title:"The conversation is ending.",goal:"Aprende varias formas de despedirte, de la más neutral a la más informal.",wolf:"Let's go!"},
{t:"dialog",lines:[["Sam","Well, I should get going.","Bueno, ya me tengo que ir."],["You","Okay, see you later!","Bueno, ¡nos vemos luego!"],["Sam","See you! Take care.","¡Nos vemos! Cuídate."],["You","You too. Bye!","Igualmente. ¡Adiós!"]]},
{t:"discover",title:"Expresiones nuevas",items:[["See you later!","¡Nos vemos luego!","Everyday","si yu léiter"],["Take care.","Cuídate.","Neutral","téik quer"],["Have a good one!","¡Que te vaya bien!","Informal","jav a gud uán"],["It was nice meeting you.","Fue un gusto conocerte.","Neutral","it uas nais mítin yu"]]},
{t:"understand",title:"Despedidas cortas y despedidas completas",body:"“Bye” funciona siempre, pero frases como “It was nice meeting you” se usan cuando acabas de conocer a alguien. “Take care” y “Have a good one” son formas cálidas de cerrar cualquier conversación.",note:"“Have a good one” es muy usado en Estados Unidos; en el Reino Unido es menos común."},
{t:"choose",tag:"Elige la respuesta natural",q:"Acabas de conocer a alguien por primera vez y la conversación termina. ¿Qué es lo más natural decir?",opts:["It was nice meeting you!","I go now.","Meeting was nice for me."],a:0,why:"“It was nice meeting you” es la despedida natural cuando conociste a alguien."},
{t:"build",q:"Arma la frase: “Nos vemos luego.”",words:["later","you","See"],a:"See you later"},
{t:"real",book:"Goodbye. Have a nice day.",real:"Bye! Take care.",es:"¡Adiós! Cuídate.",ctx:"“Goodbye” formal se escucha, pero “Bye!” corto es lo que se dice casi siempre entre conocidos.",tags:["Everyday","Neutral"],fast:"bai téik quer"},
{t:"speak",say:"It was nice meeting you. Take care!",es:"Despídete como si acabaras de conocer a alguien.",tip:"Sonríe al decir “take care”, se nota en el tono."},
{t:"fact",body:"En Estados Unidos, decir “Have a good one!” a un desconocido (como el cajero de una tienda) es completamente normal y amistoso.",note:"En español no tenemos un equivalente exacto de una sola frase: por eso a veces suena raro traducido literalmente."},
{t:"trivia",qs:[
{q:"¿Qué significa “Take care”?",opts:["Cuídate.","Ten cuidado, hay peligro.","Nos vemos mañana."],a:0,why:"Es una despedida cálida, no una advertencia."},
{q:"Acabas de conocer a alguien. ¿Cuál despedida es más apropiada?",opts:["It was nice meeting you!","Goodbye forever.","I don't want to talk anymore."],a:0,why:"Reconoce que fue la primera vez que hablaron."}]}]},
{t:"Quick Review: Meeting People",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos lo que aprendiste sobre saludos, presentaciones y despedidas.",wolf:"Let's go!"},
{t:"fact",body:"En la mayoría de Estados Unidos, el “small talk” (platicar de cosas sin importancia, como el clima) antes de ir al grano es una parte esperada de casi cualquier conversación.",note:"Preguntar “How's it going?” casi nunca busca una respuesta larga: un simple “Good, thanks!” es suficiente."},
{t:"trivia",qs:[
{q:"Alguien te dice “Hey, I'm Sam.” ¿Qué respondes tú?",opts:["Hey, I'm {n}. Nice to meet you.","I am {n} person.","Hey you Sam."],a:0,why:"Repites la estructura y agregas una frase de cortesía."},
{q:"¿Cuál es una forma natural de pedir que repitan algo?",opts:["Sorry, could you say that again?","What?! Again!","I don't speak."],a:0,why:"Es amable y clara."},
{q:"Vas a saludar a tu jefe en la mañana. ¿Qué opción es apropiada?",opts:["Good morning.","Hey, what's up?","Yo, what's good?"],a:0,why:"En un contexto formal, usa un saludo formal."},

{t:"How old are you?",m:8,c:[{t:"mission",title:"Someone asks your age.",goal:"Habla de tu edad y de la de otras personas.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","So, how old are you?","Entonces, ¿cuántos años tienes?"],["You","I'm twenty-five.","Tengo veinticinco años."],["Sam","Nice! I'm twenty-three.","¡Qué bien! Yo tengo veintitrés."],["You","Cool, we're close in age.","Qué bien, somos de edad parecida."]]},{t:"discover",title:"Expresiones nuevas",items:[["How old are you?","¿Cuántos años tienes?","Neutral","jáu old ar yu"],["I'm twenty-five.","Tengo veinticinco años.","Neutral","aim tuenti faiv"],["He's thirty.","Él tiene treinta años.","Neutral","jis zérti"],["She's about my age.","Ella tiene más o menos mi edad.","Neutral","chis abáut mai éiy"]]},{t:"understand",title:"En inglés no se dice “tener años”",body:"En español dices “tengo 25 años”, pero en inglés se usa el verbo to be: I am 25 (I'm 25), literalmente “soy 25”. Nunca digas “I have 25 years”: suena raro y no es natural.",note:"Los números después de 20 se forman así: twenty-one, twenty-two, twenty-three... treinta es thirty, cuarenta forty, cincuenta fifty."},{t:"choose",tag:"Elige la respuesta natural",q:"Alguien pregunta: “How old are you?” ¿Cuál es correcta?",say:"How old are you?",opts:["I'm twenty-five.","I have twenty-five years.","I twenty-five."],a:0,why:"En inglés se usa el verbo to be (I'm), no “to have”. “I have 25 years” es un error muy común al traducir del español."},{t:"build",q:"Arma la frase: “Tengo veintitrés años.”",words:["twenty-three","I'm"],a:"I'm twenty-three"},{t:"real",book:"I am twenty-five years old.",real:"I'm twenty-five.",es:"Las dos son correctas, pero en una conversación casual casi nadie dice \"years old\" al final.",ctx:"\"I am twenty-five years old\" es más común por escrito o en un formulario. Hablando, basta con \"I'm twenty-five.\"",tags:["Neutral","Everyday"],fast:"aim-tuenti-fáiv"},{t:"speak",say:"I'm twenty-five. My best friend is twenty-three.",es:"Habla de tu edad y la de un amigo.",tip:"Presta atención a cómo suenan los números: thir-TEEN vs THIR-ty."},{t:"fact",body:"En muchos países de habla inglesa, preguntar la edad a alguien que acabas de conocer (sobre todo a una mujer adulta) puede sentirse invasivo o incómodo, dependiendo del contexto.",note:"Entre amigos jóvenes es normal, pero en un ambiente formal o de trabajo, mejor evita preguntar la edad directamente."},{t:"trivia",qs:[{q:"¿Cómo se dice correctamente “Tengo 30 años”?",opts:["I'm thirty.","I have thirty years.","I thirty years."],a:0,why:"Se usa el verbo to be, no to have."},{q:"¿Cuál de estos números es “cuarenta”?",opts:["Forty","Fourteen","Fourty"],a:0,why:"“Forty” (sin la “u” de “four”) es la forma correcta de escribir 40."}]}]},{t:"What do you do?",m:8,c:[{t:"mission",title:"Small talk at a party.",goal:"Habla de tu trabajo o estudios.",wolf:"Let's go!"},{t:"dialog",lines:[["Sam","So, what do you do?","Y bueno, ¿a qué te dedicas?"],["You","I'm a student. I study design.","Soy estudiante. Estudio diseño."],["Sam","Cool, where do you study?","Qué bien, ¿dónde estudias?"],["You","At a university downtown.","En una universidad en el centro."]]},{t:"discover",title:"Expresiones nuevas",items:[["What do you do?","¿A qué te dedicas?","Neutral","uát du yu du"],["I'm a student.","Soy estudiante.","Neutral","aim a stiúdent"],["I work as a nurse.","Trabajo como enfermera.","Neutral","ai uérk as a nörs"],["I study design.","Estudio diseño.","Neutral","ai stádi disáin"]]},{t:"understand",title:"“What do you do?” pregunta por tu trabajo, no por el momento",body:"“What do you do?” significa “¿a qué te dedicas?” (tu trabajo o profesión). Es diferente de “What are you doing?”, que pregunta qué estás haciendo justo ahora. Para responder, usa I'm a/an + profesión (I'm a teacher) o I work as + profesión.",note:"Si todavía estudias, di I'm a student o I study + materia."},{t:"choose",tag:"Elige la respuesta natural",q:"Te preguntan: “What do you do?” Tú eres mesero. ¿Qué respondes?",say:"What do you do?",opts:["I'm a waiter.","I do waiter.","I waiter."],a:0,why:"Usa I'm a/an + profesión. “I do waiter” y “I waiter” no son estructuras correctas en inglés."},{t:"build",q:"Arma la frase: “Trabajo como enfermera.”",words:["as","work","nurse","I","a"],a:"I work as a nurse"},{t:"real",book:"I am a student of design.",real:"I'm a design student. / I study design.",es:"“I'm a design student” y “I study design” son las formas más naturales de decirlo.",ctx:"\"I am a student of design\" suena traducido del español y muy formal. Casi nadie habla así de manera natural.",tags:["Everyday","Neutral"],fast:"aim-a-disáin-stiúdent"},{t:"speak",say:"I'm a student. I study design at a university downtown.",es:"Cuéntale a alguien a qué te dedicas.",tip:"Une las dos frases con una pausa corta, no digas cada una por separado y cortado."},{t:"fact",body:"En una conversación casual en inglés, es común preguntar “What do you do?” muy pronto al conocer a alguien nuevo, ¡a veces incluso antes de preguntar su nombre!",note:"No es de mala educación: es simplemente parte normal del small talk."},{t:"trivia",qs:[{q:"¿Qué pregunta “What do you do?”",opts:["A qué te dedicas / tu trabajo","Qué estás haciendo ahora mismo","Qué te gusta comer"],a:0,why:"Pregunta por tu profesión u ocupación, no por el momento actual."},{q:"Eres profesor. ¿Cuál es la respuesta correcta?",opts:["I'm a teacher.","I teacher.","I do teacher."],a:0,why:"I'm a/an + profesión es la estructura correcta."}]}]},{t:"Things I like",m:8,c:[{t:"mission",title:"You're talking about your free time.",goal:"Habla de lo que te gusta y lo que no.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","Do you like music?","¿Te gusta la música?"],["You","Yeah, I love it. I don't like sports, though.","Sí, me encanta. Aunque no me gustan los deportes."],["Sam","Really? I love soccer.","¿En serio? A mí me encanta el fútbol."],["You","That's cool, it's just not for me.","Qué bien, solo que no es lo mío."]]},{t:"discover",title:"Expresiones nuevas",items:[["I like music.","Me gusta la música.","Neutral","ai laik miúsik"],["I love it.","Me encanta.","Neutral","ai lov it"],["I don't like sports.","No me gustan los deportes.","Neutral","ai dount laik spórts"],["It's not for me.","No es lo mío.","Everyday","its nat for mi"]]},{t:"understand",title:"like + sustantivo o + verbo-ing",body:"Después de like, love o don't like puedes usar un sustantivo (I like music) o un verbo terminado en -ing (I like dancing / I don't like running). No digas “I like to dance to” raro combinado: lo más natural y común es usar la forma en -ing.",note:"love es más fuerte que like: I love it = me encanta; I like it = me gusta."},{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que no te gusta bailar. ¿Cuál opción es correcta?",say:"Do you like dancing?",opts:["I don't like dancing.","I no like dance.","I not like to dancing."],a:0,why:"don't like + verbo-ing es la estructura natural y correcta."},{t:"build",q:"Arma la frase: “Me encanta la música.”",words:["it","love","music","I"],a:"I love music"},{t:"real",book:"I like listening to music very much.",real:"I love music.",es:"Las dos comunican que te gusta mucho la música, pero la segunda es mucho más natural y corta.",ctx:"\"I like listening to music very much\" es gramaticalmente correcto pero suena muy formal / traducido. En una conversación casual, la gente dice simplemente \"I love music.\"",tags:["Everyday","Neutral"],fast:"ai-lov-miúsik"},{t:"speak",say:"I love music, but sports aren't really for me.",es:"Habla de algo que te gusta y algo que no.",tip:"Marca el contraste con tu tono: sube un poco la voz en “love” y bájala en “aren't”."},{t:"fact",body:"En inglés, decir directamente “I don't like it” no se considera grosero como podría sentirse en español si no se suaviza. Es una forma normal y directa de expresar una preferencia.",note:"Si quieres sonar aún más suave, puedes agregar “It's just not my thing” (simplemente no es lo mío)."},{t:"trivia",qs:[{q:"¿Cuál es la forma correcta de decir que te encanta bailar?",opts:["I love dancing.","I love to dance to.","I loving dance."],a:0,why:"love + verbo-ing es la estructura natural."},{q:"¿Qué significa “It's not for me”?",opts:["No es lo mío","No es para mí regalo","No lo tengo"],a:0,why:"Es una forma natural de decir que algo no te gusta o no te interesa, sin sonar duro."}]}]},{t:"My info: spell it out",m:9,c:[{t:"mission",title:"You're signing up for a class.",goal:"Deletrea tu nombre y da tu información básica en inglés.",wolf:"Let's go!"},{t:"dialog",lines:[["Staff","Can you spell your name, please?","¿Puedes deletrear tu nombre, por favor?"],["You","Sure. It's L-U-I-S.","Claro. Es L-U-I-S."],["Staff","Great, and your email?","Perfecto, ¿y tu correo?"],["You","It's luis at email dot com.","Es luis arroba email punto com."]]},{t:"discover",title:"El abecedario en inglés",items:[["Can you spell that, please?","¿Puedes deletrear eso, por favor?","Neutral","kan yu spel dat plis"],["It's spelled...","Se deletrea...","Neutral","its speld"],["at (@)","arroba","Everyday","at"],["dot (.)","punto","Everyday","dat"]]},{t:"understand",title:"Deletrear en inglés: letra por letra",body:"Para deletrear en inglés, dices cada letra por separado usando su nombre en inglés: A (ei), B (bi), C (si)... Por ejemplo, LUIS se dice: L (el), U (iú), I (ai), S (es). Para direcciones de correo, @ se dice “at” y el punto se dice “dot”.",note:"Si dos letras se repiten seguidas, puedes decir “double” + letra: SS = double S."},{t:"choose",tag:"Elige la respuesta natural",q:"Te piden deletrear tu correo “ana@mail.com”. ¿Cómo lo dices?",say:"What's your email?",opts:["ana at mail dot com","ana arroba mail punto com","ana @ mail . com, in Spanish"],a:0,why:"En inglés, @ se dice “at” y el punto se dice “dot”, siempre en inglés aunque estés hablando de un correo."},{t:"form",prompt:"Llena tu información básica en inglés, como si te estuvieras inscribiendo a un curso.",fields:[{id:"name",label:"First name / Last name",placeholder:"Luis Hernández",example:"Ana García"},{id:"age",label:"Age",placeholder:"25",example:"22"},{id:"from",label:"I'm from...",placeholder:"Guadalajara, Mexico",example:"Monterrey, Mexico"},{id:"email",label:"Email",placeholder:"name at email dot com",example:"ana at email dot com"}]},{t:"real",book:"My name is spelled L-U-I-S.",real:"It's spelled L-U-I-S. / It's L-U-I-S.",es:"Las dos formas comunican lo mismo, la segunda es más corta y común al hablar rápido.",ctx:"\"My name is spelled...\" es correcto y un poco más formal; en una conversación normal, la gente suele ir directo con \"It's...\"",tags:["Neutral","Everyday"],fast:"its-speld"},{t:"speak",say:"Can you spell that, please? Sure, it's L-U-I-S.",es:"Practica pedir y dar el deletreo de un nombre.",tip:"Haz una pequeña pausa entre cada letra al deletrear."},{t:"fact",body:"En Estados Unidos y otros países de habla inglesa, es muy común que te pidan deletrear tu nombre por teléfono o en un formulario, sobre todo si tu nombre no es de origen inglés.",note:"No te apenes si te lo piden: es de lo más normal, ¡hasta con nombres en inglés!"},{t:"trivia",qs:[{q:"¿Cómo se dice el símbolo @ en inglés?",opts:["At","Arroba","In"],a:0,why:"En inglés, @ siempre se dice “at”."},{q:"¿Cómo se dice el punto (.) en una dirección de correo?",opts:["Dot","Point","Period always"],a:0,why:"En correos y sitios web, el punto se dice “dot”."}]}]},{t:"Mission: Meet someone new",m:10,c:[{t:"mission",title:"Show what you can do.",goal:"Vas a conocer a alguien nuevo: saluda, preséntate, habla de ti y despídete.",wolf:"Ready?"},{t:"situation",intro:"You're at a language exchange event. Someone sits next to you.",start:["Taylor","Hi! Is this seat free? I'm Taylor, by the way.","Hola, ¿este lugar está libre? Por cierto, soy Taylor."],branches:[{opt:"Hi Taylor, I'm {n}. Nice to meet you! So, where are you from?",npc:"I'm from Canada! And you? What do you do, by the way?",tag:"Natural y muestra interés",best:true},{opt:"I am {n}. I am pleased to make your acquaintance.",npc:"Oh, um... nice to meet you too?",tag:"Muy formal para este contexto",best:false,why:"Es correcto, pero en un evento casual como este suena demasiado formal e incómodo."},{opt:"Yes, free.",npc:"Oh, ok... I'm Taylor, by the way.",tag:"Muy cortante",best:false,why:"Responde la pregunta, pero no te presentas ni sigues la conversación."}],outro:"Nice! You just started a real conversation with someone new."},{t:"choose",tag:"Elige la respuesta natural",q:"Taylor pregunta: “What do you do?” Eres estudiante de diseño. ¿Qué respondes?",opts:["I'm a design student. I study at a university downtown.","I do student of design.","I am occupation student."],a:0,why:"Usa I'm a/an + profesión, igual que practicaste en esta unidad."},{t:"build",q:"Arma la frase: “Tengo veinticinco años y vivo en Guadalajara.”",words:["twenty-five","live","in","I'm","and","I","Guadalajara"],a:"I'm twenty-five and I live in Guadalajara"},{t:"write",prompt:"Escríbele 3-4 líneas a Taylor contándole de ti: tu nombre, edad, de dónde eres, a qué te dedicas y algo que te gusta.",placeholder:"Hi, I'm ... I'm ... years old. I'm from ... I'm a/an ... I like ...",model:"Hi, I'm Luis. I'm twenty-five years old. I'm from Guadalajara, Mexico. I'm a design student. I love music, but sports aren't really my thing.",tip:"Usa las frases que ya practicaste en esta unidad: no necesitas inventar nada nuevo."},{t:"speak",say:"Hi, I'm {n}. I'm from Mexico, and I'm a student. I love music.",es:"Preséntate completo: nombre, origen y algo que te gusta.",tip:"Habla con confianza, como si de verdad estuvieras conociendo a alguien."},{t:"trivia",qs:[{q:"¿Qué aprendiste a hacer en esta unidad?",opts:["Hablar de tu edad, tu origen, tu trabajo y tus gustos","Solo hablar del clima","Solo pedir comida"],a:0,why:"Toda la unidad se centró en presentarte y hablar de ti mismo."},{q:"“I'm a design student” es un ejemplo de:",opts:["Hablar de tu ocupación o estudios","Hablar de tu edad","Deletrear tu nombre"],a:0,why:"Usa la estructura I'm a/an + profesión u ocupación."},{q:"¿Cuál es la forma correcta de decir tu edad?",opts:["I'm twenty-five.","I have twenty-five years.","I twenty-five old."],a:0,why:"En inglés se usa el verbo to be, no to have, para la edad."}]}]}],["Preguntar y decir la edad usando el verbo to be.", "Hablar de tu ocupación y a qué te dedicas.", "Expresar gustos y preferencias con like/love/hate.", "Deletrear tu nombre e información básica en inglés."],"#FF6B4A"),
U(3,"People Around Me","users","Familia, amigos y descripciones básicas, siempre dentro de pequeñas conversaciones.",[{t:"This is my family",m:8,c:[{t:"mission",title:"You're showing a photo to a friend.",goal:"Presenta a los miembros de tu familia.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","Is this your family?","¿Esta es tu familia?"],["You","Yeah, this is my mom and my dad.","Sí, ella es mi mamá y él es mi papá."],["Sam","And who's this?","¿Y quién es este?"],["You","That's my brother, Leo.","Ese es mi hermano, Leo."]]},{t:"discover",title:"Expresiones nuevas",items:[["This is my mom.","Ella es mi mamá.","Neutral","dis is mai mom"],["This is my dad.","Él es mi papá.","Neutral","dis is mai dad"],["I have two brothers.","Tengo dos hermanos.","Neutral","ai jav tu bróders"],["I'm an only child.","Soy hijo/a único/a.","Neutral","aim an ónli chaild"]]},{t:"understand",title:"“This is” para presentar personas",body:"Usa This is + nombre para presentar a alguien, aunque no esté físicamente presente (como en una foto). Para hablar de hermanos, usa I have + número + brothers/sisters. Si no tienes hermanos, dices I'm an only child.",note:"En inglés no existe una palabra para “hermanos” que incluya hombres y mujeres a la vez como en español: tienes que decir brothers and sisters, o siblings si quieres ser general."},{t:"choose",tag:"Elige la respuesta natural",q:"Le muestras una foto a un amigo. ¿Cómo presentas a tu papá?",say:"Is this your family?",opts:["This is my dad.","This my dad is.","He is dad."],a:0,why:"This is + persona es la estructura natural para presentar a alguien."},{t:"build",q:"Arma la frase: “Tengo dos hermanos.”",words:["brothers","have","two","I"],a:"I have two brothers"},{t:"real",book:"I do not have any siblings.",real:"I'm an only child.",es:"Las dos formas dicen que no tienes hermanos, pero la segunda es mucho más natural y común.",ctx:"“I do not have any siblings” suena correcto pero muy formal. En una conversación normal, la gente dice simplemente “I'm an only child.”",tags:["Everyday","Neutral"],fast:"aim-an-ónli-cháild"},{t:"speak",say:"This is my mom, and this is my brother, Leo.",es:"Presenta a dos miembros de tu familia.",tip:"Haz una pausa entre cada persona que presentas, como si de verdad mostraras fotos."},{t:"fact",body:"En muchas familias de países de habla inglesa, es común llamar a los padres por su primer nombre cuando los adultos hablan de ellos con otros adultos, aunque con los papás siempre se usa “mom” y “dad” directamente.",note:"“Mom” es más común en Estados Unidos y “mum” en Reino Unido: ¡las dos son correctas!"},{t:"trivia",qs:[{q:"¿Cómo presentas a alguien en una foto?",opts:["This is my dad.","Here dad is.","My is dad."],a:0,why:"This is + persona es la estructura correcta."},{q:"No tienes hermanos. ¿Qué dices?",opts:["I'm an only child.","I have zero brothers.","I no have brothers."],a:0,why:"“I'm an only child” es la forma natural de decirlo en inglés."}]}]},{t:"She's my sister",m:8,c:[{t:"mission",title:"You're talking about your sister.",goal:"Describe a un familiar: quién es y qué hace.",wolf:"Let's go!"},{t:"dialog",lines:[["Sam","Who's that in the picture?","¿Quién es esa en la foto?"],["You","She's my sister. She's twenty-eight.","Es mi hermana. Tiene veintiocho años."],["Sam","What does she do?","¿A qué se dedica?"],["You","She's a nurse. She works at a hospital.","Es enfermera. Trabaja en un hospital."]]},{t:"discover",title:"Expresiones nuevas",items:[["She's my sister.","Ella es mi hermana.","Neutral","chis mai síster"],["He's my brother.","Él es mi hermano.","Neutral","jis mai bróder"],["She's a nurse.","Ella es enfermera.","Neutral","chis a nörs"],["She works at a hospital.","Ella trabaja en un hospital.","Neutral","chi uérks at a jóspital"]]},{t:"understand",title:"He / She + is (para describir a alguien)",body:"Para hablar de una tercera persona, usa He is (He's) para hombres y She is (She's) para mujeres, seguido de su edad, profesión o descripción: She's twenty-eight. She's a nurse. Recuerda que el verbo cambia: con he/she siempre se agrega -s a los verbos en presente (she works, no she work).",note:"Este pequeño cambio (agregar -s) es uno de los errores más comunes al hablar de otras personas: he work → he works."},{t:"choose",tag:"Elige la respuesta natural",q:"Hablas de tu hermana, que es enfermera. ¿Cuál es correcta?",say:"What does she do?",opts:["She works at a hospital.","She work at a hospital.","She working at hospital."],a:0,why:"Con he/she, el verbo lleva -s: she works, no she work."},{t:"build",q:"Arma la frase: “Ella tiene veintiocho años.”",words:["twenty-eight","is","She"],a:"She is twenty-eight"},{t:"real",book:"My sister is a person who works as a nurse.",real:"My sister's a nurse.",es:"La segunda es mucho más corta y natural; nadie habla con tantos rodeos.",ctx:"“My sister is a person who works as a nurse” suena traducido y forzado. En inglés natural, basta con “My sister's a nurse.”",tags:["Everyday","Neutral"],fast:"mai-sísters-a-nörs"},{t:"speak",say:"She's my sister. She's a nurse, and she works at a hospital.",es:"Describe a un familiar: quién es y a qué se dedica.",tip:"No olvides la -s en “works”: es lo que distingue a she/he de I/you."},{t:"fact",body:"En inglés, muchas profesiones no cambian de forma entre hombres y mujeres (a diferencia del español, donde decimos “enfermero/enfermera”): nurse, doctor, teacher, engineer sirven para ambos.",note:"El género se entiende por el pronombre (he/she), no por la palabra de la profesión."},{t:"trivia",qs:[{q:"¿Cuál es la forma correcta con “she”?",opts:["She works at a hospital.","She work at a hospital.","She working hospital."],a:0,why:"Con he/she, el verbo lleva -s al final."},{q:"¿Qué significa “She's a nurse”?",opts:["Ella es enfermera","Ella es enfermo","Ella tiene una enfermera"],a:0,why:"Nurse significa enfermera/o, sin cambiar la palabra por género."}]}]},{t:"He's really funny",m:8,c:[{t:"mission",title:"You're describing a friend's personality.",goal:"Describe cómo es alguien, no solo cómo se ve.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","What's your brother like?","¿Cómo es tu hermano?"],["You","He's really funny, and he's super friendly.","Es muy chistoso, y es súper amigable."],["Sam","Sounds fun! Is he outgoing too?","¡Suena divertido! ¿También es extrovertido?"],["You","Yeah, he loves meeting new people.","Sí, le encanta conocer gente nueva."]]},{t:"discover",title:"Expresiones nuevas",items:[["What's he like?","¿Cómo es él (de personalidad)?","Neutral","uáts ji laik"],["He's funny.","Es chistoso.","Neutral","jis fáni"],["She's friendly.","Es amigable.","Neutral","chis fréndli"],["He's a bit shy.","Es un poco tímido.","Neutral","jis a bit chai"]]},{t:"understand",title:"“What's he/she like?” pregunta por personalidad",body:"“What's he like?” pregunta cómo es su personalidad (no su apariencia física ni si le gusta algo). Se responde con He's/She's + adjetivo: funny, friendly, shy, serious, kind, outgoing. Es diferente de “Does he like...?”, que pregunta si algo le gusta.",note:"“What does he look like?” es distinto: esa pregunta es sobre apariencia física, la verás en la siguiente lección."},{t:"choose",tag:"Elige la respuesta natural",q:"Te preguntan “What's your sister like?” Ella es muy amigable. ¿Qué respondes?",say:"What's your sister like?",opts:["She's really friendly.","She like friendly.","She's liking friendly."],a:0,why:"She's + adjetivo describe la personalidad. “She like friendly” no es una estructura correcta."},{t:"build",q:"Arma la frase: “Es un poco tímido.”",words:["shy","a","He's","bit"],a:"He's a bit shy"},{t:"real",book:"He has a personality that is very funny.",real:"He's really funny.",es:"La segunda es mucho más corta y natural para describir la personalidad de alguien.",ctx:"“He has a personality that is very funny” es correcto pero muy largo y forzado. Lo natural es ir directo: “He's really funny.”",tags:["Everyday","Neutral"],fast:"jis-ríli-fáni"},{t:"speak",say:"He's really funny and super friendly.",es:"Describe la personalidad de alguien que conoces.",tip:"“Really” y “super” le dan énfasis: úsalos con más entonación."},{t:"fact",body:"En inglés hay muchas palabras para decir “muy”: really, so, super, pretty (informal). “Pretty funny” no significa “bonito chistoso”, sino “bastante chistoso”.",note:"Escucha el tono: really/so/super suenan más entusiastas que “very”, que es más neutral."},{t:"trivia",qs:[{q:"¿Qué pregunta “What's he like?”",opts:["Cómo es su personalidad","Qué le gusta comer","Cómo se ve físicamente"],a:0,why:"Pregunta por personalidad, no apariencia ni gustos."},{q:"¿Cuál es la forma correcta de decir que alguien es tímido?",opts:["He's a bit shy.","He shy a bit.","He's shy a little bit is."],a:0,why:"He's + adjetivo es la estructura correcta."}]}]},{t:"What does she look like?",m:8,c:[{t:"mission",title:"You're describing someone's appearance.",goal:"Describe cómo se ve alguien físicamente.",wolf:"Let's go!"},{t:"dialog",lines:[["Sam","What does your sister look like?","¿Cómo se ve tu hermana?"],["You","She's tall, with short black hair.","Es alta, con pelo corto y negro."],["Sam","Does she wear glasses?","¿Usa lentes?"],["You","Yeah, she does.","Sí, sí usa."]]},{t:"discover",title:"Expresiones nuevas",items:[["What does she look like?","¿Cómo se ve ella?","Neutral","uát dos chi luk laik"],["She's tall.","Ella es alta.","Neutral","chis tol"],["He has short hair.","Él tiene pelo corto.","Neutral","ji jas chort jer"],["She wears glasses.","Ella usa lentes.","Neutral","chi uérs gláses"]]},{t:"understand",title:"be vs. have para describir apariencia",body:"Para altura y contextura usa be: She's tall, He's short. Para pelo, ojos y accesorios usa have: She has long hair, He has brown eyes. Es un error común usar “have” para todo (have tall) o “be” para todo (is hair long): cada característica va con su verbo.",note:"“Wear” se usa para ropa y accesorios que llevas puestos: wear glasses, wear a jacket."},{t:"choose",tag:"Elige la respuesta natural",q:"Describes a alguien alto con pelo largo. ¿Cuál es correcta?",say:"What does he look like?",opts:["He's tall and he has long hair.","He has tall and he's long hair.","He is have long hair tall."],a:0,why:"Altura va con be (he's tall), pelo va con have (he has long hair)."},{t:"build",q:"Arma la frase: “Ella usa lentes.”",words:["wears","glasses","She"],a:"She wears glasses"},{t:"real",book:"She possesses black hair that is short in length.",real:"She has short black hair.",es:"La segunda es la forma natural y común de describir el pelo de alguien.",ctx:"“She possesses black hair that is short in length” suena a traducción literal y muy formal. Lo natural es “She has short black hair.”",tags:["Everyday","Neutral"],fast:"chi-jas-chort-blak-jer"},{t:"speak",say:"She's tall, with short black hair, and she wears glasses.",es:"Describe la apariencia física de alguien que conoces.",tip:"Combina las tres frases con pausas cortas, como si dieras una descripción completa."},{t:"fact",body:"En inglés no es de mala educación describir físicamente a alguien (alto, bajo, con lentes) como parte de dar direcciones para reconocerlo, por ejemplo en un aeropuerto: “Look for a tall guy with glasses.”",note:"Esto es diferente a hacer comentarios sobre el peso de alguien, que sí se considera de mal gusto en muchos contextos."},{t:"trivia",qs:[{q:"¿Qué verbo usas para el pelo?",opts:["Have (she has long hair)","Be (she is long hair)","Wear (she wears long hair)"],a:0,why:"El pelo y los ojos van con have."},{q:"¿Qué verbo usas para la estatura?",opts:["Be (he's tall)","Have (he has tall)","Do (he does tall)"],a:0,why:"La estatura va con be: he's tall/short."}]}]},{t:"My friends",m:8,c:[{t:"mission",title:"Talking about your friend group.",goal:"Habla de tus amigos: quiénes son y cómo son.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","Do you have a lot of friends here?","¿Tienes muchos amigos aquí?"],["You","A few. My best friend is Ana. She's really kind.","Algunos. Mi mejor amiga es Ana. Es muy amable."],["Sam","How did you two meet?","¿Cómo se conocieron?"],["You","We met at school.","Nos conocimos en la escuela."]]},{t:"discover",title:"Expresiones nuevas",items:[["My best friend is...","Mi mejor amigo/a es...","Neutral","mai best frend is"],["We met at school.","Nos conocimos en la escuela.","Neutral","wi met at skúl"],["He's kind.","Es amable.","Neutral","jis káind"],["We've known each other for years.","Nos conocemos desde hace años.","Neutral","wivnóun ich óder for yiars"]]},{t:"understand",title:"“best friend” y “a few friends”",body:"My best friend is + nombre presenta a tu mejor amigo/a. Para hablar de cantidad de amigos sin dar un número exacto, usa a few (algunos, pocos) o a lot of (muchos): I have a few friends here / I have a lot of friends. “We met at...” se usa para decir dónde conociste a alguien.",note:"“Friend” no cambia con el género en inglés: sirve igual para amigo y amiga."},{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que tienes pocos amigos en la ciudad nueva. ¿Cuál es natural?",say:"Do you have a lot of friends here?",opts:["I have a few friends here.","I have few many friends.","I friends a few have."],a:0,why:"“A few” + sustantivo es la estructura natural para “algunos/pocos”."},{t:"build",q:"Arma la frase: “Nos conocimos en la escuela.”",words:["at","met","school","We"],a:"We met at school"},{t:"real",book:"I do not have a large quantity of friends in this city.",real:"I only have a few friends here.",es:"La segunda comunica lo mismo de forma mucho más natural y sencilla.",ctx:"“I do not have a large quantity of friends” suena a texto académico. En conversación, la gente dice “I only have a few friends here.”",tags:["Everyday","Neutral"],fast:"ai-óunli-jav-a-fiú-frends"},{t:"speak",say:"My best friend is really kind. We met at school.",es:"Habla de tu mejor amigo o amiga y de cómo se conocieron.",tip:"Suena natural: no necesitas hablar lento ni forzado."},{t:"fact",body:"En inglés, “a few” (algunos, pero se entiende como algo positivo/suficiente) y “few” (muy pocos, casi ninguno, algo negativo) tienen significados distintos, aunque se parecen mucho.",note:"“I have a few friends” suena bien; “I have few friends” suena un poco triste o solitario."},{t:"trivia",qs:[{q:"¿Qué significa “a few friends”?",opts:["Algunos amigos","Ningún amigo","Muchísimos amigos"],a:0,why:"“A few” significa una cantidad pequeña pero suficiente."},{q:"¿Cómo dices que conociste a alguien en el trabajo?",opts:["We met at work.","We meet in work.","We knowing at work."],a:0,why:"We met at + lugar es la estructura correcta en pasado."}]}]},{t:"Mission: Describe a person",m:10,c:[{t:"mission",title:"Show what you can do.",goal:"Vas a describir por completo a una persona: quién es, cómo es y cómo se ve.",wolf:"Ready?"},{t:"situation",intro:"A friend shows you a group photo and asks about the people in your life.",start:["Jamie","Who's this in your photo? Tell me about them!","¿Quién es este en tu foto? ¡Cuéntame de él/ella!"],branches:[{opt:"This is my sister, Ana. She's twenty-two, and she's really funny.",npc:"Nice! What does she do?",tag:"Completo y natural",best:true},{opt:"This is a person who is my relative and is female.",npc:"Oh... ok, what's her name?",tag:"Muy formal y raro",best:false,why:"Es gramaticalmente posible, pero nadie describe así a un familiar: suena forzado y poco natural."},{opt:"Sister.",npc:"Oh, cool... anything else?",tag:"Muy corto",best:false,why:"Responde la pregunta, pero no da ninguna información extra sobre ella."}],outro:"Nice! You just described someone in a natural way."},{t:"choose",tag:"Elige la respuesta natural",q:"Jamie pregunta “What does she do?” Tu hermana es enfermera. ¿Qué respondes?",opts:["She's a nurse. She works at a hospital.","She do nurse work.","She's have nurse."],a:0,why:"She's a/an + profesión, igual que practicaste en la Unidad 2."},{t:"build",q:"Arma la frase: “Es alta, con pelo corto.”",words:["hair","tall","with","short","She's"],a:"She's tall with short hair"},{t:"write",prompt:"Describe a una persona importante en tu vida: quién es, cuántos años tiene, cómo es su personalidad y cómo se ve físicamente.",placeholder:"This is my ... He/She is ... years old. He's/She's ... He/She has ...",model:"This is my sister, Ana. She's twenty-two. She's really kind and funny. She's tall, with short black hair.",tip:"Usa lo que ya practicaste: this is, he's/she's + edad, he's/she's + personalidad, he/she has + pelo."},{t:"speak",say:"This is my sister. She's twenty-two, she's really kind, and she has short black hair.",es:"Describe a alguien combinando quién es, su personalidad y su apariencia.",tip:"Encadena las frases con pausas cortas, sin prisa."},{t:"trivia",qs:[{q:"¿Qué aprendiste a hacer en esta unidad?",opts:["Presentar y describir a personas: familia, personalidad y apariencia","Solo hablar de comida","Solo pedir direcciones"],a:0,why:"Toda la unidad giró en torno a describir a las personas en tu vida."},{q:"¿Qué verbo usas para el pelo y los ojos?",opts:["Have","Be","Wear"],a:0,why:"El pelo y los ojos siempre van con have: she has brown eyes."},{q:"¿Qué pregunta “What's he like?”",opts:["Su personalidad","Su apariencia física","Su edad"],a:0,why:"Pregunta por cómo es la personalidad de alguien."}]}]}],["Describir a tu familia y sus relaciones.", "Usar posesivos y adjetivos para hablar de personas.", "Diferenciar be y have para describir personalidad y apariencia física.", "Describir a un amigo o familiar de forma completa."],"#9B59D0"),

{t:"Are you awake?",m:7,c:[
{t:"mission",title:"It's 7:00 AM. Your friend texts you.",goal:"Contesta mensajes sobre tu rutina de la mañana.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","Are you awake?","¿Estás despierto?"],["You","Yeah, I'm getting ready.","Sí, me estoy alistando."],["Sam","What time do you leave?","¿A qué hora sales?"],["You","Around eight.","Como a las ocho."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Are you awake?","¿Estás despierto?","Everyday","ar yu awéik"],["I'm getting ready.","Me estoy alistando.","Everyday","aim guéding rédi"],["What time do you leave?","¿A qué hora sales?","Neutral","uát táim du yu liv"],["Around eight.","Como a las ocho.","Everyday","aráund éit"]]},
{t:"understand",title:"Hábitos vs. lo que pasa ahora",body:"Para hábitos usamos el presente simple: I wake up at seven. Para lo que pasa en este momento usamos I'm + verbo con -ing: I'm getting ready.",note:"“Around eight” = alrededor de las ocho. Es muy común para horas aproximadas."},
{t:"choose",tag:"Elige la respuesta natural",q:"Tu amigo escribe: “Are you awake?” Ya estás despierto. ¿Qué respondes?",say:"Are you awake?",opts:["Yeah, I'm getting ready.","Yes, I wake up at seven every day of my life.","No, awake."],a:0,why:"Contesta lo que pasa ahora: corto y natural."},
{t:"choose",tag:"Listening",q:"Escucha. ¿A qué hora se despierta?",say:"I wake up at seven.",opts:["A las siete","A las diecisiete","A las once"],a:0,why:"“Seven” = siete."},
{t:"build",q:"Arma la frase: “¿A qué hora sales?”",words:["time","What","leave","you","do"],a:"What time do you leave"},
{t:"real",book:"I am going to leave at eight.",real:"I'm gonna leave around eight.",es:"Voy a salir como a las ocho.",ctx:"“Gonna” es la forma hablada de “going to”. Se oye mucho, pero en un correo o en un examen escribe “going to”.",tags:["Informal","Everyday"],fast:"aim gána liv aráund éit"},
{t:"speak",say:"I'm getting ready. I leave around eight.",es:"Cuenta tu mañana en dos frases.",tip:"“Around” suena casi como “aráund”, con el acento en la segunda sílaba."},
{t:"fact",body:"En mensajes de texto en inglés es muy común usar el presente continuo (“I'm getting ready”) para hablar de algo que pasa justo en ese momento, igual que en español con “estoy + gerundio”.",note:"“Gonna”, “wanna” y “gotta” son formas habladas súper comunes: going to, want to, got to."},
{t:"trivia",qs:[
{q:"¿Qué forma usamos para algo que pasa ahora mismo?",opts:["I'm + verbo -ing","I + verbo simple","I will + verbo"],a:0,why:"El presente continuo (be + -ing) describe lo que pasa en este momento."},
{q:"¿Qué significa “Around eight”?",opts:["Como a las ocho","Exactamente a las ocho","Después de las ocho"],a:0,why:"“Around” significa aproximadamente."}]}]},
{t:"What time is it?",m:8,c:[{t:"mission",title:"You need to know the time.",goal:"Pregunta y di la hora en inglés.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","What time is it?","¿Qué hora es?"],["You","It's a quarter past six.","Son las seis y cuarto."],["Sam","Already? We're late!","¿Ya? ¡Vamos tarde!"],["You","Don't worry, we have time.","No te preocupes, tenemos tiempo."]]},{t:"discover",title:"Expresiones nuevas",items:[["What time is it?","¿Qué hora es?","Neutral","uát táim is it"],["It's six o'clock.","Son las seis en punto.","Neutral","its six oklók"],["It's half past six.","Son las seis y media.","Neutral","its jaf past six"],["It's a quarter to seven.","Son cuarto para las siete.","Neutral","its a kuárter tu séven"]]},{t:"understand",title:"Decir la hora en inglés",body:"Para horas exactas: It's six o'clock. Para y media: It's half past six. Para y cuarto: It's a quarter past six. Para cuarto para: It's a quarter to seven (es decir, 6:45). También puedes decir la hora de forma directa, como en español: It's six fifteen.",note:"En Estados Unidos también se usa mucho AM/PM en vez del formato de 24 horas."},{t:"choose",tag:"Elige la respuesta natural",q:"Son las 6:30. ¿Cuál es la forma correcta de decirlo?",say:"What time is it?",opts:["It's half past six.","It's half six past.","It's six half past."],a:0,why:"“It's half past + hora” es la estructura correcta para “y media”."},{t:"build",q:"Arma la frase: “Son las siete en punto.”",words:["o'clock","seven","It's"],a:"It's seven o'clock"},{t:"real",book:"The current time is six forty-five.",real:"It's a quarter to seven.",es:"Las dos comunican la misma hora, pero la segunda es la forma común de decirla hablando.",ctx:"“The current time is...” suena a anuncio o reloj automático. Al hablar, la gente usa “a quarter to/past”.",tags:["Neutral","Everyday"],fast:"its-a-kuárter-tu-séven"},{t:"speak",say:"It's a quarter past six. We have time.",es:"Di la hora y tranquiliza a alguien que cree que van tarde.",tip:"Habla con calma: el mensaje es que no hay prisa."},{t:"fact",body:"En el Reino Unido y Estados Unidos, decir la hora con “past” y “to” (a quarter past, a quarter to) es muy común al hablar, aunque los relojes digitales muestren la hora exacta (6:15, 6:45).",note:"Si no estás seguro de usar “past/to”, siempre puedes decir la hora directamente: it's six fifteen."},{t:"trivia",qs:[{q:"¿Cómo se dice “las seis y cuarto”?",opts:["A quarter past six","A quarter six past","Six quarter past"],a:0,why:"A quarter past + hora es la estructura correcta."},{q:"¿Qué significa “a quarter to seven”?",opts:["6:45","7:15","7:45"],a:0,why:"“To” indica que faltan 15 minutos para las siete."}]}]},{t:"My weekday",m:8,c:[{t:"mission",title:"Someone asks about your routine.",goal:"Describe tu rutina de un día entre semana.",wolf:"Let's go!"},{t:"dialog",lines:[["Sam","What's a normal weekday like for you?","¿Cómo es un día normal para ti?"],["You","I wake up at seven, I have breakfast, and I go to work at eight.","Me despierto a las siete, desayuno y voy al trabajo a las ocho."],["Sam","What time do you get home?","¿A qué hora llegas a casa?"],["You","Usually around six.","Normalmente como a las seis."]]},{t:"discover",title:"Expresiones nuevas",items:[["I wake up at seven.","Me despierto a las siete.","Neutral","ai uéik ap at séven"],["I have breakfast.","Desayuno.","Neutral","ai jav brékfast"],["I go to work.","Voy al trabajo.","Neutral","ai góu tu uérk"],["I get home.","Llego a casa.","Neutral","ai guet jóum"]]},{t:"understand",title:"Presente simple para rutinas",body:"Para hablar de tu rutina diaria (lo que haces siempre o normalmente), usa el presente simple: I wake up, I have, I go, I get home. Con “I”, el verbo no cambia; recuerda que solo se agrega -s con he/she/it.",note:"“Usually” (normalmente) es muy útil para hablar de rutinas: I usually wake up at seven."},{t:"choose",tag:"Elige la respuesta natural",q:"Hablas de tu rutina diaria. ¿Cuál es correcta?",say:"What time do you wake up?",opts:["I wake up at seven.","I waking up at seven.","I woke up at seven every day."],a:0,why:"Presente simple (I wake up) es correcto para rutinas; “I waking” no es una forma correcta sola."},{t:"build",q:"Arma la frase: “Voy al trabajo a las ocho.”",words:["at","work","eight","I","to","go"],a:"I go to work at eight"},{t:"real",book:"Every morning, I consume my breakfast at home.",real:"I have breakfast every morning.",es:"Las dos comunican la misma idea, pero la segunda suena natural y cotidiana.",ctx:"“I consume my breakfast” suena raro y muy formal para algo tan cotidiano. Lo natural es “I have breakfast.”",tags:["Everyday","Neutral"],fast:"ai-jav-brékfast"},{t:"speak",say:"I wake up at seven, I have breakfast, and I go to work at eight.",es:"Describe tu rutina de la mañana en tres pasos.",tip:"Une las tres frases con “and” y mantén un ritmo constante."},{t:"fact",body:"En inglés, “usually”, “always”, “sometimes” y “never” van justo antes del verbo principal (pero después de “to be”): I usually wake up early. I'm always tired on Mondays.",note:"Estos adverbios de frecuencia son clave para hablar con naturalidad de rutinas."},{t:"trivia",qs:[{q:"¿Cuál es la forma correcta para tu rutina diaria?",opts:["I wake up at seven.","I am wake up at seven.","I waked up at seven."],a:0,why:"El presente simple no necesita “am” ni forma de pasado para rutinas."},{q:"¿Dónde va “usually” en una frase?",opts:["Antes del verbo principal","Al final siempre","Antes del sujeto"],a:0,why:"Los adverbios de frecuencia van antes del verbo principal: I usually wake up early."}]}]},{t:"School and work",m:8,c:[{t:"mission",title:"Talking about your week.",goal:"Habla de tu escuela o trabajo y de tu horario.",wolf:"Ready?"},{t:"dialog",lines:[["Sam","Do you work or go to school?","¿Trabajas o estudias?"],["You","Both, actually. I study in the morning and work in the afternoon.","Las dos cosas, en realidad. Estudio en la mañana y trabajo en la tarde."],["Sam","That's a busy schedule!","¡Qué horario tan ocupado!"],["You","Yeah, but I like it.","Sí, pero me gusta."]]},{t:"discover",title:"Expresiones nuevas",items:[["I go to school.","Voy a la escuela.","Neutral","ai góu tu skúl"],["I have class at nine.","Tengo clase a las nueve.","Neutral","ai jav klas at nain"],["I have a busy schedule.","Tengo un horario ocupado.","Neutral","ai jav a bísi skéyul"],["in the morning / afternoon / evening","en la mañana / tarde / noche","Neutral","in de mórning / afternún / ívning"]]},{t:"understand",title:"in the morning, in the afternoon, at night",body:"Usa in the morning, in the afternoon, in the evening para partes del día, pero at night para la noche (cuando duermes): I work in the evening, I sleep at night. Para decir “tengo clase/trabajo a las X”, usa I have class/work at + hora.",note:"“Busy” significa ocupado(a): a busy schedule = un horario ocupado."},{t:"choose",tag:"Elige la respuesta natural",q:"Trabajas de noche. ¿Cuál es correcta?",say:"When do you work?",opts:["I work at night.","I work in the night.","I work on night."],a:0,why:"Se usa “at night”, no “in the night”, para hablar de la noche."},{t:"build",q:"Arma la frase: “Tengo clase a las nueve.”",words:["nine","have","I","class","at"],a:"I have class at nine"},{t:"real",book:"I possess a schedule that is very occupied.",real:"I have a really busy schedule.",es:"La segunda es la forma natural de decir que tienes un horario muy ocupado.",ctx:"“I possess a schedule that is very occupied” suena forzado y traducido literalmente. Lo natural es “I have a really busy schedule.”",tags:["Everyday","Neutral"],fast:"ai-jav-a-rili-bísi-skéyul"},{t:"speak",say:"I study in the morning and work in the afternoon.",es:"Habla de tu horario de escuela o trabajo.",tip:"Marca bien la diferencia entre “morning” y “evening” al pronunciarlas."},{t:"fact",body:"En muchos países de habla inglesa, es común que estudiantes universitarios trabajen medio tiempo mientras estudian, así que “I study and work” es una respuesta muy normal a “What do you do?”",note:"No hace falta explicar por qué: simplemente es parte de la vida de muchas personas."},{t:"trivia",qs:[{q:"¿Cuál es correcta para hablar de la noche (para dormir)?",opts:["I sleep at night.","I sleep in the night.","I sleep on night."],a:0,why:"Se usa “at night” para la noche."},{q:"¿Qué significa “a busy schedule”?",opts:["Un horario ocupado","Un horario libre","Un horario roto"],a:0,why:"Busy significa ocupado."}]}]},{t:"Free time",m:8,c:[{t:"mission",title:"Talking about the weekend.",goal:"Habla de qué haces en tu tiempo libre.",wolf:"Let's go!"},{t:"dialog",lines:[["Sam","What do you do in your free time?","¿Qué haces en tu tiempo libre?"],["You","I usually watch movies or hang out with friends.","Normalmente veo películas o salgo con amigos."],["Sam","Nice! Do you ever go hiking?","¡Qué bien! ¿Alguna vez vas de excursión?"],["You","Sometimes, on weekends.","A veces, los fines de semana."]]},{t:"discover",title:"Expresiones nuevas",items:[["in my free time","en mi tiempo libre","Neutral","in mai fri táim"],["I hang out with friends.","Salgo con amigos.","Everyday","ai jang áut uít frends"],["I watch movies.","Veo películas.","Neutral","ai uách múvis"],["on weekends","los fines de semana","Neutral","on uikénds"]]},{t:"understand",title:"Adverbios de frecuencia: always, usually, sometimes, never",body:"Estos adverbios describen qué tan seguido haces algo: always (siempre), usually (normalmente), sometimes (a veces), never (nunca). Van antes del verbo principal: I sometimes go hiking. I never watch TV in the morning.",note:"“Hang out” es una expresión muy informal y común para “pasar el rato/salir con alguien”."},{t:"choose",tag:"Elige la respuesta natural",q:"A veces vas de excursión, no siempre. ¿Cuál es correcta?",say:"Do you ever go hiking?",opts:["I sometimes go hiking.","I go sometimes hiking.","I hiking sometimes go."],a:0,why:"El adverbio de frecuencia va antes del verbo principal: I sometimes go."},{t:"build",q:"Arma la frase: “Salgo con amigos.”",words:["with","hang","I","out","friends"],a:"I hang out with friends"},{t:"real",book:"During my free time, I engage in the activity of watching films.",real:"In my free time, I watch movies.",es:"La segunda es corta, clara y es como realmente habla la gente.",ctx:"“I engage in the activity of watching films” suena a reporte académico. En una conversación normal, la gente dice “I watch movies.”",tags:["Everyday","Neutral"],fast:"ai-uách-múvis"},{t:"speak",say:"In my free time, I usually watch movies or hang out with friends.",es:"Habla de lo que haces en tu tiempo libre.",tip:"“Usually” suena como “iúshuali”: practícalo despacio primero."},{t:"fact",body:"“Hang out” es una de las expresiones más usadas entre hablantes jóvenes de inglés para decir “pasar tiempo/socializar”, y funciona tanto para actividades planeadas como informales.",note:"“Let's hang out sometime” es una forma muy natural de invitar a alguien a pasar tiempo juntos."},{t:"trivia",qs:[{q:"¿Dónde va el adverbio de frecuencia en una frase?",opts:["Antes del verbo principal","Después del verbo siempre","Al inicio de la frase siempre"],a:0,why:"Adverbios como sometimes/usually/never van antes del verbo principal."},{q:"¿Qué significa “hang out with friends”?",opts:["Salir/pasar tiempo con amigos","Colgar la ropa con amigos","Trabajar con amigos"],a:0,why:"Es una expresión informal para pasar tiempo juntos."}]}]},{t:"Mission: A normal day",m:10,c:[{t:"mission",title:"Show what you can do.",goal:"Vas a describir un día completo: tu rutina, tu horario y tu tiempo libre.",wolf:"Ready?"},{t:"situation",intro:"A new coworker wants to know more about your daily routine.",start:["Jordan","So, what's a typical day like for you?","Entonces, ¿cómo es un día típico para ti?"],branches:[{opt:"I wake up at seven, work until six, and in my free time I hang out with friends.",npc:"Sounds like a good balance! What time do you usually get home?",tag:"Completo y natural",best:true},{opt:"I do things du
