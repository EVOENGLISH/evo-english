an.",wolf:"Ready?"},{t:"situation",intro:"You want to invite a friend to do something this weekend.",start:["Sam","Hey! What's up?","¡Oye! ¿Qué onda?"],branches:[{opt:"Hey! Do you want to grab lunch on Saturday? How about noon?",npc:"Sounds great! Where should we meet?",tag:"Completo y natural",best:true},{opt:"Saturday. Free. Lunch.",npc:"Um, free for what exactly?",tag:"Demasiado cortado",best:false,why:"No queda claro qué estás proponiendo."},{opt:"I am formally inviting you to a midday meal.",npc:"Haha, sure, what time?",tag:"Demasiado formal",best:false,why:"Suena raro entre amigos, aunque es gramaticalmente correcto."}],outro:"Nice! You just made a plan naturally."},{t:"choose",tag:"Elige la respuesta natural",q:"Sam pregunta “Where should we meet?” ¿Cuál es una respuesta natural?",opts:["How about at the entrance?","Entrance about how?","At entrance how about?"],a:0,why:"How about + lugar/hora? es la estructura natural para sugerir algo."},{t:"build",q:"Arma la frase: “Voy a estar libre el sábado.”",words:["free","going","I'm","to","Saturday","be","on"],a:"I'm going to be free on Saturday"},{t:"speak",say:"Do you want to grab lunch on Saturday? How about noon? It's a plan!",es:"Invita a alguien y confirma el plan por completo.",tip:"Cierra con entusiasmo: “It's a plan!” suena natural y positivo."},{t:"trivia",qs:[{q:"¿Qué estructura usas para planes futuros ya decididos?",opts:["be going to + verbo","be + verbo simple","have + verbo"],a:0,why:"“Going to” es natural para planes ya decididos."},{q:"¿Cómo aceptas una invitación con entusiasmo?",opts:["I'd love to!","I go yes.","Yes want."],a:0,why:"“I'd love to!” es entusiasta y natural."}]}]},{t:"Final mission: A full day",m:14,c:[{t:"mission",title:"Your final challenge: a full day in English.",goal:"Vas a combinar todo lo que aprendiste en A1: presentarte, hablar de tu rutina, comer fuera, moverte por la ciudad, comprar algo y hacer planes.",wolf:"Ready for this?"},{t:"dialog",lines:[["LEVO","You've come a long way since Unit 1!","¡Has avanzado mucho desde la Unidad 1!"],["You","Yeah, I can actually have real conversations now.","Sí, ya puedo tener conversaciones de verdad."],["LEVO","Let's put it all together in one final mission.","Vamos a juntarlo todo en una misión final."],["You","Let's go!","¡Vamos!"]]},{t:"discover",title:"Repaso rápido: frases clave de todo A1",items:[["Nice to meet you.","Mucho gusto.","Neutral","nais tu mít yu"],["I'm going to visit my parents.","Voy a visitar a mis papás.","Neutral","aim góing tu vísit mai párents"],["Can I have the check, please?","¿Me trae la cuenta, por favor?","Neutral","kan ai jav de chek plis"],["Excuse me, where is...?","Disculpe, ¿dónde está...?","Neutral","exkiús mi uér is"]]},{t:"understand",title:"Lo que ya puedes hacer en inglés",body:"Después de esta unidad, puedes: presentarte y hablar de ti, describir a las personas en tu vida, contar tu rutina diaria, pedir comida y bebida, pedir direcciones y usar transporte, comprar cosas y hacer devoluciones, hacer planes con amigos, y manejarte en un viaje (aeropuerto, hotel, problemas). Eso es una base real para comunicarte en inglés todos los días.",note:"Cada vez que uses una de estas frases en la vida real, estarás practicando lo que ya aprendiste."},{t:"situation",intro:"It's a full day: you meet someone new at a café before heading out to explore the city.",start:["Alex","Hi! Is this seat taken? I'm Alex, by the way.","Hola, ¿este lugar está ocupado? Por cierto, soy Alex."],branches:[{opt:"Hi Alex, I'm {n}. Nice to meet you! I'm actually looking for the museum, do you know where it is?",npc:"Sure! Go straight, then turn left. It's ten minutes away.",tag:"Completo y natural",best:true},{opt:"Seat free. Museum where.",npc:"Sorry, what are you looking for exactly?",tag:"Demasiado cortado",best:false,why:"Se entienden palabras sueltas, pero no una pregunta natural completa."},{opt:"I am seeking directional guidance to a cultural institution.",npc:"Haha, sorry, the museum? It's this way.",tag:"Demasiado formal",best:false,why:"Es gramaticalmente posible, pero nadie habla así en una cafetería."}],outro:"Amazing! You just combined introductions and directions naturally."},{t:"choose",tag:"Elige la respuesta natural",q:"Más tarde, en el museo, alguien te pregunta “What do you do?” ¿Qué respondes?",opts:["I'm a design student, and I'm from Mexico.","I do student design Mexico.","Mexico student I am design."],a:0,why:"I'm a/an + profesión + I'm from + lugar es la estructura correcta, como practicaste en la Unidad 2."},{t:"build",q:"Arma la frase: “Tengo un horario ocupado, pero me encanta viajar.”",words:["busy","I","schedule","but","have","a","love","I","traveling"],a:"I have a busy schedule but I love traveling"},{t:"write",prompt:"Escribe un resumen de tu día ideal usando inglés de esta unidad: a quién conociste, qué comiste, a dónde fuiste y qué planes hiciste.",placeholder:"I met ... I had ... I went to ... I'm going to ...",model:"I met someone new at a café. I had tacos for lunch. I went to the museum. I'm going to see a movie with my new friend this weekend.",tip:"Usa al menos cuatro frases distintas de todo lo que aprendiste en A1."},{t:"speak",say:"I'm from Mexico, I love traveling, and today I made a new friend, tried new food, and explored the city.",es:"Cuenta tu día completo en una sola respuesta larga.",tip:"Tómate tu tiempo: no necesitas decirlo todo rápido, solo con claridad."},{t:"fact",body:"Completar el nivel A1 significa que ya puedes sobrevivir y comunicarte en situaciones cotidianas reales en inglés: presentarte, comer fuera, viajar, comprar y hacer planes. Esa es una base sólida para seguir creciendo.",note:"El siguiente nivel, A2, te va a ayudar a contar historias, hablar del pasado y comunicarte con más soltura."},{t:"trivia",qs:[{q:"¿Qué lograste a lo largo de todo el nivel A1?",opts:["Comunicarte en situaciones cotidianas reales en inglés","Solo memorizar vocabulario suelto","Solo aprender gramática sin practicarla"],a:0,why:"A1 te dio las bases para manejarte en conversaciones reales del día a día."},{q:"“I'm going to visit my parents” es un ejemplo de:",opts:["Un plan futuro ya decidido","Una rutina diaria","Una descripción de personalidad"],a:0,why:"“Going to” se usa para planes futuros que ya decidiste."},{q:"¿Qué nivel sigue después de A1?",opts:["A2","B1","C1"],a:0,why:"A2 es el siguiente nivel, donde profundizarás mucho más."}]}]}],["Combinar todo el vocabulario y las estructuras aprendidas en A1.", "Sostener conversaciones reales en situaciones cotidianas variadas.", "Aplicar presentaciones, comida, direcciones, compras y planes en un solo reto.", "Confirmar que estás listo/a para avanzar al nivel A2."],"#D4AF37")
],A2:[
U(1,"Life in Motion","clock","Habla de tu rutina, lo que haces ahora mismo y con qué frecuencia lo haces.",[
{t:"Present Simple: Everyday Life",m:8,c:[
{t:"mission",title:"Someone asks about your daily life.",goal:"Habla de tu rutina diaria usando el presente simple, con oraciones completas.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","So, what's your daily routine like?","Entonces, ¿cómo es tu rutina diaria?"],["You","I wake up at seven and I go to work at eight.","Me despierto a las siete y voy a trabajar a las ocho."],["Sam","Wow, that's early! Do you like your job?","¡Wow, qué temprano! ¿Te gusta tu trabajo?"],["You","Yes, I do. It's interesting.","Sí. Es interesante."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I wake up at seven.","Me despierto a las siete.","Everyday","ai uéik ap at séven"],["She works from home.","Ella trabaja desde casa.","Neutral","shi uorks from jóum"],["Do you like your job?","¿Te gusta tu trabajo?","Neutral","du yu láik yor yab"],["He doesn't drink coffee.","Él no toma café.","Neutral","ji dásent drink cófi"]]},
{t:"understand",title:"La -s de la tercera persona no es opcional",body:"En presente simple, con he/she/it agregamos -s (o -es) al verbo: work → works, go → goes, watch → watches. En preguntas y negaciones usamos do/does: Does he work? / He doesn't work. Es uno de los errores más comunes en A2, así que vale la pena practicarlo hasta que salga automático.",note:"Con I/you/we/they, el verbo no cambia: I work, you work, they work."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alguien te pregunta: “What time do you wake up?” ¿Qué respondes?",opts:["I wake up at seven.","I am waking up at seven right now.","I woke up seven."],a:0,why:"Para hablar de una rutina (algo que pasa siempre) usamos presente simple: I wake up at seven."},
{t:"choose",tag:"Detecta el error",q:"Hay un error en esta oración: “She work from home.” ¿Cuál es?",opts:["Falta la -s: she works.","Sobra “from”.","No hay ningún error."],a:0,why:"Con he/she/it, el verbo lleva -s: she works, not she work."},
{t:"build",q:"Arma la frase: “Él no toma café.”",words:["doesn't","coffee","He","drink"],a:"He doesn't drink coffee"},
{t:"real",book:"I go to my place of employment at eight o'clock.",real:"I go to work at eight.",es:"Voy al trabajo a las ocho.",ctx:"“Go to work” es la forma natural de decir esto. La versión del “libro” suena forzada y nadie la usa así en una conversación real.",tags:["Neutral","Everyday"],fast:"ai góu tu uérk at éit"},
{t:"speak",say:"I wake up at seven and I go to work at eight.",es:"Practica describir tu rutina.",tip:"Enlaza las palabras: “wake up” suena como “uéik-áp”."},
{t:"fact",body:"En inglés, muchos verbos de rutina van casi siempre con las mismas preposiciones: go TO work, arrive AT 8, work FROM home. Aprenderlos como bloques (“go to work”, no solo “go”) te ayuda a sonar natural.",note:"Fíjate en estas combinaciones cuando leas o escuches inglés: son más útiles que memorizar reglas sueltas."},
{t:"trivia",qs:[
{q:"¿Cuál es la forma correcta con “she”?",opts:["She works from home.","She work from home.","She working from home."],a:0,why:"Con he/she/it el verbo lleva -s: she works."},
{q:"¿Cómo se pregunta “¿Te gusta tu trabajo?”",opts:["Do you like your job?","You like your job?","Do you liking your job?"],a:0,why:"Las preguntas en presente simple usan do/does + verbo base."}]}]},
{t:"Present Continuous: Right Now",m:8,c:[
{t:"mission",title:"Someone video-calls you in the middle of something.",goal:"Describe lo que estás haciendo en este momento usando el presente continuo.",wolf:"Let's go!"},
{t:"dialog",lines:[["Alex","Hey! What are you doing?","¡Oye! ¿Qué estás haciendo?"],["You","I'm cooking dinner right now.","Estoy cocinando la cena ahora mismo."],["Alex","Nice! Is anyone helping you?","¡Qué bien! ¿Alguien te está ayudando?"],["You","Yes, my sister is helping me.","Sí, mi hermana me está ayudando."]]},
{t:"discover",title:"Expresiones nuevas",items:[["What are you doing?","¿Qué estás haciendo?","Everyday","juat ar yu dúin"],["I'm cooking dinner.","Estoy cocinando la cena.","Everyday","aim cúkin díner"],["She's studying right now.","Ella está estudiando ahora mismo.","Neutral","shis stádiin rait náu"],["They aren't listening.","Ellos no están escuchando.","Neutral","déi árent lísenin"]]},
{t:"understand",title:"El presente continuo = be + verbo-ing",body:"Se forma con am/is/are + verbo terminado en -ing: I'm cooking, she's studying, they aren't listening. Lo usamos para acciones que están pasando justo ahora, o algo temporal que está pasando “estos días” (aunque no en este segundo exacto).",note:"Algunos verbos casi nunca se usan en continuo, como “like”, “know”, “want”: decimos I like it, no I'm liking it."},
{t:"choose",tag:"Elige la respuesta natural",q:"Tu amigo te pregunta “What are you doing?” mientras cocinas. ¿Qué respondes?",opts:["I'm cooking dinner.","I cook dinner.","I cooked dinner."],a:0,why:"Como está pasando justo ahora, usamos presente continuo: I'm cooking."},
{t:"choose",tag:"Listening",say:"She's studying right now, so she can't talk.",q:"Escucha y elige qué significa.",opts:["Ella está estudiando ahora mismo, así que no puede hablar.","Ella estudió ayer.","Ella nunca estudia."],a:0,why:"“Right now” + presente continuo = algo que está pasando en este momento."},
{t:"build",q:"Arma la frase: “Ellos no están escuchando.”",words:["listening","aren't","They"],a:"They aren't listening"},
{t:"real",book:"I am currently preparing the evening meal.",real:"I'm cooking dinner right now.",es:"Estoy cocinando la cena ahora mismo.",ctx:"“Right now” se agrega naturalmente para enfatizar que es en este momento exacto; la versión del libro suena a manual de instrucciones.",tags:["Everyday","Informal"],fast:"aim cúkin díner rait náu"},
{t:"speak",say:"I'm cooking dinner right now.",es:"Practica decir qué estás haciendo ahora mismo.",tip:"Sube ligeramente el tono en “right now” para enfatizar el momento."},
{t:"fact",body:"En inglés hablado, casi siempre contraemos el presente continuo: “I'm”, “she's”, “they're”. Decir “I am cooking” completo, sin contraer, puede sonar demasiado formal o incluso como si estuvieras enojado.",note:"Contraer no es informal ni incorrecto: es la forma normal de hablar."},
{t:"trivia",qs:[
{q:"¿Cómo se dice “Ella está estudiando ahora mismo”?",opts:["She's studying right now.","She study right now.","She's studies right now."],a:0,why:"be + verbo-ing: she's studying."},
{q:"¿Qué verbo casi nunca se usa en presente continuo?",opts:["like","cook","study"],a:0,why:"Verbos de estado como “like”, “know”, “want” casi siempre van en presente simple."}]}]},
{t:"Simple or Continuous?",m:9,c:[
{t:"mission",title:"Someone is confused about your plans.",goal:"Elige correctamente entre presente simple y presente continuo según la situación.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","Do you usually walk to work?","¿Normalmente caminas al trabajo?"],["You","Yes, I do. But today I'm taking the bus.","Sí. Pero hoy estoy tomando el autobús."],["Sam","Why? Is something wrong?","¿Por qué? ¿Pasa algo?"],["You","No, it's just raining today.","No, es que hoy está lloviendo."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I usually walk to work.","Normalmente camino al trabajo.","Neutral","ai yúshuali uok tu uérk"],["Today I'm taking the bus.","Hoy estoy tomando el autobús.","Everyday","tudéi aim téikin de bás"],["It's raining today.","Hoy está lloviendo.","Everyday","its réinin tudéi"],["These days, I'm working from home.","Estos días, estoy trabajando desde casa.","Neutral","díis déis aim uérkin from jóum"]]},
{t:"understand",title:"Rutina vs. algo temporal",body:"Usamos presente simple para hábitos y verdades generales: I walk to work (siempre). Usamos presente continuo para algo que pasa ahora o en un periodo temporal: I'm taking the bus (hoy, no siempre). Palabras como “usually”, “today”, “right now”, “these days” te ayudan a elegir cuál usar.",note:"Compara: I work from home (siempre) vs. I'm working from home this week (algo temporal)."},
{t:"choose",tag:"Elige la respuesta natural",q:"“Normalmente camino al trabajo, pero hoy...” ¿Cómo continúas la idea de forma natural?",opts:["...I'm taking the bus.","...I take the bus.","...I took the bus."],a:0,why:"“Hoy” marca algo temporal y diferente de lo normal, así que usamos presente continuo."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “Usually, I'm walking to work.” ¿Cuál es?",opts:["Con “usually” se usa presente simple: I usually walk to work.","Falta el sujeto.","No hay ningún error."],a:0,why:"“Usually” es una palabra de hábito, así que pide presente simple."},
{t:"build",q:"Arma la frase: “Estos días, estoy trabajando desde casa.”",words:["days,","working","These","I'm","from","home"],a:"These days, I'm working from home"},
{t:"real",book:"At this moment in time, it is precipitating.",real:"It's raining right now.",es:"Está lloviendo ahora mismo.",ctx:"Nadie dice “precipitating” en una conversación normal: “It's raining” es simple, natural y se entiende perfecto.",tags:["Everyday"],fast:"its réinin rait náu"},
{t:"speak",say:"I usually walk to work, but today I'm taking the bus.",es:"Practica contrastar tu rutina con algo de hoy.",tip:"Haz una pequeña pausa después de la coma, antes de “but”."},
{t:"fact",body:"Los hablantes nativos deciden entre presente simple y continuo casi sin pensarlo, guiándose por palabras clave: “usually/always/every day” = simple; “now/right now/at the moment/today” = continuo.",note:"Si dudas, pregúntate: ¿es siempre así, o solo está pasando ahora/hoy?"},
{t:"trivia",qs:[
{q:"¿Qué palabra pide presente continuo?",opts:["right now","usually","every day"],a:0,why:"“Right now” indica que algo está pasando en este momento."},
{q:"Completa: “She ___ coffee every morning.”",opts:["drinks","is drinking","drink"],a:0,why:"“Every morning” es un hábito, así que va en presente simple: she drinks."}]}]},
{t:"How Often…? Frequency",m:7,c:[
{t:"mission",title:"A new friend wants to know your habits.",goal:"Habla de con qué frecuencia haces cosas, usando always/usually/often/sometimes/never.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","How often do you exercise?","¿Con qué frecuencia haces ejercicio?"],["You","I usually exercise three times a week.","Normalmente hago ejercicio tres veces por semana."],["Maya","Do you ever run in the morning?","¿Alguna vez corres en la mañana?"],["You","Sometimes, but I usually run at night.","A veces, pero normalmente corro en la noche."]]},
{t:"discover",title:"Expresiones nuevas",items:[["How often do you exercise?","¿Con qué frecuencia haces ejercicio?","Neutral","jau óften du yu éksersais"],["I always drink water in the morning.","Siempre tomo agua en la mañana.","Everyday","ai ólueis drink uóter"],["I never skip breakfast.","Nunca me salto el desayuno.","Everyday","ai néver skip brékfast"],["She rarely goes to bed late.","Ella rara vez se acuesta tarde.","Neutral","shi rérli góus tu bed léit"]]},
{t:"understand",title:"Los adverbios de frecuencia van antes del verbo",body:"Palabras como always, usually, often, sometimes, rarely, never normalmente van ANTES del verbo principal: I always drink water. Pero van DESPUÉS del verbo “to be”: I am always tired. También puedes usar frases como “three times a week” o “once a month”, que van al final de la oración.",note:"Orden típico de frecuencia: always (100%) > usually > often > sometimes > rarely > never (0%)."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Dónde va “always” en esta oración: “I ___ drink water in the morning.”?",opts:["I always drink water in the morning.","I drink always water in the morning.","Always I drink water in the morning."],a:0,why:"El adverbio de frecuencia va justo antes del verbo principal: I always drink."},
{t:"choose",tag:"Elige la respuesta natural",q:"Con el verbo “to be”, ¿dónde va el adverbio? “I ___ tired on Mondays.”",opts:["I am always tired on Mondays.","I always am tired on Mondays.","Always I am tired on Mondays."],a:0,why:"Con “to be”, el adverbio va después: am always."},
{t:"build",q:"Arma la frase: “Nunca me salto el desayuno.”",words:["skip","never","breakfast","I"],a:"I never skip breakfast"},
{t:"real",book:"On a regular basis, I engage in physical exercise.",real:"I usually exercise three times a week.",es:"Normalmente hago ejercicio tres veces por semana.",ctx:"“On a regular basis” suena a reporte corporativo; en una conversación real usamos “usually” + una frecuencia concreta.",tags:["Everyday","Neutral"],fast:"ai yúshuali éksersais"},
{t:"speak",say:"I usually exercise three times a week.",es:"Practica hablar de tu frecuencia de ejercicio.",tip:"Pronuncia “usually” como “yú-shu-a-li”, en un solo golpe rápido."},
{t:"fact",body:"“How often…?” es la pregunta estándar para frecuencia. Puedes responder con un adverbio (usually, sometimes) o con una frase de tiempo (three times a week, once a month, every day).",note:"Combinar ambas también es natural: “I usually go, about three times a week.”"},
{t:"trivia",qs:[
{q:"¿Cuál es el orden correcto?",opts:["I always drink water.","I drink always water.","Always drink I water."],a:0,why:"El adverbio de frecuencia va antes del verbo principal."},
{q:"¿Qué significa “I rarely go to bed late”?",opts:["Casi nunca me acuesto tarde.","Siempre me acuesto tarde.","A veces me acuesto tarde."],a:0,why:"“Rarely” significa “rara vez”, muy cerca de “nunca”."}]}]},
{t:"Texting About Your Day",m:8,c:[
{t:"mission",title:"Your friend texts you to make plans.",goal:"Responde mensajes cotidianos sobre tu rutina y tus planes de hoy.",wolf:"Ready?"},
{t:"dialog",lines:[["Jess","Hey! Are you free tonight?","¡Oye! ¿Estás libre esta noche?"],["You","I'm working until 6, but I'm free after that.","Estoy trabajando hasta las 6, pero estoy libre después de eso."],["Jess","Perfect. Do you want to get dinner?","Perfecto. ¿Quieres ir a cenar?"],["You","Sure! I usually eat around 7.","¡Claro! Normalmente como como a las 7."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Are you free tonight?","¿Estás libre esta noche?","Everyday","ar yu fri tunáit"],["I'm working until 6.","Estoy trabajando hasta las 6.","Everyday","aim uérkin antíl siks"],["Do you want to get dinner?","¿Quieres ir a cenar?","Everyday","du yu uánt tu get díner"],["I'll text you later.","Te escribo más tarde.","Informal","áil tekst yu léiter"]]},
{t:"understand",title:"Mensajes cortos, presente continuo para planes",body:"Cuando hablas de un plan ya organizado para hoy o pronto, muchas veces usamos presente continuo, igual que con acciones en curso: I'm working until 6 (hoy). En mensajes de texto, las oraciones suelen ser cortas y directas — no hace falta ser formal.",note:"“I'll text you later” usa will (I'll) para algo que decides en el momento, como una promesa rápida."},
{t:"choose",tag:"Elige la respuesta natural",q:"Tu amiga pregunta: “Are you free tonight?” y sí lo estás después de las 6. ¿Qué respondes?",opts:["I'm working until 6, but I'm free after that.","I am not never free.","I free after six o'clock time."],a:0,why:"Es clara, natural, y explica tu horario sin sonar forzada."},
{t:"situation",intro:"Tu amigo Jess te escribe para hacer planes esta noche.",start:["Jess","Do you want to get dinner around 7?","¿Quieres cenar como a las 7?"],branches:[
{opt:"Sure! I usually eat around 7 anyway.",npc:"Perfect, see you then!",best:true,tag:"Muy natural"},
{opt:"I not can, I working.",npc:"Sorry, what do you mean?",best:false,tag:"Suena forzado",why:"“I not can” no es correcto: sería “I can't, I'm working.” Cuida el orden y la forma continua."},
{opt:"Maybe. I'll text you later.",npc:"Okay, sounds good!",best:false,tag:"Aceptable, pero menos directo",why:"Es una respuesta válida y natural, aunque deja la decisión para después."}],outro:"Las tres opciones son inglés real, pero la primera es la más natural y completa para esta situación."},
{t:"write",prompt:"Escribe un mensaje corto contándole a un amigo qué estás haciendo ahora mismo y a qué hora estás libre hoy.",placeholder:"Ejemplo: I'm... right now, but I'm free at...",model:"I'm studying right now, but I'm free at 6. Do you want to hang out?",tip:"No necesita ser perfecto: usa presente continuo para “ahora” y presente simple si mencionas tu horario normal."},
{t:"fact",body:"En mensajes de texto en inglés es normal usar contracciones y oraciones cortas: “I'm free after 6”, no “I am free after six o'clock.” Escribir todo formal en un mensaje a un amigo puede sonar raro.",note:"Guarda las oraciones completas y formales para correos o contextos de trabajo."},
{t:"trivia",qs:[
{q:"¿Cuál mensaje sería más natural para un amigo?",opts:["I'm free after 6.","I am currently unavailable until eighteen hundred hours.","I be free after six."],a:0,why:"Corto, natural, y con contracción: exactamente como se escribe en la vida real."},
{q:"¿Qué usamos para un plan ya decidido para hoy?",opts:["Presente continuo (I'm working until 6).","Solo presente simple.","Solo pasado."],a:0,why:"Para planes de hoy ya organizados, el presente continuo es muy natural."}]}]},
{t:"Life in Motion Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos presente simple, presente continuo y frecuencia antes de seguir.",wolf:"Let's go!"},
{t:"fact",body:"Esta unidad cubrió una de las bases más importantes del inglés cotidiano: saber cuándo algo es un hábito (presente simple) y cuándo está pasando ahora o temporalmente (presente continuo). Vas a usar esta diferencia constantemente en conversaciones reales.",note:"Si tienes dudas, pregúntate: ¿siempre es así, o solo está pasando ahora/hoy/esta semana?"},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["She works from home.","She work from home.","She working from home."],a:0,why:"Con he/she/it, agregamos -s: she works."},
{q:"¿Qué frase indica presente continuo?",opts:["right now","every day","usually"],a:0,why:"“Right now” señala que algo pasa en este momento."},
{q:"¿Dónde va “always” en “I always drink water”?",opts:["Antes del verbo principal.","Después del verbo principal.","Al final de la oración."],a:0,why:"Los adverbios de frecuencia van antes del verbo principal (excepto con “to be”)."},
{q:"¿Cuál mensaje suena más natural para un amigo?",opts:["I'm free after 6.","I am currently unavailable until eighteen hundred hours.","I be free after six."],a:0,why:"Corto y con contracción, como se escribe en la vida real."}]}]}
],["Hablar de tu rutina diaria con presente simple, con la -s correcta en he/she/it.","Describir lo que estás haciendo ahora mismo con presente continuo.","Elegir correctamente entre presente simple y presente continuo según el contexto.","Usar adverbios de frecuencia (always, usually, sometimes, never) y frases de tiempo.","Responder mensajes cotidianos sobre tu rutina y tus planes de hoy."],"#12A85F"),
U(2,"Stories from the Past","history","Cuenta qué hiciste ayer, un viaje o una experiencia.",[
{t:"Yesterday's Story",m:8,c:[
{t:"mission",title:"Someone asks about your weekend.",goal:"Habla del pasado usando el verbo to be: was/were.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","How was your weekend?","¿Cómo estuvo tu fin de semana?"],["You","It was great! I was at the beach with my family.","¡Estuvo genial! Estuve en la playa con mi familia."],["Sam","Were you there all weekend?","¿Estuviste ahí todo el fin de semana?"],["You","No, we were only there on Saturday.","No, solo estuvimos ahí el sábado."]]},
{t:"discover",title:"Expresiones nuevas",items:[["How was your weekend?","¿Cómo estuvo tu fin de semana?","Everyday","jau uas yor uíkend"],["I was at the beach.","Estuve en la playa.","Everyday","ai uas at de bích"],["Were you there?","¿Estuviste ahí?","Neutral","uér yu der"],["They weren't home.","Ellos no estaban en casa.","Neutral","déi uérent jóum"]]},
{t:"understand",title:"Was para I/he/she/it, were para you/we/they",body:"El pasado del verbo “to be” tiene dos formas: was (I, he, she, it) y were (you, we, they). Para negar, usamos wasn't o weren't: I wasn't tired. They weren't home. Para preguntar, invertimos el orden: Were you there? Was she happy?",note:"Es uno de los verbos más usados en inglés, así que vale la pena memorizarlo bien: I was, you were, he/she/it was, we were, they were."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alguien pregunta “How was your weekend?” y estuvo genial. ¿Qué respondes?",opts:["It was great!","It is great!","It will be great!"],a:0,why:"Hablamos del fin de semana pasado, así que usamos was: It was great."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “They was at the party.” ¿Cuál es?",opts:["Con “they” se usa were: They were at the party.","Falta “at”.","No hay ningún error."],a:0,why:"Con we/you/they usamos were, no was."},
{t:"build",q:"Arma la frase: “Ellos no estaban en casa.”",words:["weren't","home","They"],a:"They weren't home"},
{t:"real",book:"The weather conditions were quite unfavorable.",real:"The weather was really bad.",es:"El clima estuvo muy feo.",ctx:"“Unfavorable” es de reporte del clima; en una conversación normal decimos simplemente “really bad” o “terrible”.",tags:["Everyday"],fast:"de uéder uas rili bad"},
{t:"speak",say:"It was great! I was at the beach with my family.",es:"Practica contar cómo estuvo tu fin de semana.",tip:"Alarga un poco la “a” de “great” para sonar entusiasmado."},
{t:"fact",body:"“Was/were” también se usa para describir el clima y sensaciones en el pasado: It was sunny, I was tired, We were excited. Es una de las formas más comunes de empezar a contar una historia en inglés.",note:"Muchas historias en inglés empiezan con “It was a...” — igual que en español decimos “Era un...”."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I was at the beach.","I were at the beach.","I am was at the beach."],a:0,why:"Con “I” usamos was."},
{q:"¿Cómo se pregunta “¿Estuviste ahí?”",opts:["Were you there?","You was there?","Did you were there?"],a:0,why:"Para preguntar con “to be” en pasado, invertimos el orden: Were you...?"}]}]},
{t:"Regular Verbs",m:8,c:[
{t:"mission",title:"You're telling a friend about yesterday.",goal:"Usa verbos regulares en pasado simple y pronuncia correctamente la terminación -ed.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","What did you do yesterday?","¿Qué hiciste ayer?"],["You","I worked in the morning and I walked my dog in the evening.","Trabajé en la mañana y paseé a mi perro en la tarde."],["Maya","Did you cook dinner too?","¿También cocinaste la cena?"],["You","Yes, I cooked pasta.","Sí, cociné pasta."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I worked yesterday.","Trabajé ayer.","Everyday","ai uórkt yésterdei"],["I walked my dog.","Paseé a mi perro.","Everyday","ai uókt mai dog"],["She cleaned the house.","Ella limpió la casa.","Neutral","shi klind de jaus"],["We wanted to leave early.","Queríamos irnos temprano.","Neutral","uí uánted tu liv érli"]]},
{t:"understand",title:"La terminación -ed suena de 3 formas distintas",body:"Para formar el pasado de los verbos regulares, agregamos -ed: work→worked, walk→walked, clean→cleaned. Pero la pronunciación cambia: /t/ después de sonidos sordos (worked), /d/ después de sonidos sonoros (cleaned), y /ɪd/ después de t o d (wanted, needed).",note:"No necesitas memorizar la regla fonética de memoria: escuchar y repetir mucho es lo que la hace automática."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alguien pregunta “What did you do yesterday?” ¿Cómo respondes de forma natural?",opts:["I worked in the morning.","I work in the morning yesterday.","I am working yesterday morning."],a:0,why:"“Yesterday” pide pasado simple: I worked."},
{t:"choose",tag:"Listening",say:"She wanted to leave early, so she cleaned the house fast.",q:"Escucha y elige qué significa.",opts:["Ella quería irse temprano, así que limpió la casa rápido.","Ella limpió la casa despacio.","Ella nunca limpia la casa."],a:0,why:"“Wanted” y “cleaned” están en pasado: ella quería y limpió."},
{t:"build",q:"Arma la frase: “Ella limpió la casa.”",words:["the","cleaned","house","She"],a:"She cleaned the house"},
{t:"real",book:"I performed my professional duties in the morning hours.",real:"I worked in the morning.",es:"Trabajé en la mañana.",ctx:"Nadie dice “performed my professional duties” al platicar con un amigo; “I worked” es simple y natural.",tags:["Everyday"],fast:"ai uórkt in de mórnin"},
{t:"speak",say:"I worked in the morning and I walked my dog in the evening.",es:"Practica contar tu día de ayer.",tip:"Pronuncia “worked” como “uórkt”, con el sonido final /t/, no /ed/."},
{t:"fact",body:"Muchos estudiantes pronuncian “-ed” como una sílaba extra siempre (“walk-ed”), pero en la mayoría de los casos es solo un sonido rápido al final: “walked” suena como “uókt”, no “uók-ed”.",note:"La excepción son los verbos que terminan en t o d, como “wanted” o “needed”: ahí sí se pronuncia como sílaba extra."},
{t:"trivia",qs:[
{q:"¿Cuál es el pasado de “walk”?",opts:["walked","walkt","walkeded"],a:0,why:"Se agrega -ed: walk → walked."},
{q:"¿Cuál oración está en pasado simple correcto?",opts:["I worked yesterday.","I work yesterday.","I am work yesterday."],a:0,why:"“Yesterday” + verbo con -ed = pasado simple correcto."}]}]},
{t:"Irregular Verbs",m:8,c:[
{t:"mission",title:"You went somewhere special. Tell the story.",goal:"Usa verbos irregulares comunes en pasado simple.",wolf:"Ready?"},
{t:"dialog",lines:[["Alex","Where did you go last weekend?","¿A dónde fuiste el fin de semana pasado?"],["You","I went to my grandmother's house. We had a big lunch.","Fui a la casa de mi abuela. Comimos un almuerzo grande."],["Alex","Did you see your cousins too?","¿También viste a tus primos?"],["You","Yes, I saw all of them!","¡Sí, los vi a todos!"]]},
{t:"discover",title:"Expresiones nuevas",items:[["I went to my grandmother's house.","Fui a la casa de mi abuela.","Everyday","ai uént tu mai grándmaders jaus"],["We had a big lunch.","Comimos un almuerzo grande.","Everyday","uí jad a big lanch"],["I saw my cousins.","Vi a mis primos.","Everyday","ai só mai cásens"],["She did her homework.","Ella hizo su tarea.","Neutral","shi did jer jóumuork"]]},
{t:"understand",title:"Los verbos irregulares no siguen la regla -ed",body:"Algunos de los verbos más comunes en inglés son irregulares: go→went, have→had, see→saw, do→did, eat→ate, get→got, make→made. No hay una regla fija: hay que memorizarlos, pero son los que más vas a usar al contar historias.",note:"Un buen truco es aprenderlos en grupos pequeños de 4 o 5, no todos de golpe."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Cuál es el pasado de “go”?",opts:["went","goed","gone"],a:0,why:"“Go” es irregular: go → went (no “goed”)."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I seed my cousins.” ¿Cuál es?",opts:["“See” es irregular: I saw my cousins.","Falta “my”.","No hay ningún error."],a:0,why:"El pasado de “see” es “saw”, no “seed”."},
{t:"build",q:"Arma la frase: “Ella hizo su tarea.”",words:["homework","did","her","She"],a:"She did her homework"},
{t:"real",book:"I consumed a substantial midday meal.",real:"We had a big lunch.",es:"Comimos un almuerzo grande.",ctx:"“Consumed a substantial midday meal” suena a reporte científico; “had a big lunch” es lo que cualquier persona diría.",tags:["Everyday"],fast:"uí jad a big lanch"},
{t:"speak",say:"I went to my grandmother's house. We had a big lunch.",es:"Practica contar una visita familiar.",tip:"“Went” se pronuncia rápido, casi como “uént”, sin alargar la e."},
{t:"fact",body:"Los verbos irregulares más comunes (go, have, do, see, get, make, say, know) aparecen constantemente en conversaciones cotidianas. Aprenderlos bien tiene más impacto que memorizar verbos raros que casi no se usan.",note:"Con práctica, estos verbos se vuelven automáticos — no necesitas traducir en tu cabeza."},
{t:"trivia",qs:[
{q:"¿Cuál es el pasado de “have”?",opts:["had","haved","have"],a:0,why:"“Have” es irregular: have → had."},
{q:"¿Cuál es el pasado de “eat”?",opts:["ate","eated","eaten"],a:0,why:"“Eat” es irregular: eat → ate. (“Eaten” es el participio, no el pasado simple)."}]}]},
{t:"Asking About the Past",m:7,c:[
{t:"mission",title:"You want to know what happened.",goal:"Haz preguntas en pasado con “Did” y responde con respuestas cortas.",wolf:"Let's go!"},
{t:"dialog",lines:[["Sam","Did you sleep well last night?","¿Dormiste bien anoche?"],["You","Yes, I did. I slept eight hours.","Sí. Dormí ocho horas."],["Sam","Did you have breakfast?","¿Desayunaste?"],["You","No, I didn't. I woke up late.","No. Me desperté tarde."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Did you sleep well?","¿Dormiste bien?","Everyday","did yu slip uél"],["Yes, I did.","Sí.","Everyday","yes ai did"],["No, I didn't.","No.","Everyday","nóu ai dídent"],["What time did you wake up?","¿A qué hora te despertaste?","Neutral","juat táim did yu uéik ap"]]},
{t:"understand",title:"Did + verbo base, siempre",body:"Para preguntar en pasado simple con casi cualquier verbo, usamos Did + sujeto + verbo en forma base (sin -ed ni forma irregular): Did you sleep well? Did she go? El verbo NO cambia en la pregunta, porque “did” ya indica que es pasado. Las respuestas cortas son: Yes, I did. / No, I didn't.",note:"Error común: “Did you went?” es incorrecto. Lo correcto es “Did you go?” — el verbo se queda en su forma base."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Cómo se pregunta “¿Dormiste bien?”",opts:["Did you sleep well?","Did you slept well?","You slept well?"],a:0,why:"Did + verbo en forma base: Did you sleep."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “Did you went to the party?” ¿Cuál es?",opts:["El verbo debe quedar en forma base: Did you go?","Falta “the”.","No hay ningún error."],a:0,why:"Con “did”, el verbo principal NO lleva forma de pasado: Did you go, not Did you went."},
{t:"build",q:"Arma la frase: “¿A qué hora te despertaste?”",words:["did","time","wake","you","What","up"],a:"What time did you wake up"},
{t:"real",book:"Did you engage in a satisfactory period of sleep?",real:"Did you sleep well?",es:"¿Dormiste bien?",ctx:"Nadie pregunta así en la vida real; “Did you sleep well?” es corto, claro y natural.",tags:["Everyday"],fast:"did yu slip uél"},
{t:"speak",say:"Did you sleep well last night?",es:"Practica hacer preguntas sobre el pasado.",tip:"Sube el tono al final, como en cualquier pregunta de sí/no."},
{t:"fact",body:"Las respuestas cortas (“Yes, I did” / “No, I didn't”) son muy comunes en inglés hablado — responder solo “Yes” o “No” puede sonar cortante. Agregar “I did” o “I didn't” suena más natural y completo.",note:"Esta misma estructura de respuesta corta se usa con muchos otros verbos auxiliares: Do, Does, Can, Will..."},
{t:"trivia",qs:[
{q:"¿Cuál es la forma correcta?",opts:["Did you go to the party?","Did you went to the party?","You did go to the party?"],a:0,why:"Con “did”, el verbo se queda en forma base: Did you go."},
{q:"Responde negativamente: “Did you have breakfast?”",opts:["No, I didn't.","No, I not did.","No, I don't."],a:0,why:"La respuesta corta negativa es: No, I didn't."}]}]},
{t:"Travel Memories",m:9,c:[
{t:"mission",title:"A friend asks about your last trip.",goal:"Cuenta una experiencia de viaje usando pasado simple, combinando verbos regulares e irregulares.",wolf:"Ready?"},
{t:"dialog",lines:[["Jess","Tell me about your last trip!","¡Cuéntame de tu último viaje!"],["You","I went to Oaxaca last year. I tried amazing food.","Fui a Oaxaca el año pasado. Probé comida increíble."],["Jess","Did you visit any museums?","¿Visitaste algún museo?"],["You","Yes, I visited two museums and I took a lot of photos.","Sí, visité dos museos y tomé muchas fotos."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I went to Oaxaca last year.","Fui a Oaxaca el año pasado.","Everyday","ai uént tu oajáka last íer"],["I tried amazing food.","Probé comida increíble.","Everyday","ai tráid améizin fud"],["I took a lot of photos.","Tomé muchas fotos.","Everyday","ai tuk a lat of fótous"],["It was an unforgettable trip.","Fue un viaje inolvidable.","Neutral","it uas an anforguétabl trip"]]},
{t:"understand",title:"Mezclando verbos regulares e irregulares",body:"Al contar una historia de viaje, normalmente mezclas verbos regulares (tried, visited, traveled) e irregulares (went, took, saw, had). No pasa nada si se mezclan en la misma historia — de hecho, es lo normal.",note:"Organiza tu historia con conectores: First... Then... After that... Finally..."},
{t:"choose",tag:"Elige la respuesta natural",q:"Tu amigo pregunta “Did you visit any museums?” y sí visitaste dos. ¿Qué respondes?",opts:["Yes, I visited two museums.","Yes, I visit two museums.","Yes, I visiting two museums."],a:0,why:"Con “did” en la pregunta, respondemos con el verbo en pasado simple: I visited."},
{t:"situation",intro:"Tu amigo Jess quiere saber más de tu viaje a Oaxaca.",start:["Jess","What was the best part of the trip?","¿Cuál fue la mejor parte del viaje?"],branches:[
{opt:"The food was amazing. I tried mole for the first time.",npc:"That sounds delicious!",best:true,tag:"Muy natural"},
{opt:"Was good the food and I eat mole.",npc:"Sorry, what do you mean?",best:false,tag:"Suena forzado",why:"El orden está mal: sería “The food was good” y “I ate mole” (pasado de eat)."},
{opt:"Food. Mole. Good.",npc:"Haha, tell me more!",best:false,tag:"Demasiado corto",why:"Se entiende, pero una oración completa suena mucho más natural y da más información."}],outro:"Las tres se entienden, pero la primera cuenta la historia de forma completa y natural."},
{t:"write",prompt:"Escribe 2-3 líneas contando un viaje o una salida que hiciste. Usa al menos dos verbos en pasado (regulares o irregulares).",placeholder:"Ejemplo: I went to... I saw... I tried...",model:"Last month I went to the beach with my friends. We swam in the ocean and we ate fresh fish. It was an amazing day.",tip:"No te preocupes por la perfección: intenta usar el pasado simple que ya practicaste."},
{t:"fact",body:"Contar historias de viajes es una de las conversaciones más comunes en inglés cotidiano. Frases como “It was amazing”, “I tried...”, “I visited...” aparecen constantemente cuando alguien pregunta “How was your trip?”",note:"Guarda estas frases: te van a servir en casi cualquier conversación sobre experiencias pasadas."},
{t:"trivia",qs:[
{q:"¿Cuál es el pasado de “try”?",opts:["tried","tryed","tries"],a:0,why:"Cuando el verbo termina en consonante + y, cambiamos la y por i y agregamos -ed: try → tried."},
{q:"¿Cuál es el pasado de “take”?",opts:["took","taked","taken"],a:0,why:"“Take” es irregular: take → took. (“Taken” es el participio)."}]}]},
{t:"Stories from the Past Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos was/were, verbos regulares, irregulares y preguntas en pasado.",wolf:"Let's go!"},
{t:"fact",body:"Esta unidad te dio las herramientas para contar cualquier historia del pasado: was/were para describir cómo eran las cosas, verbos regulares e irregulares para las acciones, y “did” para preguntar. Vas a usar el pasado simple constantemente en conversaciones reales.",note:"Si dudas entre was/were, recuerda: I/he/she/it → was; you/we/they → were."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["They were at the party.","They was at the party.","They is at the party."],a:0,why:"Con “they” usamos were."},
{q:"¿Cuál es el pasado de “go”?",opts:["went","goed","gone"],a:0,why:"“Go” es irregular: go → went."},
{q:"¿Cómo se pregunta en pasado?",opts:["Did you sleep well?","Did you slept well?","You did sleep well?"],a:0,why:"Did + verbo en forma base."},
{q:"¿Cuál es el pasado de “try”?",opts:["tried","tryed","tries"],a:0,why:"try → tried (cambiamos y por i antes de -ed)."}]}]}
],["Hablar del pasado con was/were.","Usar verbos regulares en pasado simple, con la pronunciación correcta de -ed.","Reconocer y usar verbos irregulares comunes (go, have, see, do, eat).","Hacer preguntas en pasado con Did y responder con respuestas cortas.","Contar una experiencia o un viaje combinando verbos regulares e irregulares."],"#7C3AED"),
U(3,"What Happened?","refresh","Cuenta una historia con pasado simple y pasado continuo.",[
{t:"Past Continuous",m:8,c:[
{t:"mission",title:"Someone asks what you were doing at a specific time.",goal:"Describe lo que estabas haciendo en un momento del pasado, usando pasado continuo.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","What were you doing at 8pm yesterday?","¿Qué estabas haciendo a las 8pm ayer?"],["You","I was watching a movie.","Estaba viendo una película."],["Sam","Were you watching it alone?","¿La estabas viendo solo?"],["You","No, I was watching it with my brother.","No, la estaba viendo con mi hermano."]]},
{t:"discover",title:"Expresiones nuevas",items:[["What were you doing at 8pm?","¿Qué estabas haciendo a las 8pm?","Neutral","juat uér yu dúin at éit pi em"],["I was watching a movie.","Estaba viendo una película.","Everyday","ai uas uátchin a múvi"],["They were sleeping.","Ellos estaban durmiendo.","Neutral","déi uér slípin"],["She wasn't working.","Ella no estaba trabajando.","Neutral","shi uásent uérkin"]]},
{t:"understand",title:"Was/were + verbo-ing = pasado continuo",body:"El pasado continuo se forma igual que el presente continuo, pero con was/were en vez de am/is/are: I was watching, they were sleeping, she wasn't working. Lo usamos para describir una acción que estaba en progreso en un momento específico del pasado.",note:"Compara: I watched a movie (la vi completa) vs. I was watching a movie (estaba en medio de verla, sin saber si terminó)."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alguien pregunta “What were you doing at 8pm?” ¿Qué respondes si estabas viendo una película?",opts:["I was watching a movie.","I watch a movie.","I am watching a movie."],a:0,why:"“At 8pm yesterday” pide pasado continuo para describir la acción en progreso: I was watching."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “They was sleeping.” ¿Cuál es?",opts:["Con “they” se usa were: They were sleeping.","Falta “at”.","No hay ningún error."],a:0,why:"Con we/you/they usamos were + verbo-ing."},
{t:"build",q:"Arma la frase: “Ella no estaba trabajando.”",words:["working","wasn't","She"],a:"She wasn't working"},
{t:"real",book:"I was engaged in viewing a cinematic production.",real:"I was watching a movie.",es:"Estaba viendo una película.",ctx:"Nadie habla así en una conversación real; “I was watching a movie” es natural y directo.",tags:["Everyday"],fast:"ai uas uátchin a múvi"},
{t:"speak",say:"I was watching a movie at 8pm yesterday.",es:"Practica describir qué estabas haciendo a una hora específica.",tip:"Conecta “was” y “watching” rápido: “uas-uátchin”."},
{t:"fact",body:"El pasado continuo es perfecto para “poner la escena” de una historia: “I was walking home when...”, “It was raining when...”. Los hablantes nativos lo usan constantemente para dar contexto antes de contar qué pasó.",note:"Vas a ver este patrón mucho en la siguiente lección: pasado continuo + pasado simple."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I was watching a movie.","I were watching a movie.","I am watching a movie yesterday."],a:0,why:"Con “I” usamos was + verbo-ing."},
{q:"¿Qué describe el pasado continuo?",opts:["Una acción en progreso en un momento del pasado.","Una acción que pasa siempre.","Un plan para el futuro."],a:0,why:"El pasado continuo describe algo que estaba en proceso en un momento específico."}]}]},
{t:"When and While",m:8,c:[
{t:"mission",title:"Something happened while you were doing something else.",goal:"Combina pasado continuo y pasado simple con “when” y “while”.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","What happened?","¿Qué pasó?"],["You","I was cooking when the phone rang.","Estaba cocinando cuando sonó el teléfono."],["Maya","Did you answer it?","¿Contestaste?"],["You","Yes, while I was talking, the food burned!","Sí, ¡mientras hablaba, la comida se quemó!"]]},
{t:"discover",title:"Expresiones nuevas",items:[["I was cooking when the phone rang.","Estaba cocinando cuando sonó el teléfono.","Everyday","ai uas cúkin juén de fóun rang"],["While I was talking, the food burned.","Mientras hablaba, la comida se quemó.","Neutral","uáil ai uas tókin de fud bérnd"],["She was reading when I arrived.","Ella estaba leyendo cuando llegué.","Neutral","shi uas rídin juén ai arráivd"],["What were you doing when it happened?","¿Qué estabas haciendo cuando pasó?","Neutral","juat uér yu dúin juén it jápend"]]},
{t:"understand",title:"When + pasado simple, while + pasado continuo",body:"Usamos “when” con la acción corta que interrumpe (pasado simple): ...when the phone rang. Usamos “while” con la acción larga en progreso (pasado continuo): While I was talking... La estructura típica es: [pasado continuo] + when + [pasado simple], o: While + [pasado continuo], [pasado simple].",note:"Ambas partes cuentan la misma historia desde ángulos distintos: una es el “fondo” (continuo) y la otra es lo que “interrumpe” (simple)."},
{t:"choose",tag:"Elige la respuesta natural",q:"Completa: “I ___ cooking when the phone rang.”",opts:["was","were","did"],a:0,why:"Con “I” usamos was + verbo-ing: I was cooking."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “While I was talking, the food burn.” ¿Cuál es?",opts:["Falta el pasado: the food burned.","Sobra “while”.","No hay ningún error."],a:0,why:"La acción que interrumpe va en pasado simple: burned, not burn."},
{t:"build",q:"Arma la frase: “Ella estaba leyendo cuando llegué.”",words:["was","when","reading","She","I","arrived"],a:"She was reading when I arrived"},
{t:"real",book:"Whilst I was engaged in a telephone conversation, the culinary preparation was destroyed by fire.",real:"While I was talking, the food burned!",es:"¡Mientras hablaba, la comida se quemó!",ctx:"La primera versión suena a novela victoriana; nadie habla así. La segunda es exactamente cómo se cuenta esta historia en la vida real.",tags:["Everyday"],fast:"uáil ai uas tókin de fud bérnd"},
{t:"speak",say:"I was cooking when the phone rang.",es:"Practica combinar pasado continuo y pasado simple.",tip:"Haz una pequeña pausa antes de “when”, como una coma en el aire."},
{t:"fact",body:"“When” y “while” son de las palabras más útiles para contar historias con detalle en inglés. Casi cualquier anécdota (“Estaba en el súper cuando vi a...”, “Mientras manejaba, empezó a llover”) usa esta estructura.",note:"En inglés hablado, a veces se invierte el orden: “The phone rang while I was cooking” también es correcto."},
{t:"trivia",qs:[
{q:"¿Qué palabra va con la acción que interrumpe (pasado simple)?",opts:["when","while","during"],a:0,why:"“When” + pasado simple introduce la acción corta que interrumpe."},
{q:"Completa: “___ I was talking, the food burned.”",opts:["While","When","Then"],a:0,why:"“While” + pasado continuo describe la acción larga en progreso."}]}]},
{t:"Interrupted Actions",m:7,c:[
{t:"mission",title:"Something unexpected happened.",goal:"Describe interrupciones y eventos inesperados en el pasado.",wolf:"Ready?"},
{t:"dialog",lines:[["Alex","I heard you had a crazy day!","¡Escuché que tuviste un día loco!"],["You","Yes! I was driving to work when I got a flat tire.","¡Sí! Iba manejando al trabajo cuando se me ponchó una llanta."],["Alex","Oh no! What did you do?","¡Oh no! ¿Qué hiciste?"],["You","I called a friend while I was waiting for help.","Llamé a un amigo mientras esperaba ayuda."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I got a flat tire.","Se me ponchó una llanta.","Everyday","ai gat a flat táier"],["The power went out.","Se fue la luz.","Everyday","de páuer uént áut"],["I lost my phone.","Perdí mi teléfono.","Everyday","ai lost mai fóun"],["Someone knocked on the door.","Alguien tocó la puerta.","Neutral","sámuan nakt on de dor"]]},
{t:"understand",title:"Vocabulario para contar imprevistos",body:"Para contar historias interesantes necesitas vocabulario de eventos inesperados: get a flat tire (ponchar una llanta), the power went out (se fue la luz), lose something (perder algo), knock on the door (tocar la puerta). Combínalos con “when/while” para historias completas: I was sleeping when the power went out.",note:"Estas frases son bloques fijos: “got a flat tire”, no “had a flat tire puncture”."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Cómo dices “Se fue la luz” en inglés?",opts:["The power went out.","The light went away.","The electricity was lost."],a:0,why:"“The power went out” es la expresión natural y estándar."},
{t:"choose",tag:"Elige la respuesta natural",q:"Estabas manejando cuando se ponchó una llanta. ¿Qué dices?",opts:["I was driving when I got a flat tire.","I drove when I was getting a flat tire.","I am driving got flat tire."],a:0,why:"Acción larga (was driving) + interrupción (got a flat tire, pasado simple)."},
{t:"build",q:"Arma la frase: “Alguien tocó la puerta.”",words:["knocked","the","Someone","on","door"],a:"Someone knocked on the door"},
{t:"real",book:"An individual made contact with the entrance via knuckles.",real:"Someone knocked on the door.",es:"Alguien tocó la puerta.",ctx:"La primera suena absurda; en inglés real simplemente decimos “Someone knocked on the door.”",tags:["Everyday"],fast:"sámuan nakt on de dor"},
{t:"speak",say:"I was driving to work when I got a flat tire.",es:"Practica contar un imprevisto.",tip:"Pronuncia “flat tire” junto, como una sola idea: “flat-táier”."},
{t:"fact",body:"Contar sobre algo inesperado (“you won't believe what happened”) es una forma muy común de empezar una conversación en inglés. Frases como “Guess what happened!” o “You won't believe this” preparan a quien escucha para una historia.",note:"“Guess what happened!” es una forma natural y emocionada de empezar a contar algo."},
{t:"trivia",qs:[
{q:"¿Cómo se dice “perdí mi teléfono”?",opts:["I lost my phone.","I losed my phone.","I lose my phone yesterday."],a:0,why:"“Lose” es irregular: lose → lost."},
{q:"¿Cuál oración combina correctamente acción larga + interrupción?",opts:["I was driving when I got a flat tire.","I drove when I was getting a flat tire.","I driving got a flat tire."],a:0,why:"Pasado continuo (was driving) + when + pasado simple (got)."}]}]},
{t:"A Story in Motion",m:8,c:[
{t:"mission",title:"Tell a complete story with a beginning, middle, and end.",goal:"Usa conectores de tiempo para organizar una historia completa.",wolf:"Let's go!"},
{t:"dialog",lines:[["Jess","So, what happened at the party?","Entonces, ¿qué pasó en la fiesta?"],["You","First, we ate dinner. Then, suddenly, the lights went out!","Primero, cenamos. Luego, ¡de repente se fue la luz!"],["Jess","What did you do?","¿Qué hicieron?"],["You","We used our phones for light. Finally, the power came back.","Usamos nuestros teléfonos como luz. Finalmente, regresó la electricidad."]]},
{t:"discover",title:"Expresiones nuevas",items:[["First, we ate dinner.","Primero, cenamos.","Everyday","férst uí eit díner"],["Then, the lights went out.","Luego, se fue la luz.","Everyday","den de laits uent áut"],["Suddenly, everyone screamed.","De repente, todos gritaron.","Everyday","sádenli évriuan skrimd"],["Finally, the power came back.","Finalmente, regresó la electricidad.","Everyday","fáinali de páuer kéim bak"]]},
{t:"understand",title:"Conectores que dan estructura a una historia",body:"First, then, after that, suddenly, finally son palabras clave para organizar una historia en orden: qué pasó primero, después, de repente, y al final. “Suddenly” es especialmente útil para el momento sorprendente de la historia.",note:"No necesitas usar los cinco en cada historia — con 2 o 3 bien colocados, tu historia ya suena organizada."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Qué conector usarías para el momento sorpresa de la historia?",opts:["Suddenly","First","Finally"],a:0,why:"“Suddenly” marca algo inesperado, perfecto para el giro de la historia."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “Finally, first the power came back.” ¿Cuál es?",opts:["Sobra “first”: Finally, the power came back.","Falta una coma.","No hay ningún error."],a:0,why:"“Finally” y “first” son contradictorios juntos; usa solo el conector que corresponde al orden real."},
{t:"build",q:"Arma la frase: “De repente, todos gritaron.”",words:["everyone","Suddenly,","screamed"],a:"Suddenly, everyone screamed"},
{t:"real",book:"Subsequent to the initial course, an electrical interruption occurred.",real:"Then, suddenly, the lights went out!",es:"Luego, ¡de repente se fue la luz!",ctx:"La versión “libro” sería imposible de decir en una conversación real; “then, suddenly” es justo como se cuenta una historia emocionante.",tags:["Everyday"],fast:"den sádenli de laits uent áut"},
{t:"speak",say:"First, we ate dinner. Then, suddenly, the lights went out!",es:"Practica contar una historia con conectores.",tip:"Haz una pausa después de cada conector para dar efecto dramático."},
{t:"fact",body:"Las buenas historias en inglés (igual que en español) tienen estructura: algo normal pasa primero, luego algo inesperado (suddenly), y finalmente se resuelve. Usar conectores hace que cualquier historia suene más clara e interesante.",note:"Prueba contar tu día usando al menos un conector: te vas a sorprender de qué tan natural suena."},
{t:"trivia",qs:[
{q:"¿Qué palabra indica el primer evento?",opts:["First","Finally","Suddenly"],a:0,why:"“First” marca el inicio de la historia."},
{q:"¿Qué palabra indica el final de la historia?",opts:["Finally","First","Then"],a:0,why:"“Finally” marca la conclusión."}]}]},
{t:"Mystery Mission",m:9,c:[
{t:"mission",title:"Solve a mystery using the past.",goal:"Usa pasado simple, pasado continuo y conectores para resolver un pequeño misterio.",wolf:"Ready?"},
{t:"dialog",lines:[["Detective","Where were you at 9pm last night?","¿Dónde estaba usted a las 9pm anoche?"],["You","I was at home. I was watching TV when I heard a noise outside.","Estaba en casa. Estaba viendo tele cuando escuché un ruido afuera."],["Detective","What did you do then?","¿Qué hizo entonces?"],["You","I looked out the window, but I didn't see anything.","Miré por la ventana, pero no vi nada."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Where were you at 9pm?","¿Dónde estaba usted a las 9pm?","Neutral","juer uér yu at náin pi em"],["I heard a noise.","Escuché un ruido.","Everyday","ai jérd a nóis"],["I didn't see anything.","No vi nada.","Everyday","ai dídent si énizin"],["Did you see anyone?","¿Vio a alguien?","Neutral","did yu si éniuan"]]},
{t:"understand",title:"Contar una coartada: pasado + pasado continuo juntos",body:"Para contar “dónde estabas y qué estabas haciendo” combinamos was/were + pasado continuo (el fondo) con pasado simple (lo que interrumpió). Esta es exactamente la estructura que usa la policía, un testigo, o cualquiera contando qué pasó en un momento específico.",note:"“I didn't see anything” — recuerda: con “didn't”, el verbo se queda en forma base: see, not saw."},
{t:"choose",tag:"Elige la respuesta natural",q:"El detective pregunta “Did you see anyone?” y no viste a nadie. ¿Qué respondes?",opts:["No, I didn't see anyone.","No, I not saw anyone.","No, I didn't saw anyone."],a:0,why:"Con “didn't”, el verbo va en forma base: didn't see, not didn't saw."},
{t:"situation",intro:"El detective sigue haciéndote preguntas sobre anoche.",start:["Detective","What were you doing when you heard the noise?","¿Qué estaba haciendo cuando escuchó el ruido?"],branches:[
{opt:"I was watching TV when I heard it.",npc:"And what did you do next?",best:true,tag:"Muy natural"},
{opt:"I watch TV when I hear it.",npc:"I'm sorry, can you say that again?",best:false,tag:"Tiempo verbal incorrecto",why:"Toda la historia está en pasado: I was watching... when I heard it."},
{opt:"TV. Noise. Then look.",npc:"Could you explain that more clearly?",best:false,tag:"Demasiado fragmentado",why:"Se entiende la idea, pero una oración completa suena mucho más clara y natural."}],outro:"La primera respuesta cuenta la historia de forma clara y en el tiempo verbal correcto."},
{t:"write",prompt:"Escribe qué estabas haciendo ayer a una hora específica, y qué pasó de repente (usa pasado continuo + pasado simple).",placeholder:"Ejemplo: I was... when suddenly...",model:"I was walking home yesterday when suddenly it started to rain. I didn't have an umbrella, so I ran home.",tip:"Usa was/were + verbo-ing para el fondo, y pasado simple para lo que interrumpió."},
{t:"fact",body:"Esta combinación de pasado continuo + pasado simple es una de las estructuras más poderosas para contar historias en inglés — desde una anécdota chistosa hasta una coartada policial, siempre sigue el mismo patrón.",note:"Dominar esta estructura te permite contar casi cualquier historia del pasado con naturalidad."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta con “didn't”?",opts:["I didn't see anyone.","I didn't saw anyone.","I not see anyone."],a:0,why:"Con “didn't”, el verbo va en forma base."},
{q:"¿Cuál combina correctamente pasado continuo y pasado simple?",opts:["I was watching TV when I heard a noise.","I watched TV when I was hearing a noise.","I am watching TV when I heard a noise."],a:0,why:"Fondo en continuo (was watching) + interrupción en simple (heard)."}]}]},
{t:"What Happened? Review",m:6,kind:"review",c:[

{t:"fact",body:"Esta unidad te dio las herramientas para contar historias con más detalle: pasado continuo para el “fondo” de la escena, when/while para conectar interrupciones, y conectores (first, then, suddenly, finally) para dar estructura. Con esto puedes contar casi cualquier anécdota.",note:"La próxima vez que cuentes algo que te pasó, intenta usar al menos una de estas estructuras."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I was watching a movie.","I were watching a movie.","I watching a movie."],a:0,why:"Con “I” usamos was + verbo-ing."},
{q:"¿Qué palabra va con la acción larga (pasado continuo)?",opts:["while","when","then"],a:0,why:"“While” + pasado continuo describe la acción en progreso."},
{q:"¿Qué conector marca el momento sorpresa?",opts:["Suddenly","First","Finally"],a:0,why:"“Suddenly” introduce lo inesperado."},
{q:"¿Cuál es correcta con “didn't”?",opts:["I didn't see anyone.","I didn't saw anyone.","I not see anyone."],a:0,why:"Con “didn't”, el verbo va en forma base."}]}]}

U(4,"People & Personality","users","Describe a las personas: apariencia, personalidad y emociones.",[
{t:"Describing Appearance",m:8,c:[
{t:"mission",title:"Describe what someone looks like.",goal:"Usa adjetivos para describir la apariencia física de alguien.",wolf:"Ready?"},
{t:"dialog",lines:[["Maya","What does your brother look like?","¿Cómo es tu hermano?"],["You","He's tall, with short black hair and brown eyes.","Es alto, con pelo corto y negro, y ojos cafés."],["Maya","Does he wear glasses?","¿Usa lentes?"],["You","Yes, he does. He usually wears a jacket too.","Sí. Normalmente también usa chamarra."]]},
{t:"discover",title:"Expresiones nuevas",items:[["He's tall.","Es alto.","Everyday","jis tol"],["She has short black hair.","Ella tiene pelo corto y negro.","Everyday","shi jas short blak jer"],["He wears glasses.","Él usa lentes.","Everyday","ji uérs gláses"],["She has brown eyes.","Ella tiene ojos cafés.","Everyday","shi jas bráun ais"]]},
{t:"understand",title:"Be vs. Have para describir apariencia",body:"Para describir cómo es alguien usamos “be” con adjetivos (He's tall, She's short) y “have” con partes del cuerpo o accesorios (She has brown eyes, He has a beard, He wears glasses). Es un error común usar “have” con adjetivos: decimos “He's tall”, no “He has tall”.",note:"“Wear” se usa para ropa y accesorios que llevas puestos: wear glasses, wear a jacket, wear a hat."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Cómo describes que alguien es alto?",opts:["He's tall.","He has tall.","He is have tall."],a:0,why:"Los adjetivos de altura van con “be”: He's tall."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “She is brown eyes.” ¿Cuál es?",opts:["Debe ser “have”: She has brown eyes.","Falta “very”.","No hay ningún error."],a:0,why:"Con partes del cuerpo usamos “have”: She has brown eyes."},
{t:"build",q:"Arma la frase: “Él usa lentes.”",words:["glasses","wears","He"],a:"He wears glasses"},
{t:"real",book:"His stature is elevated and his cranial hair is of reduced length.",real:"He's tall, with short hair.",es:"Es alto, con pelo corto.",ctx:"La primera versión suena a reporte médico; “He's tall, with short hair” es simple y natural.",tags:["Everyday"],fast:"jis tol uid short jer"},
{t:"speak",say:"He's tall, with short black hair and brown eyes.",es:"Practica describir la apariencia de alguien.",tip:"Enlaza “short black hair” en un solo golpe de voz."},
{t:"fact",body:"En inglés, el orden de los adjetivos importa: normalmente decimos tamaño antes que color (“short black hair”, no “black short hair”). No necesitas memorizar toda la regla ahora, pero escúchala y repítela así.",note:"Con práctica, el orden correcto empieza a sonar natural sin pensarlo."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["He's tall.","He has tall.","He tall."],a:0,why:"Los adjetivos van con “be”: He's tall."},
{q:"¿Cómo describes los ojos de alguien?",opts:["She has brown eyes.","She is brown eyes.","She wears brown eyes."],a:0,why:"Las partes del cuerpo van con “have”: She has brown eyes."}]}]},
