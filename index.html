   PWA — Service Worker + banner "Instalar EVO English"
   Módulo independiente y silencioso: si algo falla (navegador viejo,
   se sirve desde file://, etc.) no debe romper el resto de la app.
   ========================================================================== */
var PWAInstall = (function () {
 "use strict";
 var LS_KEY = "evoPwaDismissedAt";
 var DIAS_REAPARECER = 14; // si el usuario cierra el banner, no insistir antes de esto
 var deferredPrompt = null; // evento beforeinstallprompt guardado (Android/Chrome)
 var box = null;

 function yaInstalada() {
  try {
   if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
   if (navigator.standalone === true) return true; // Safari iOS
  } catch (e) {}
  return false;
 }
 function esMovil() {
  var ua = navigator.userAgent || "";
  var porUA = /Android|iPhone|iPad|iPod/i.test(ua);
  var porPuntero = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
  return porUA || (porPuntero && window.innerWidth < 900);
 }
 function esIOS() {
  var ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/i.test(ua)) return true;
  // iPadOS 13+ se identifica como "Macintosh" pero tiene pantalla táctil
  return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
 }
 function recienCerrado() {
  try {
   var t = +localStorage.getItem(LS_KEY);
   if (!t) return false;
   return (Date.now() - t) < DIAS_REAPARECER * 24 * 60 * 60 * 1000;
  } catch (e) { return false; }
 }
 function marcarCerrado() {
  try { localStorage.setItem(LS_KEY, String(Date.now())); } catch (e) {}
 }
 function ocultar() { if (box) box.classList.remove("show"); }
 function cerrar() { marcarCerrado(); ocultar(); }

 function pintar(modo) {
  if (!box) return;
  var icono = '<span class="pwb-ic"><img src="' + EMB + '" alt=""></span>';
  if (modo === "android") {
   box.innerHTML = icono +
    '<div class="pwb-txt"><b>Instala EVO English</b><span>Ábrela como app, a pantalla completa, desde tu teléfono.</span></div>' +
    '<button class="pwb-go" type="button">Instalar</button>' +
    '<button class="pwb-x" type="button" aria-label="Cerrar">&times;</button>';
   box.querySelector(".pwb-go").onclick = function () {
    if (!deferredPrompt) { ocultar(); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; ocultar(); });
   };
  } else {
   // iOS Safari no tiene prompt nativo: se explica el camino manual (Compartir -> Agregar a inicio)
   box.innerHTML = icono +
    '<div class="pwb-txt"><b>Instala EVO English</b><span>Toca <b>Compartir</b>' +
    ' <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3v13M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>' +
    ' y luego <b>Agregar a inicio</b>.</span></div>' +
    '<button class="pwb-x" type="button" aria-label="Cerrar">&times;</button>';
  }
  box.querySelector(".pwb-x").onclick = cerrar;
 }

 function mostrarSiCorresponde(modo) {
  if (!box || yaInstalada() || recienCerrado()) return;
  pintar(modo);
  // Pequeño respiro para no interrumpir la primera carga
  setTimeout(function () { box.classList.add("show"); }, 1400);
 }

 function initSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return; // los service workers requieren http(s)
  window.addEventListener("load", function () {
   navigator.serviceWorker.register("sw.js").catch(function () {
    /* silencioso: si el hosting no sirve sw.js (p.ej. subcarpeta distinta),
       la app sigue funcionando normal, solo sin caché offline */
   });
  });
 }

 function init() {
  box = $("pwabanner");
  initSW();
  if (yaInstalada()) return;

  window.addEventListener("beforeinstallprompt", function (e) {
   e.preventDefault();
   deferredPrompt = e;
   if (esMovil()) mostrarSiCorresponde("android");
  });
  window.addEventListener("appinstalled", function () { deferredPrompt = null; marcarCerrado(); ocultar(); });

  // iOS no dispara beforeinstallprompt: se muestra igual, con instrucciones
  if (esIOS() && esMovil()) mostrarSiCorresponde("ios");
 }

 return { init: init };
})();
PWAInstall.init();

window.addEventListener("hashchange",go);go();
</script>
