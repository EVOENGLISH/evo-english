rase?",opts:["I sometimes go hiking.","I go sometimes hiking.","Sometimes I hiking go."],a:0,why:"El adverbio de frecuencia va antes del verbo principal."}]}]}],["Decir y preguntar la hora en inglés.", "Describir tu rutina diaria con presente simple.", "Usar adverbios de frecuencia (always, usually, sometimes, never).", "Hablar de tu día en la escuela, el trabajo y tu tiempo libre."],"#14B8A6"),

{t:"Coffee, tea, or water?",m:8,c:[{t:"mission",title:"Someone offers you a drink.",goal:"Pide una bebida y di cómo la quieres.",wolf:"Ready?"},{t:"dialog",lines:[["Host","Would you like something to drink?","¿Quieres algo de tomar?"],["You","Yes, please. Can I have some water?","Sí, por favor. ¿Me da agua?"],["Host","Sure. Still or sparkling?","Claro. ¿Natural o mineral?"],["You","Still, please.","Natural, por favor."]]},{t:"discover",title:"Expresiones nuevas",items:[["Would you like something to drink?","¿Quieres algo de tomar?","Neutral","wud yu laik sómzin tu drink"],["Can I have some water?","¿Me da agua?","Neutral","kan ai jav som uóter"],["Still or sparkling?","¿Natural o mineral?","Neutral","stil or spárkling"],["No, thanks, I'm good.","No, gracias, estoy bien.","Everyday","nou zanks aim gud"]]},{t:"understand",title:"“some” con cosas que no cuentas una por una",body:"Usa some con líquidos y cosas incontables: some water, some coffee, some sugar. Would you like...? es una forma amable de ofrecer algo. Can I have...? es una forma amable de pedir algo.",note:"Para decir que no quieres nada, la forma más natural es “No, thanks, I'm good”, no simplemente “No”."},{t:"choose",tag:"Elige la respuesta natural",q:"Te ofrecen algo de tomar, pero no quieres nada. ¿Cuál es la más natural?",say:"Would you like something to drink?",opts:["No, thanks, I'm good.","No.","I not want."],a:0,why:"“No, thanks, I'm good” es amable y natural; un simple “No” suena cortante."},{t:"build",q:"Arma la frase: “¿Me da un poco de café?”",words:["coffee","I","some","Can","have"],a:"Can I have some coffee"},{t:"real",book:"I would like to request some water, please.",real:"Can I have some water, please?",es:"Las dos son educadas, pero la segunda es mucho más común al hablar.",ctx:"“I would like to request...” suena muy formal, casi de trámite oficial. Al pedir algo de tomar, la gente dice “Can I have...”",tags:["Neutral","Everyday"],fast:"kan-ai-jav-som-uóter"},{t:"speak",say:"Can I have s s:"Pregunta si el autobús va a tu destino y dónde bajarte.",tip:"Habla con seguridad: son preguntas que cualquier persona hace todo el tiempo."},{t:"fact",body:"En muchas ciudades de Estados Unidos y Canadá, es común que el conductor del autobús te avise cuando llegue tu parada si se lo pides con anticipación, sobre todo si no conoces bien la ruta.",note:"Decir “Can you let me know when we get to the museum?” es una forma muy práctica de asegurarte de no perder tu parada."},{t:"trivia",qs:[{q:"¿Cómo preguntas si el autobús va a cierto lugar?",opts:["Does this bus go downtown?","This bus downtown go?","Do bus go downtown?"],a:0,why:"Con “it/this bus” se usa does + verbo base."},{q:"¿Qué significa “get off”?",opts:["Bajarse de un transporte","Subirse a un transporte","Comprar un boleto"],a:0,why:"“Get off” es bajarse; “get on” es subirse."}]}]},{t:"At the store",m:8,c:[{t:"mission",title:"You need to buy something.",goal:"Pregunta si tienen algo en una tienda y dónde encontrarlo.",wolf:"Let's go!"},{t:"dialog",lines:[["You","Excuse me, do you have batteries?","Disculpe, ¿tienen pilas?"],["Clerk","Yes, they're in aisle five.","Sí, están en el pasillo cinco."],["You","Great, thank you!","¡Genial, gracias!"],["Clerk","You're welcome. Anything else?","De nada. ¿Algo más?"]]},{t:"discover",title:"Expresiones nuevas",items:[["Do you have batteries?","¿Tienen pilas?","Neutral","du yu jav báteris"],["They're in aisle five.","Están en el pasillo cinco.","Neutral","déir in áil faiv"],["Where can I find...?","¿Dónde puedo encontrar...?","Neutral","uér kan ai fáind"],["Is this on sale?","¿Esto está en oferta?","Everyday","is dis on séil"]]},{t:"understand",title:"“Do you have...?” y “Where can I find...?”",body:"Para preguntar si una tienda tiene algo, usa Do you have + producto? Para preguntar dónde está algo, usa Where can I find + producto? “Aisle” es el pasillo dentro de una tienda; se pronuncia “ail”, sin sonido de “s”.",note:"“On sale” significa en oferta/rebaja, no “a la venta” (eso sería simplemente “for sale”)."},{t:"choose",tag:"Elige la respuesta natural",q:"Buscas pilas en una tienda. ¿Cuál es correcta?",say:"How do you ask?",opts:["Do you have batteries?","You have batteries?","Batteries you have?"],a:0,why:"Do you have + producto? es la estructura correcta para preguntar."},{t:"build",q:"Arma la frase: “¿Dónde puedo encontrar las pilas?”",words:["find","can","the","batteries","I","Where"],a:"Where can I find the batteries"},{t:"real",book:"Is it possible for you to inform me of the location of batteries?",real:"Where can I find the batteries?",es:"La segunda es la forma corta y natural de preguntar en una tienda.",ctx:"La primera suena a solicitud escrita muy formal. En una tienda, la gente pregunta directo: “Where can I find...?”",tags:["Everyday","Neutral"],fast:"uér-kan-ai-fáind-de-báteris"},{t:"speak",say:"Do you have batteries? Where can I find them?",es:"Pregunta si tienen un producto y dónde encontrarlo.",tip:"“Aisle” se pronuncia como “ail”: la “s” es muda."},{t:"fact",body:"En tiendas grandes de Estados Unidos, es normal que los pasillos (aisles) estén numerados y anunciados con letreros colgando del techo, lo que facilita mucho encontrar lo que buscas.",note:"Si no ves letreros claros, siempre puedes preguntarle a cualquier empleado con el uniforme de la tienda."},{t:"trivia",qs:[{q:"¿Cómo preguntas si una tienda tiene algo?",opts:["Do you have batteries?","You have batteries?","Have you batteries?"],a:0,why:"Do you have...? es la estructura correcta en presente simple."},{q:"¿Qué significa “on sale”?",opts:["En oferta/rebaja","A la venta simplemente","Agotado"],a:0,why:"“On sale” indica que algo tiene descuento."}]}]},{t:"I'm lost",m:8,c:[{t:"mission",title:"You can't find your way.",goal:"Pide ayuda cuando estás perdido.",wolf:"Ready?"},{t:"dialog",lines:[["You","Excuse me, I'm lost. Can you help me?","Disculpe, estoy perdido. ¿Me puede ayudar?"],["Stranger","Sure, where are you trying to go?","Claro, ¿a dónde intenta llegar?"],["You","I'm looking for the train station.","Estoy buscando la estación de tren."],["Stranger","Oh, it's just around the corner.","Ah, está a la vuelta de la esquina."]]},{t:"discover",title:"Expresiones nuevas",items:[["I'm lost.","Estoy perdido/a.","Neutral","aim lost"],["Can you help me?","¿Me puede ayudar?","Neutral","kan yu jelp mi"],["I'm looking for...","Estoy buscando...","Neutral","aim lúking for"],["It's around the corner.","Está a la vuelta de la esquina.","Neutral","its aráund de kórner"]]},{t:"understand",title:"Pedir ayuda con confianza",body:"I'm lost es una frase corta y directa para decir que no sabes dónde estás. I'm looking for + lugar te ayuda a decir exactamente qué buscas. No hay nada vergonzoso en decir “I'm lost”: es de las frases más útiles al viajar.",note:"“Around the corner” es una expresión muy común para decir que algo está muy cerca."},{t:"choose",tag:"Elige la respuesta natural",q:"No sabes dónde estás y necesitas ayuda. ¿Cuál es correcta?",say:"What do you say?",opts:["I'm lost. Can you help me?","I don't know where.","Help! Lost!"],a:0,why:"I'm lost. Can you help me? es clara, educada y natural."},{t:"build",q:"Arma la frase: “Estoy buscando la estación de tren.”",words:["train","for","looking","I'm","station","the"],a:"I'm looking for the train station"},{t:"real",book:"I am currently unable to determine my geographic location.",real:"I'm lost.",es:"Las dos comunican que no sabes dónde estás, pero la segunda es como realmente se dice.",ctx:"La primera suena a reporte técnico de GPS. Al hablar, cualquier persona simplemente dice “I'm lost.”",tags:["Everyday","Neutral"],fast:"aim-lost"},{t:"speak",say:"Excuse me, I'm lost. I'm looking for the train station.",es:"Pide ayuda porque estás perdido y busca un lugar.",tip:"No suenes nervioso: es una situación muy común y la gente suele ayudar con gusto."},{t:"fact",body:"Muchas apps de mapas funcionan bien incluso sin conexión a internet si descargas el mapa antes; aun así, p U(9,"Travel Mode","plane","Aeropuerto, hotel y pequeños problemas cuando viajas.",[{t:"At the airport",m:8,c:[{t:"mission",title:"You're at the airport.",goal:"Entiende anuncios básicos y encuentra tu puerta.",wolf:"Ready?"},{t:"dialog",lines:[["You","Excuse me, where's gate twelve?","Disculpe, ¿dónde está la puerta doce?"],["Staff","It's down this way, past security.","Está por aquí, después de seguridad."],["You","Thanks! Is the flight on time?","¡Gracias! ¿El vuelo va a tiempo?"],["Staff","Yes, it's on time.","Sí, va a tiempo."]]},{t:"discover",title:"Expresiones nuevas",items:[["Where's gate twelve?","¿Dónde está la puerta doce?","Neutral","uérs guéit tuélv"],["Is the flight on time?","¿El vuelo va a tiempo?","Neutral","is de fláit on táim"],["The flight is delayed.","El vuelo está retrasado.","Neutral","de fláit is diléid"],["boarding pass","pase de abordar","Neutral","bórding pas"]]},{t:"understand",title:"Vocabulario clave del aeropuerto",body:"Gate es la puerta de embarque, boarding pass es tu pase de abordar, y security es el control de seguridad. On time significa a tiempo; delayed significa retrasado. Estas palabras aparecen en pantallas y anuncios, así que reconocerlas te ayuda mucho.",note:"“Where's...?” es una forma corta y útil de preguntar por cualquier lugar en el aeropuerto."},{t:"choose",tag:"Elige la respuesta natural",q:"Quieres saber si tu vuelo llegará a tiempo. ¿Cuál es correcta?",say:"How do you ask?",opts:["Is the flight on time?","The flight time is?","Flight on time is?"],a:0,why:"Is the flight on time? es la pregunta correcta y natural."},{t:"build",q:"Arma la frase: “El vuelo está retrasado.”",words:["is","flight","delayed","The"],a:"The flight is delayed"},{t:"real",book:"Could you please indicate the location of gate twelve?",real:"Where's gate twelve?",es:"La segunda es la forma corta y natural de preguntar en el aeropuerto.",ctx:"La primera suena a solicitud muy formal. En el aeropuerto, la gente simplemente pregunta “Where's gate t ación a nombre de Luis."],["Staff","Great, here's your key. Breakfast is from seven to ten.","Perfecto, aquí está su llave. El desayuno es de siete a diez."],["You","What time is checkout?","¿A qué hora es el checkout?"],["Staff","Checkout is at noon.","El checkout es al mediodía."]]},{t:"discover",title:"Expresiones nuevas",items:[["I have a reservation.","Tengo una reservación.","Neutral","ai jav a réservéichion"],["What time is checkout?","¿A qué hora es el checkout?","Neutral","uát táim is chékaut"],["Is breakfast included?","¿El desayuno está incluido?","Neutral","is brékfast inklúded"],["Do you have wifi?","¿Tienen wifi?","Everyday","du yu jav uaifái"]]},{t:"understand",title:"“under + nombre” para reservaciones",body:"Usa I have a reservation under + tu nombre para registrarte en un hotel. Checkout es la hora en que debes dejar la habitación; check-in es la hora en que puedes entrar. Estas dos palabras son iguales en casi todos los hoteles del mundo de habla inglesa.",note:"“Is ... included?” es útil para preguntar sobre desayuno, wifi, o cualquier servicio extra."},{t:"choose",tag:"Elige la respuesta natural",q:"Llegas al hotel y tienes una reservación a tu nombre. ¿Cuál es correcta?",say:"How do you check in?",opts:["I have a reservation under Luis.","I reservation have name Luis.","Reservation Luis I have under."],a:0,why:"I have a reservation under + nombre es la estructura correcta."},{t:"build",q:"Arma la frase: “¿A qué hora es el checkout?”",words:["is","time","checkout","What"],a:"What time is checkout"},{t:"real",book:"I possess a hotel booking registered to my name.",real:"I have a reservation under Luis.",es:"La segunda es como realmente se dice al llegar a un hotel.",ctx:"La primera suena a documento legal. En la recepción del hotel, se dice “I have a reservation under...”",tags:["Everyday","Neutral"],fast:"ai-jav-a-réservéichion-ánder-lúis"},{t:"speak",say:"I have a reservation under Luis. What time is checkout?",es:"Practica registrarte en un ho ico (bajarlo del carro)."},{t:"choose",tag:"Elige la respuesta natural",q:"Quieres saber cuánto va a tardar el viaje. ¿Cuál es correcta?",say:"How do you ask?",opts:["How long will it take?","How much time will?","Take long how it will?"],a:0,why:"How long will it take? es la pregunta correcta y natural."},{t:"build",q:"Arma la frase: “¿Me puede llevar a esta dirección?”",words:["address","you","take","this","me","to","Can"],a:"Can you take me to this address"},{t:"real",book:"Would it be possible for you to transport me to this location?",real:"Can you take me to this address, please?",es:"La segunda es como se pide un taxi de forma natural.",ctx:"La primera suena a solicitud formal de negocios. En un taxi, se dice simplemente “Can you take me to...?”",tags:["Everyday","Neutral"],fast:"kan-yu-téik-mi-tu-dis-adrés"},{t:"speak",say:"Can you take me to this address? How long will it take?",es:"Pide un taxi y pregunta cuánto tardará.",tip:"Ten la dirección lista para mostrarla o decirla con claridad."},{t:"fact",body:"En muchas ciudades, apps como Uber o Lyft son muy comunes para moverse, y te dan el precio y tiempo estimado antes de confirmar el viaje, lo que facilita mucho no tener que negociar nada.",note:"Aun usando una app, saber decir “Can you drop me off here?” es útil para dar instrucciones específicas al conductor."},{t:"trivia",qs:[{q:"¿Qué pregunta “How long will it take?”",opts:["Cuánto tiempo va a tardar","Qué tan lejos está","Cuánto cuesta"],a:0,why:"“How long” pregunta por duración de tiempo."},{q:"¿Qué significa “drop me off here”?",opts:["Déjeme aquí","Recójame aquí","Espéreme aquí"],a:0,why:"“Drop off” significa dejar a alguien en un lugar."}]}]},{t:"Something's wrong",m:8,c:[{t:"mission",title:"Something isn't right during your trip.",goal:"Explica un problema y pide ayuda mientras viajas.",wolf:"Ready?"},{t:"dialog",lines:[["You","Excuse me, my room key isn't working.","Disculpe, la llave de mi habitación no funciona."],["Staff","I'm sorry about tha U(10,"Real-Life A1","trophy","Misiones mezcladas para comprobar que ya puedes usar tu inglés.",[{t:"Mission 1: New friend",m:9,c:[{t:"mission",title:"You meet someone new at a park.",goal:"Preséntate, habla de ti y conoce a alguien nuevo, de principio a fin.",wolf:"Ready?"},{t:"situation",intro:"Someone sits next to you at the park and starts a conversation.",start:["Robin","Hi! Nice day, isn't it? I'm Robin.","¡Hola! Bonito día, ¿no? Soy Robin."],branches:[{opt:"Hi Robin, I'm {n}. Nice to meet you! I'm from Mexico. What about you?",npc:"I'm from Australia! What do you do here?",tag:"Completo y natural",best:true},{opt:"Yes day nice. I {n}.",npc:"Oh, um, nice to meet you too?",tag:"Muy cortado y confuso",best:false,why:"Se entienden algunas palabras, pero la estructura no es una frase natural."},{opt:"I am pleased that the weather is agreeable today.",npc:"Haha, sure... I'm Robin, by the way.",tag:"Demasiado formal",best:false,why:"Suena forzado para una conversación casual en el parque."}],outro:"Nice! You just started a natural conversation with someone new."},{t:"choose",tag:"Elige la respuesta natural",q:"Robin pregunta “What do you do?” Eres estudiante de diseño. ¿Qué respondes?",opts:["I'm a design student.","I do student design.","I student am design."],a:0,why:"I'm a/an + profesión/ocupación es la estructura correcta, como practicaste en la Unidad 2."},{t:"build",q:"Arma la frase: “Ella es mi hermana, es muy amigable.”",words:["sister","She's","friendly","my","She's","really"],a:"She's my sister She's really friendly"},{t:"speak",say:"Hi, I'm {n}. I'm from Mexico, and I'm a student. Nice to meet you!",es:"Preséntate por completo a alguien nuevo.",tip:"Habla con confianza: ya practicaste toda esta información en unidades anteriores."},{t:"trivia",qs:[{q:"¿Cómo presentas a alguien en una foto o conversación?",opts:["This is my sister.","This my sister is.","Sister this my is."],a:0,why:"This is + persona es la estructura correcta para presentar."},{q:"¿Qué verbo usas para describir el pelo de alguien?",opts:["Have (she has long hair)","Be (she is long hair)","Wear (she wears hair)"],a:0,why:"El pelo va con have: she has long hair."}]}]},{t:"Mission 2: Lunch order",m:9,c:[{t:"mission",title:"You're ordering lunch at a busy restaurant.",goal:"Ordena comida, habla de tus gustos y paga la cuenta.",wolf:"Let's go!"},{t:"situation",intro:"You sit down at a restaurant and the waiter comes to take your order.",start:["Waiter","Hi, are you ready to order?","Hola, ¿están listos para ordenar?"],branches:[{opt:"Yes! I'll have the chicken tacos. I'm allergic to peanuts, by the way.",npc:"Got it, no peanuts. Anything to drink?",tag:"Completo y natural",best:true},{opt:"Tacos chicken give me now.",npc:"Sure... anything else?",tag:"Muy directo/descortés",best:false,why:"Se entiende, pero “I'll have...” suena mucho más natural y educado."},{opt:"I would like to place an order for the chicken taco preparation.",npc:"Ok, one chicken taco, got it.",tag:"Demasiado formal",best:false,why:"Es correcto pero muy forzado para pedir comida."}],outro:"Nice! You just ordered food naturally, including an important allergy."},{t:"choose",tag:"Elige la respuesta natural",q:"Terminas de comer. ¿Qué dices para pedir la cuenta?",opts:["Can I have the check, please?","Give me check.","I finish now pay."],a:0,why:"Can I have the check, please? es la forma educada y natural."},{t:"build",q:"Arma la frase: “¿Me da un poco de agua, por favor?”",words:["water","some","Can","have","please","I"],a:"Can I have some water please"},{t:"speak",say:"I'll have the tacos, please. Can I have the check, please?",es:"Practica ordenar comida y pedir la cuenta en un solo turno.",tip:"Usa “please” de forma natural, no forzada, al final de cada petición."},{t:"trivia",qs:[{q:"¿Cuál es la forma más natural de ordenar comida?",opts:["I'll have the tacos, please.","Give me tacos now.","I desire tacos."],a:0,why:"I'll have + platillo, please es la forma natural de ordenar."},{q:"¿Cómo dices que eres alérgico a algo?",opts:["I'm allergic to peanuts.","I allergic peanuts.","I have allergic peanuts."],a:0,why:"I'm allergic to + comida es correcto."}]}]},{t:"Mission 3: Find the way",m:9,c:[{t:"mission",title:"You're lost in a new neighborhood.",goal:"Pide direcciones y encuentra tu camino.",wolf:"Ready?"},{t:"situation",intro:"You're trying to find the train station and stop a stranger.",start:["Stranger","Hi, can I help you with something?","Hola, ¿le puedo ayudar en algo?"],branches:[{opt:"Yes, please! I'm lost. Where's the train station?",npc:"It's easy! Go straight, then turn left.",tag:"Completo y natural",best:true},{opt:"Train. Station. Where.",npc:"Sorry, which station are you looking for?",tag:"Muy cortado",best:false,why:"Se entienden las palabras, pero no forma una pregunta natural."},{opt:"I am currently unable to locate the railway station.",npc:"Oh, ok... it's just down this street.",tag:"Demasiado formal",best:false,why:"Es gramaticalmente correcto pero muy formal para pedir ayuda en la calle."}],outro:"Nice! You just asked for directions like a natural English speaker."},{t:"choose",tag:"Elige la respuesta natural",q:"Te dan las direcciones. ¿Qué dices para confirmar que entendiste?",opts:["Got it, thank you!","I received.","Understand now fully."],a:0,why:"“Got it, thank you!” es la forma corta y natural de confirmar."},{t:"build",q:"Arma la frase: “Está a dos cuadras de aquí.”",words:["blocks","from","two","here","It's","away"],a:"It's two blocks away from here"},{t:"speak",say:"Excuse me, I'm lost. Where's the train station? Is it far?",es:"Practica pedir ayuda y direcciones completas.",tip:"Habla con calma, como si de verdad necesitaras ayuda para llegar a algún lado."},{t:"trivia",qs:[{q:"¿Cómo empiezas a pedir información a un desconocido?",opts:["Excuse me...","Hey you...","You! Listen..."],a:0,why:"“Excuse me” es la forma educada y estándar."},{q:"¿Qué significa “turn left”?",opts:["Da vuelta a la izquierda","Da vuelta a
