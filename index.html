{t:"dialog",lines:[["Sam","What's your best friend like?","¿Cómo es tu mejor amigo?"],["You","She's really friendly and very funny.","Es muy amigable y muy chistosa."],["Sam","Is she also hardworking?","¿También es trabajadora?"],["You","Yes, she's very hardworking, but sometimes a little shy.","Sí, es muy trabajadora, pero a veces un poco tímida."]]},
{t:"discover",title:"Expresiones nuevas",items:[["She's friendly.","Ella es amigable.","Everyday","shis fréndli"],["He's hardworking.","Él es trabajador.","Everyday","jis járduorkin"],["I'm a little shy.","Soy un poco tímido.","Everyday","aim a lítel shai"],["They're very funny.","Ellos son muy chistosos.","Everyday","déir véri fáni"]]},
{t:"understand",title:"Adjetivos de personalidad comunes",body:"Algunos de los adjetivos de personalidad más usados: friendly (amigable), funny (chistoso), hardworking (trabajador), shy (tímido), kind (amable), honest (honesto), lazy (flojo), confident (seguro de sí mismo). Se usan con “be”: She's friendly, He's honest.",note:"Muchos adjetivos de personalidad terminan en “-y” (friendly, funny, shy) o describen un comportamiento (hardworking, honest)."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que alguien es muy trabajador. ¿Qué dices?",opts:["She's very hardworking.","She's very hardwork.","She has hardworking."],a:0,why:"“Hardworking” es un adjetivo, así que va con “be”: She's hardworking."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “He are very kind.” ¿Cuál es?",opts:["Con “he” se usa “is”: He is very kind.","Falta “very”.","No hay ningún error."],a:0,why:"Con “he/she/it” usamos “is”, no “are”."},
{t:"build",q:"Arma la frase: “Soy un poco tímido.”",words:["shy","a","I'm","little"],a:"I'm a little shy"},
{t:"real",book:"He exhibits a diligent work ethic.",real:"He's really hardworking.",es:"Él es muy trabajador.",ctx:"Nadie describe a un amigo así en una conversación normal; “He's really hardworking” es como realmente se dice.",tags:["Everyday"],fast:"jis rili járduorkin"},
{t:"speak",say:"She's really friendly and very funny.",es:"Practica describir la personalidad de alguien.",tip:"Pronuncia “really” y “friendly” con energía, como si estuvieras contento de describir a esa persona."},
{t:"fact",body:"“Really” y “very” se usan de forma muy parecida para intensificar un adjetivo (really funny = very funny), aunque “really” suena un poco más informal y entusiasta. Vas a profundizar en esto más adelante en la unidad.",note:"Ambas son 100% naturales en conversación cotidiana."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["She's friendly.","She friendly.","She have friendly."],a:0,why:"Los adjetivos de personalidad van con “be”: She's friendly."},
{q:"¿Qué significa “hardworking”?",opts:["Trabajador.","Flojo.","Tímido."],a:0,why:"“Hardworking” describe a alguien que trabaja mucho y con esfuerzo."}]}]},
{t:"How Do You Feel?",m:7,c:[
{t:"mission",title:"Someone asks how you feel.",goal:"Habla de emociones y estados de ánimo.",wolf:"Ready?"},
{t:"dialog",lines:[["Jess","You look tired. Are you okay?","Te ves cansado. ¿Estás bien?"],["You","I'm a bit stressed about work, but I'm okay.","Estoy un poco estresado por el trabajo, pero estoy bien."],["Jess","Do you want to talk about it?","¿Quieres hablar de eso?"],["You","Maybe later. Right now I'm just tired.","Tal vez después. Ahora solo estoy cansado."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I'm tired.","Estoy cansado.","Everyday","aim táierd"],["I'm stressed.","Estoy estresado.","Everyday","aim strest"],["She's excited.","Ella está emocionada.","Everyday","shis eksáited"],["He's worried about the exam.","Él está preocupado por el examen.","Neutral","jis uórid abáut di eksám"]]},
{t:"understand",title:"Emociones con “be”",body:"Los estados de ánimo y emociones van con “be”: I'm tired, She's excited, He's worried. Muchos adjetivos de emoción terminan en “-ed” (tired, stressed, worried, excited) — son los que describen cómo se siente la persona.",note:"Diferencia clave: “I'm bored” (yo me aburro) vs. “It's boring” (eso es aburrido) — presta atención a esta diferencia más adelante."},
{t:"choose",tag:"Elige la respuesta natural",q:"Te ves cansado y alguien te pregunta si estás bien. ¿Qué respondes?",opts:["I'm a bit tired, but I'm okay.","I tired a bit.","I have tired."],a:0,why:"Las emociones van con “be”: I'm tired."},
{t:"choose",tag:"Elige la respuesta natural",q:"¿Cómo dices que estás preocupado por el examen?",opts:["I'm worried about the exam.","I worried the exam.","I have worried about the exam."],a:0,why:"“Worried about” es la estructura natural: be + worried + about."},
{t:"build",q:"Arma la frase: “Ella está emocionada.”",words:["excited","She's"],a:"She's excited"},
{t:"real",book:"I am experiencing a state of psychological stress.",real:"I'm a bit stressed.",es:"Estoy un poco estresado.",ctx:"Nadie describe así su estado de ánimo con un amigo; “I'm a bit stressed” es exactamente como se dice.",tags:["Everyday"],fast:"aim a bit strest"},
{t:"speak",say:"I'm a bit stressed about work, but I'm okay.",es:"Practica hablar de cómo te sientes.",tip:"Baja un poco el tono en “but I'm okay” para sonar tranquilizador."},
{t:"fact",body:"Preguntar “Are you okay?” cuando alguien se ve cansado o triste es una forma natural y amable de mostrar interés en inglés. No necesitas una respuesta perfecta — “I'm okay” o “Not really” son totalmente válidas.",note:"“Not really” es una forma suave de decir que no, sin sonar cortante."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I'm tired.","I tired.","I have tired."],a:0,why:"Las emociones van con “be”: I'm tired."},
{q:"¿Qué significa “worried”?",opts:["Preocupado.","Emocionado.","Cansado."],a:0,why:"“Worried” significa preocupado."}]}]},
{t:"Talking About Relationships",m:9,c:[
{t:"mission",title:"Talk about the people in your life.",goal:"Describe tus relaciones (familia, amigos, pareja) y lee un texto corto sobre una amistad.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","Are you close to your family?","¿Eres cercano a tu familia?"],["You","Yes, very close. I get along really well with my sister.","Sí, muy cercano. Me llevo muy bien con mi hermana."],["Maya","What about your best friend?","¿Y tu mejor amigo?"],["You","We've known each other since school.","Nos conocemos desde la escuela."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I'm close to my family.","Soy cercano a mi familia.","Everyday","aim clóus tu mai fámili"],["I get along well with her.","Me llevo bien con ella.","Everyday","ai get alóng uél uid jer"],["We've known each other for years.","Nos conocemos desde hace años.","Neutral","uívnóun ich áder for íers"],["He's my best friend.","Él es mi mejor amigo.","Everyday","jis mai best frend"]]},
{t:"understand",title:"Expresiones para hablar de relaciones",body:"“Get along with” (llevarse bien con) y “be close to” (ser cercano a) son expresiones clave para hablar de relaciones. “We've known each other for...” usa presente perfecto para algo que empezó en el pasado y sigue siendo cierto — lo verás más a fondo en unidades futuras.",note:"“Get along with” siempre lleva “with”: I get along with my sister, not I get along my sister."},
{t:"reading",title:"A Friendship Story",text:"Ana and Sofia met at university five years ago. They weren't friends at first — they didn't even talk much! But one day, they worked together on a project, and they got along really well. Now they're best friends. They talk every day, and they always help each other with problems. Ana says, \"She's like a sister to me.\"",qs:[
{q:"¿Dónde se conocieron Ana y Sofía?",opts:["En la universidad.","En el trabajo.","En una fiesta."],a:0,why:"El texto dice: “Ana and Sofia met at university five years ago.”"},
{q:"¿Cómo describe Ana a Sofía?",opts:["Como una hermana.","Como una compañera de trabajo.","Como una vecina."],a:0,why:"El texto dice: “She's like a sister to me.”"}]},
{t:"choose",tag:"Elige la respuesta natural",q:"Te llevas muy bien con tu hermana. ¿Qué dices?",opts:["I get along really well with my sister.","I get along really well my sister.","I along get well with my sister."],a:0,why:"“Get along with” siempre lleva “with” después."},
{t:"build",q:"Arma la frase: “Él es mi mejor amigo.”",words:["friend","best","my","He's"],a:"He's my best friend"},
{t:"fact",body:"“We've known each other for years” es una de las formas más naturales de decir que conoces a alguien desde hace tiempo. Vas a ver esta estructura (presente perfecto) con más detalle en la Unidad 7.",note:"Por ahora, solo apréndela como una frase completa: “We've known each other since...”"},
{t:"trivia",qs:[
{q:"¿Qué significa “get along with”?",opts:["Llevarse bien con.","Pelear con.","Conocer a."],a:0,why:"“Get along with” significa llevarse bien con alguien."},
{q:"Según el texto, ¿qué hacen Ana y Sofía todos los días?",opts:["Hablan.","Trabajan juntas.","Viajan juntas."],a:0,why:"El texto dice: “They talk every day.”"}]}]},
{t:"Intensifiers: Really, Very, Too",m:7,c:[
{t:"mission",title:"Add emotion and detail to your descriptions.",goal:"Usa really, very y too para intensificar tus descripciones.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","How was the movie?","¿Cómo estuvo la película?"],["You","It was really good, but it was too long.","Estuvo muy buena, pero fue demasiado larga."],["Sam","Too long? How long was it?","¿Demasiado larga? ¿Cuánto duró?"],["You","Almost three hours! It was very tiring.","¡Casi tres horas! Fue muy cansado."]]},
{t:"discover",title:"Expresiones nuevas",items:[["It was really good.","Estuvo muy buena.","Everyday","it uas rili gud"],["It was very interesting.","Fue muy interesante.","Neutral","it uas véri íntrestin"],["It was too long.","Fue demasiado larga.","Everyday","it uas tu long"],["I'm not too tired.","No estoy demasiado cansado.","Everyday","aim nat tu táierd"]]},
{t:"understand",title:"Really/very = mucho, too = demasiado (problema)",body:"“Really” y “very” intensifican un adjetivo de forma positiva o neutral: really good, very interesting. “Too” significa “demasiado” y normalmente indica un problema: too long (dura demasiado, es un problema), too expensive (cuesta demasiado). No confundas “very good” (muy bueno) con “too good” (¡eso casi no tiene sentido como problema!).",note:"Compara: “It's very hot” (información) vs. “It's too hot” (no puedo soportarlo, es un problema)."},
{t:"choose",tag:"Elige la respuesta natural",q:"La película duró casi 3 horas y eso fue un problema. ¿Qué dices?",opts:["It was too long.","It was very long.","It was really long good."],a:0,why:"“Too long” indica que la duración fue un problema — justo lo que pasó."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “It was too good!” (dicho como algo positivo, sin problema). ¿Cuál es?",opts:["Debería ser “really/very good”: It was really good!","Falta un adjetivo.","No hay ningún error."],a:0,why:"“Too” implica un problema; para algo positivo usamos “really/very good”."},
{t:"build",q:"Arma la frase: “No estoy demasiado cansado.”",words:["tired","not","I'm","too"],a:"I'm not too tired"},
{t:"real",book:"The cinematic experience possessed excessive duration.",real:"The movie was too long.",es:"La película fue demasiado larga.",ctx:"Nadie habla así de una película; “too long” es simple, claro y natural.",tags:["Everyday"],fast:"de múvi uas tu long"},
{t:"speak",say:"It was really good, but it was too long.",es:"Practica usar really y too en la misma oración.",tip:"Pon un poco de énfasis en “too” — ayuda a que se entienda que es un problema."},
{t:"fact",body:"Un error muy común es usar “too” cuando en realidad quieres decir “very” o “really”: decir “I'm too happy” suena raro (¿estar demasiado feliz es un problema?). Usa “too” solo cuando algo es un problema o un exceso.",note:"Si tienes duda, pregúntate: ¿esto es un problema? Si no, usa “very” o “really”."},
{t:"trivia",qs:[
{q:"¿Cuál oración indica un problema?",opts:["It was too long.","It was very long.","It was really long."],a:0,why:"“Too” indica que algo es un problema o un exceso."},
{q:"¿Cuál es la forma correcta de decir “muy interesante” (sin problema)?",opts:["Very interesting.","Too interesting.","Interesting too."],a:0,why:"“Very interesting” es neutral/positivo, sin implicar un problema."}]}]},
{t:"People & Personality Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos apariencia, personalidad, emociones e intensificadores.",wolf:"Let's go!"},
{t:"fact",body:"Esta unidad te dio el vocabulario para describir a las personas por fuera (apariencia), por dentro (personalidad), cómo se sienten (emociones), y cómo intensificar tus descripciones (really/very/too). Vas a usar todo esto constantemente al hablar de la gente en tu vida.",note:"Intenta describir a 3 personas que conoces usando lo que aprendiste en esta unidad."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["He's tall.","He has tall.","He tall."],a:0,why:"Los adjetivos van con “be”."},
{q:"¿Qué significa “hardworking”?",opts:["Trabajador.","Flojo.","Tímido."],a:0,why:"“Hardworking” describe a alguien esforzado."},
{q:"¿Cuál es correcta para una emoción?",opts:["I'm worried.","I worried.","I have worried."],a:0,why:"Las emociones van con “be”."},
{q:"¿Cuál oración indica un problema (demasiado)?",opts:["It was too long.","It was very long.","It was really long."],a:0,why:"“Too” implica un problema."}]}]}
],["Describir la apariencia física de alguien con be/have.","Usar adjetivos de personalidad comunes.","Hablar de emociones y estados de ánimo.","Describir relaciones (familia, amigos) y leer un texto corto sobre una amistad.","Usar really, very y too para intensificar correctamente tus descripciones."],"#F97316"),
U(5,"Food, Places & Experiences","food","Pide comida, habla de cantidades y preferencias, y resuelve una misión en un restaurante.",[
{t:"At the Restaurant",m:8,c:[
{t:"mission",title:"Order food at a restaurant.",goal:"Aprende a pedir comida y bebida usando “I'd like” y “Can I have”.",wolf:"Ready?"},
{t:"dialog",lines:[["Waiter","Are you ready to order?","¿Están listos para ordenar?"],["You","Yes, I'd like the chicken salad, please.","Sí, quisiera la ensalada de pollo, por favor."],["Waiter","And to drink?","¿Y para tomar?"],["You","Can I have a lemonade, please?","¿Me puede dar una limonada, por favor?"]]},
{t:"discover",title:"Expresiones nuevas",items:[["I'd like the chicken salad, please.","Quisiera la ensalada de pollo, por favor.","Everyday","aid laik de chíken sálad pliis"],["Can I have a lemonade?","¿Me puede dar una limonada?","Everyday","can ai jav a lémoneid"],["Could I see the menu, please?","¿Podría ver el menú, por favor?","Formal","cud ai sii de méniu pliis"],["I'll have the soup, please.","Voy a pedir la sopa, por favor.","Everyday","ail jav de sup pliis"]]},
{t:"understand",title:"I'd like / Can I have para pedir",body:"Para pedir algo en un restaurante usamos “I'd like...” (quisiera) o “Can I have...?” (¿me puede dar...?). Ambas son corteses y naturales. “I'll have...” también es muy común y directo cuando ya decidiste qué quieres.",note:"“I want” suena muy directo y un poco brusco para pedir en un restaurante — mejor usa “I'd like” o “Can I have”."},
{t:"choose",tag:"Elige la respuesta natural",q:"Estás en un restaurante y quieres pedir la sopa. ¿Qué dices?",opts:["I'd like the soup, please.","I want soup now.","Give me soup."],a:0,why:"“I'd like...” es la forma cortés y natural de pedir en un restaurante."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I like a lemonade, please.” (quieres pedirla). ¿Cuál es?",opts:["Debe ser “I'd like” (would like), no “I like”: I'd like a lemonade.","Falta “please”.","No hay ningún error."],a:0,why:"“I like” significa que te gusta algo en general; para pedir usamos “I'd like” (I would like)."},
{t:"build",q:"Arma la frase: “¿Me puede dar una limonada?”",words:["a","have","lemonade","Can","I"],a:"Can I have a lemonade"},
{t:"real",book:"I would appreciate receiving the chicken salad.",real:"I'd like the chicken salad, please.",es:"Quisiera la ensalada de pollo, por favor.",ctx:"Nadie habla tan formal en un restaurante normal; “I'd like the chicken salad, please” es como realmente se pide.",tags:["Everyday"],fast:"aid laik de chíken sálad pliis"},
{t:"speak",say:"I'd like the chicken salad, please. Can I have a lemonade too?",es:"Practica pedir comida y bebida.",tip:"Sube un poco la entonación al final de “Can I have a lemonade?” — suena a pregunta cortés."},
{t:"fact",body:"En muchos países de habla inglesa, el mesero suele preguntar “Are you ready to order?” cuando ya tomaste tu decisión. Si necesitas más tiempo, puedes decir “Can we have a few more minutes, please?”",note:"Esta frase te salva en cualquier restaurante."},
{t:"trivia",qs:[
{q:"¿Cuál es la forma cortés de pedir algo?",opts:["I'd like the soup, please.","I want soup.","Soup now."],a:0,why:"“I'd like...” es cortés y natural para pedir."},
{q:"¿Qué significa “Can I have...?”",opts:["¿Me puede dar...?","¿Te gusta...?","¿Dónde está...?"],a:0,why:"“Can I have...?” se usa para pedir algo."}]}]},
{t:"Countable & Uncountable",m:8,c:[
{t:"mission",title:"Talk about food using the right nouns.",goal:"Distingue entre sustantivos contables e incontables para hablar de comida.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","Do we have any apples?","¿Tenemos manzanas?"],["You","We have three apples, but we don't have any rice.","Tenemos tres manzanas, pero no tenemos arroz."],["Maya","Should we buy some bread too?","¿Deberíamos comprar pan también?"],["You","Yes, and a bottle of water.","Sí, y una botella de agua."]]},
{t:"discover",title:"Expresiones nuevas",items:[["We have three apples.","Tenemos tres manzanas.","Everyday","uí jav zrii ápels"],["We don't have any rice.","No tenemos arroz.","Everyday","uí dont jav éni rais"],["Can I have a bottle of water?","¿Me puede dar una botella de agua?","Everyday","can ai jav a bótel of uáter"],["There's a lot of bread here.","Hay mucho pan aquí.","Everyday","ders a lat of bred jir"]]},
{t:"understand",title:"Contables vs. incontables",body:"Los sustantivos contables se pueden contar y tienen plural: an apple / three apples, one egg / two eggs. Los incontables no tienen plural y no usamos “a/an” ni números directamente: rice, water, bread, cheese (no decimos “a rice” ni “two waters”). Para contarlos usamos frases como “a bottle of water”, “a piece of bread”, “a bowl of rice”.",note:"Para saber si un sustantivo es contable, pregúntate: ¿puedo decir “two ___s”? Si sí, es contable."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que tienes tres manzanas. ¿Qué dices?",opts:["I have three apples.","I have three apple.","I have an apples."],a:0,why:"“Apple” es contable, así que el plural es “apples”: three apples."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I'd like a rice, please.” ¿Cuál es?",opts:["“Rice” es incontable, no lleva “a”: I'd like some rice, please.","Falta “please”.","No hay ningún error."],a:0,why:"Los sustantivos incontables como “rice” no llevan “a/an”; usamos “some” en su lugar."},
{t:"build",q:"Arma la frase: “No tenemos arroz.”",words:["any","don't","We","rice","have"],a:"We don't have any rice"},
{t:"real",book:"We are not in possession of any rice at this time.",real:"We don't have any rice.",es:"No tenemos arroz.",ctx:"Nadie habla así en casa; “We don't have any rice” es simple y natural.",tags:["Everyday"],fast:"uí dont jav éni rais"},
{t:"speak",say:"We have three apples, but we don't have any rice.",es:"Practica hablar de lo que tienes y no tienes en la cocina.",tip:"Pronuncia “don't have any” rápido, como una sola frase."},
{t:"fact",body:"Palabras como “bread”, “rice”, “water”, “cheese”, “money” e “information” son incontables en inglés, aunque en español sí las contemos (una información, un dinero). Poco a poco te acostumbrarás a esta diferencia.",note:"Es uno de los errores más comunes de hispanohablantes — no te preocupes, es normal."},
{t:"trivia",qs:[
{q:"¿Cuál sustantivo es incontable?",opts:["Rice.","Apple.","Egg."],a:0,why:"“Rice” es incontable; no decimos “two rices”."},
{q:"¿Cuál es correcta?",opts:["We have three apples.","We have three apple.","We have a apples."],a:0,why:"“Apple” es contable: el plural es “apples”."}]}]},
{t:"Some, Any & A Lot Of",m:8,c:[
{t:"mission",title:"Talk about quantities.",goal:"Usa some, any y a lot of correctamente en oraciones afirmativas, negativas y preguntas.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","Is there any coffee left?","¿Queda café?"],["You","Yes, there's some coffee, but there isn't much milk.","Sí, hay café, pero no hay mucha leche."],["Sam","That's okay. Do we have a lot of sugar?","Está bien. ¿Tenemos mucha azúcar?"],["You","Yes, we have a lot of sugar.","Sí, tenemos mucha azúcar."]]},
{t:"discover",title:"Expresiones nuevas",items:[["There's some coffee.","Hay café.","Everyday","ders sam cófi"],["Is there any coffee left?","¿Queda café?","Everyday","is der éni cófi left"],["We have a lot of sugar.","Tenemos mucha azúcar.","Everyday","uí jav a lat of shúgar"],["There isn't much milk.","No hay mucha leche.","Everyday","der ísent mach milk"]]},
{t:"understand",title:"Some, any y a lot of",body:"Usamos “some” en oraciones afirmativas (There's some coffee) y en ofrecimientos o peticiones (Can I have some water?). Usamos “any” en negativas (There isn't any milk) y preguntas (Is there any coffee?). “A lot of” funciona en afirmativas y preguntas, con contables e incontables: a lot of apples, a lot of sugar.",note:"“Much” se usa con incontables en negativas/preguntas (not much milk) y “many” con contables (not many apples). “A lot of” funciona con ambos y es más fácil de usar."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres saber si queda café. ¿Qué preguntas?",opts:["Is there any coffee left?","Is there some coffee left?","Is there a coffee left?"],a:0,why:"En preguntas normalmente usamos “any”: Is there any coffee left?"},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “There isn't some milk.” ¿Cuál es?",opts:["En negativas usamos “any”: There isn't any milk.","Falta “much”.","No hay ningún error."],a:0,why:"En oraciones negativas usamos “any”, no “some”: There isn't any milk."},
{t:"build",q:"Arma la frase: “Tenemos mucha azúcar.”",words:["a","of","We","lot","sugar","have"],a:"We have a lot of sugar"},
{t:"real",book:"We possess a substantial quantity of sugar.",real:"We have a lot of sugar.",es:"Tenemos mucha azúcar.",ctx:"“We have a lot of sugar” es como se dice en una conversación real, no como un reporte.",tags:["Everyday"],fast:"uí jav a lat of shúgar"},
{t:"speak",say:"There's some coffee, but there isn't much milk.",es:"Practica hablar de lo que hay y no hay en la cocina.",tip:"Baja el tono en “isn't much milk” — suena natural al dar información negativa."},
{t:"fact",body:"Una forma fácil de recordar: SOME para “sí hay / quiero” (afirmativas y ofrecimientos), ANY para “no hay / ¿hay?” (negativas y preguntas). Con práctica, este patrón se vuelve automático.",note:"Excepción: cuando ofreces o pides algo con una pregunta, usamos “some”: Would you like some coffee?"},
{t:"trivia",qs:[
{q:"¿Cuál es correcta para una pregunta?",opts:["Is there any coffee?","Is there some coffee?","Is there a coffee?"],a:0,why:"En preguntas normalmente usamos “any”."},
{q:"¿Cuál es correcta para una negativa?",opts:["There isn't any milk.","There isn't some milk.","There is any milk."],a:0,why:"En negativas usamos “any”, no “some”."}]}]},
{t:"Talking About Preferences",m:9,c:[
{t:"mission",title:"Talk about what food you like and prefer.",goal:"Usa like, love, prefer + gerundio para hablar de tus preferencias de comida.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","Do you like spicy food?","¿Te gusta la comida picante?"],["You","I love spicy food, but I prefer eating it at home.","Me encanta la comida picante, pero prefiero comerla en casa."],["Maya","Why?","¿Por qué?"],["You","Because I can control how spicy it is!","¡Porque puedo controlar qué tan picante está!"]]},
{t:"discover",title:"Expresiones nuevas",items:[["I love spicy food.","Me encanta la comida picante.","Everyday","ai lav spáisi fud"],["I prefer eating at home.","Prefiero comer en casa.","Everyday","ai prifér ítin at jom"],["She doesn't like seafood.","A ella no le gusta el marisco.","Everyday","shi dásent laik sífud"],["I'm not a big fan of sushi.","No soy muy fan del sushi.","Everyday","aim nat a big fan of súshi"]]},
{t:"understand",title:"Like / love / prefer + gerundio",body:"Después de like, love, hate y prefer, usamos el verbo en forma -ing (gerundio) cuando hablamos de una actividad en general: I love cooking, I prefer eating at home, She hates waiting in line. También podemos usar estos verbos con sustantivos: I love spicy food.",note:"“I'm not a big fan of...” es una forma muy natural e informal de decir que algo no te gusta mucho, sin ser tan directo como “I hate...”."},
{t:"reading",title:"A Trip to the Market",text:"Every Saturday, Carlos goes to the market with his mother. He loves trying new fruits, but he doesn't like vegetables very much. His mother always buys a lot of tomatoes and onions because she prefers cooking with fresh ingredients. Carlos's favorite part is the food stands — he loves eating tacos there before they go home.",qs:[
{q:"¿Qué le encanta hacer a Carlos en el mercado?",opts:["Probar frutas nuevas.","Comprar cebollas.","Cocinar con su mamá."],a:0,why:"El texto dice: “He loves trying new fruits.”"},
{q:"¿Qué prefiere hacer la mamá de Carlos?",opts:["Cocinar con ingredientes frescos.","Comer tacos.","Comprar comida rápida."],a:0,why:"El texto dice: “she prefers cooking with fresh ingredients.”"}]},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que te encanta cocinar. ¿Qué dices?",opts:["I love cooking.","I love cook.","I love to cooking."],a:0,why:"Después de “love” usamos el gerundio: I love cooking."},
{t:"build",q:"Arma la frase: “Prefiero comer en casa.”",words:["eating","I","home","at","prefer"],a:"I prefer eating at home"},
{t:"fact",body:"“I'm not a big fan of...” es una forma súper común y natural de decir que algo no te encanta, sin sonar grosero. Por ejemplo: “I'm not a big fan of seafood” suena mucho más amigable que “I hate seafood”.",note:"Úsala cuando quieras ser honesto pero cortés."},
{t:"trivia",qs:[
{q:"¿Qué forma va después de “love” cuando hablamos de una actividad en general?",opts:["El gerundio (-ing): I love cooking.","El infinitivo: I love to cook.","El pasado: I love cooked."],a:0,why:"Usamos el gerundio después de like/love/prefer para actividades en general."},
{q:"Según el texto, ¿qué come Carlos en los food stands?",opts:["Tacos.","Sushi.","Ensalada."],a:0,why:"El texto dice: “he loves eating tacos there.”"}]}]},
{t:"Restaurant Mission",m:9,c:[
{t:"mission",title:"Handle a full restaurant experience.",goal:"Usa todo lo aprendido: pedir comida, hablar de cantidades y preferencias.",wolf:"Ready?"},
{t:"dialog",lines:[["Waiter","Welcome! Are you ready to order, or do you need a few more minutes?","¡Bienvenido! ¿Están listos para ordenar, o necesitan más tiempo?"],["You","We're ready. Could I see the menu one more time?","Estamos listos. ¿Podría ver el menú una vez más?"],["Waiter","Of course. Take your time.","Claro. Tómense su tiempo."],["You","Thanks! I'd like the pasta, please, and can I have some water?","¡Gracias! Quisiera la pasta, por favor, y ¿me puede dar agua?"]]},
{t:"situation",intro:"Estás en un restaurante con un amigo. El mesero llega a tomar la orden.",start:["Waiter","Hi! What would you like to order today?","¡Hola! ¿Qué van a ordenar hoy?"],branches:[
{opt:"I'd like the chicken salad, please.",npc:"Great choice! And to drink?",best:true,tag:"Cortés y claro"},
{opt:"Give me chicken salad.",npc:"...Okay. And to drink?",best:false,tag:"Muy directo",why:"Suena brusco; mejor usa “I'd like...” o “Can I have...?”."},
{opt:"Chicken salad now.",npc:"Sure... anything to drink?",best:false,tag:"Demasiado informal",why:"Falta cortesía; en un restaurante es mejor ser un poco más formal."}],outro:"El mesero anota tu orden y se va a la cocina. ¡Buen trabajo pidiendo tu comida!"},
{t:"choose",tag:"Elige la respuesta natural",q:"El mesero pregunta si quieres algo más. No quieres nada más. ¿Qué dices?",opts:["No, thank you. That's all for now.","No.","I don't want anything more never."],a:0,why:"“No, thank you. That's all for now.” es cortés y natural."},
{t:"build",q:"Arma la frase: “¿Podría ver el menú una vez más?”",words:["I","the","see","menu","Could","again"],a:"Could I see the menu again"},
{t:"speak",say:"I'd like the pasta, please, and can I have some water?",es:"Practica pedir tu comida y bebida en una sola oración.",tip:"Haz una pequeña pausa después de “please” antes de seguir con la segunda petición."},
{t:"fact",body:"Al final de una comida, es común que el mesero pregunte “Would you like anything else?” o “Can I get you the check?”. Responder “Just the check, please” es una forma rápida y natural de pedir la cuenta.",note:"“Check” (EE.UU.) y “bill” (Reino Unido) significan lo mismo: la cuenta."},
{t:"trivia",qs:[
{q:"¿Cómo pides la cuenta de forma natural?",opts:["Just the check, please.","Give me money paper.","I want pay now."],a:0,why:"“Just the check, please” es la forma natural y común de pedir la cuenta."},
{q:"¿Cuál es la opción más cortés para pedir comida?",opts:["I'd like the chicken salad, please.","Give me chicken salad.","Chicken salad now."],a:0,why:"“I'd like...” es cortés y natural en un restaurante."}]}]},
{t:"Food & Experiences Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos cómo pedir comida, contables/incontables, cantidades y preferencias.",wolf:"Let's go!"},
{t:"fact",body:"Esta unidad te dio las herramientas para manejarte en cualquier restaurante: pedir con cortesía (I'd like / Can I have), distinguir sustantivos contables e incontables, hablar de cantidades (some/any/a lot of) y expresar tus preferencias de comida (like/love/prefer + gerundio).",note:"Intenta pedir tu próxima comida en un restaurante real usando estas frases, ¡aunque sea en tu cabeza!"},
{t:"trivia",qs:[
{q:"¿Cuál es la forma cortés de pedir algo?",opts:["I'd like the soup, please.","I want soup.","Soup now."],a:0,why:"“I'd like...” es cortés y natural."},
{q:"¿Cuál sustantivo es incontable?",opts:["Rice.","Apple.","Egg."],a:0,why:"“Rice” es incontable."},
{q:"¿Cuál es correcta para una pregunta sobre cantidad?",opts:["Is there any coffee?","Is there some coffee?","Is there a coffee?"],a:0,why:"En preguntas normalmente usamos “any”."},
{q:"¿Qué forma va después de “love” para una actividad en general?",opts:["El gerundio (-ing): I love cooking.","El infinitivo.","El pasado."],a:0,why:"Usamos el gerundio después de like/love/prefer."}]}]}
],["Pedir comida y bebida con cortesía usando I'd like y Can I have.","Distinguir sustantivos contables e incontables.","Usar some, any y a lot of para hablar de cantidades.","Hablar de preferencias de comida con like/love/prefer + gerundio, y leer un texto corto.","Manejar una experiencia completa en un restaurante, de principio a fin."],"#14C2F5"),
U(6,"Plans, Dreams & the Future","calendar","Habla de planes, sueños y predicciones con going to, will y presente continuo de futuro.",[
{t:"Going To vs Will",m:8,c:[
{t:"mission",title:"Talk about your plans for the future.",goal:"Usa “going to” para planes decididos y “will” para decisiones espontáneas y predicciones.",wolf:"Ready?"},
{t:"dialog",lines:[["Maya","What are you going to do this weekend?","¿Qué vas a hacer este fin de semana?"],["You","I'm going to visit my parents. I already bought the bus ticket.","Voy a visitar a mis papás. Ya compré el boleto de autobús."],["Maya","Nice! I don't know yet. Maybe I'll stay home.","¡Qué bien! Yo no sé todavía. Tal vez me quede en casa."],["You","Well, if you're bored, I'll call you.","Bueno, si te aburres, te llamo."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I'm going to visit my parents.","Voy a visitar a mis papás.","Everyday","aim góin tu vísit mai párents"],["I already bought the ticket.","Ya compré el boleto.","Everyday","ai olrédi bot de tíket"],["Maybe I'll stay home.","Tal vez me quede en casa.","Everyday","méibi ail stei jom"],["I'll call you later.","Te llamo después.","Everyday","ail col iu léiter"]]},
{t:"understand",title:"Going to vs. will",body:"Usamos “going to” para planes que ya decidimos, especialmente si ya hicimos algo para prepararlos (I'm going to visit my parents — ya compré el boleto). Usamos “will” para decisiones que tomamos en el momento de hablar, sin planearlas antes (Maybe I'll stay home) y también para predicciones y promesas (I'll call you later).",note:"Pista: si ya tomaste la decisión antes de hablar, usa “going to”. Si decides justo en ese momento, usa “will”."},
{t:"choose",tag:"Elige la respuesta natural",q:"Ya compraste el boleto para visitar a tus papás. ¿Cómo lo dices?",opts:["I'm going to visit my parents.","I will visit my parents.","I visit going my parents."],a:0,why:"Como ya tomaste la decisión (compraste el boleto), usamos “going to”."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I going to call you later.” ¿Cuál es?",opts:["Falta “am”: I'm going to call you later.","Debe ser “will”.","No hay ningún error."],a:0,why:"“Going to” siempre lleva el verbo “be” (am/is/are) antes: I'm going to."},
{t:"build",q:"Arma la frase: “Tal vez me quede en casa.”",words:["stay","Maybe","home","I'll"],a:"Maybe I'll stay home"},
{t:"real",book:"I have formulated the intention to visit my parents.",real:"I'm going to visit my parents.",es:"Voy a visitar a mis papás.",ctx:"Nadie habla así con un amigo; “I'm going to visit my parents” es simple y natural.",tags:["Everyday"],fast:"aim góin tu vísit mai párents"},
{t:"speak",say:"I'm going to visit my parents this weekend.",es:"Practica hablar de un plan que ya decidiste.",tip:"Une “going to” en un solo sonido: “gonna” es cómo se pronuncia informalmente."},
{t:"fact",body:"En inglés hablado informal, “going to” casi siempre se pronuncia “gonna” (I'm gonna visit...). Es totalmente normal en conversación, aunque no se escribe así en textos formales.",note:"Vas a escuchar “gonna” constantemente en películas, series y conversaciones reales."},
{t:"trivia",qs:[
{q:"¿Cuál usamos para un plan ya decidido?",opts:["Going to.","Will.","Both are the same."],a:0,why:"“Going to” se usa para planes ya decididos."},
{q:"¿Cuál usamos para una decisión espontánea?",opts:["Will.","Going to.","Present simple."],a:0,why:"“Will” se usa para decisiones que tomamos en el momento."}]}]},
{t:"Making Plans & Invitations",m:8,c:[
{t:"mission",title:"Make plans and invite someone.",goal:"Invita a alguien y organiza planes usando expresiones naturales.",wolf:"Let's go!"},
{t:"dialog",lines:[["Sam","Are you free on Saturday? Do you want to get lunch?","¿Estás libre el sábado? ¿Quieres comer juntos?"],["You","Sure! What time works for you?","¡Claro! ¿A qué hora te queda bien?"],["Sam","How about 1pm? I know a great taco place.","¿Qué tal a la 1pm? Conozco un lugar de tacos increíble."],["You","Perfect, see you then!","Perfecto, ¡nos vemos!"]]},
{t:"discover",title:"Expresiones nuevas",items:[["Are you free on Saturday?","¿Estás libre el sábado?","Everyday","ar iu frii on sáturdei"],["Do you want to get lunch?","¿Quieres comer juntos?","Everyday","du iu uánt tu guet lanch"],["What time works for you?","¿A qué hora te queda bien?","Everyday","uát taim uérks for iu"],["How about 1pm?","¿Qué tal a la 1pm?","Everyday","jáu abáut uán pii em"]]},
{t:"understand",title:"Invitar y organizar planes",body:"Para invitar a alguien usamos “Do you want to...?” o “Would you like to...?” (más formal). Para proponer un horario, “How about + hora?” es muy natural. Para confirmar, decimos “Sure!”, “Sounds good!” o “Perfect, see you then!”.",note:"“How about...?” también sirve para proponer lugares o actividades: How about the new restaurant? How about Friday instead?"},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres invitar a un amigo a comer. ¿Qué dices?",opts:["Do you want to get lunch?","You lunch want?","Lunch, yes or no?"],a:0,why:"“Do you want to...?” es la forma natural de invitar a alguien."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “What time work for you?” ¿Cuál es?",opts:["Falta la “s”: What time works for you?","Debe ser “working”.","No hay ningún error."],a:0,why:"Con “time” (tercera persona singular) el verbo lleva “s”: works."},
{t:"build",q:"Arma la frase: “¿A qué hora te queda bien?”",words:["for","time","you","What","works"],a:"What time works for you"},
{t:"real",book:"Would it be convenient for you to dine together?",real:"Do you want to get lunch?",es:"¿Quieres comer juntos?",ctx:"Nadie invita así a un amigo; “Do you want to get lunch?” es como realmente se dice.",tags:["Everyday"],fast:"du iu uánt tu guet lanch"},
{t:"speak",say:"Are you free on Saturday? Do you want to get lunch?",es:"Practica invitar a alguien a hacer un plan.",tip:"Sube la entonación en “free” — es la parte clave de la pregunta."},
{t:"fact",body:"“How about...?” es una de las expresiones más útiles en inglés: sirve para proponer horarios, lugares o actividades, casi cualquier cosa. Úsala mucho — suena súper natural.",note:"Ejemplo: “How about Friday?” “How about the new café?”"},
{t:"trivia",qs:[
{q:"¿Cómo invitas a alguien a comer?",opts:["Do you want to get lunch?","You lunch want?","Lunch now."],a:0,why:"“Do you want to...?” es la forma natural de invitar."},
{q:"¿Qué usamos para proponer un horario?",opts:["How about + hora.","What about hora.","Hora, yes?"],a:0,why:"“How about + hora?” es la forma natural de proponer un horario."}]}]},
{t:"Predictions",m:8,c:[
{t:"mission",title:"Make predictions about the future.",goal:"Usa “will” y “probably” para hacer predicciones.",wolf:"Ready?"},
{t:"dialog",lines:[["Jess","Do you think it will rain tomorrow?","¿Crees que va a llover mañana?"],["You","I think it will. The sky is already gray.","Creo que sí. El cielo ya está gris."],["Jess","In ten years, I think everyone will work from home.","En diez años, creo que todos trabajarán desde casa."],["You","Maybe! Technology changes so fast.","¡Tal vez! La tecnología cambia muy rápido."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I think it will rain.","Creo que va a llover.","Everyday","ai zink it uil rein"],["It will probably be sunny.","Probablemente estará soleado.","Everyday","it uil próbabli bi sáni"],["Everyone will work from home.","Todos trabajarán desde casa.","Neutral","évriuan uil uérk from jom"],["I don't think it will happen.","No creo que eso pase.","Everyday","ai dont zink it uil jápen"]]},
{t:"understand",title:"Will para predicciones",body:"Usamos “will” para predecir el futuro basándonos en lo que pensamos u opinamos, especialmente con “I think...”, “I don't think...” y “probably”. Ejemplo: I think it will rain / It will probably be sunny. El orden con “probably” es: sujeto + will + probably + verbo (It will probably rain).",note:"“I think it will...” y “I don't think it will...” son las formas más naturales de dar una opinión sobre el futuro."},
{t:"choose",tag:"Elige la respuesta natural",q:"Crees que va a llover mañana. ¿Qué dices?",opts:["I think it will rain tomorrow.","I think it rains will tomorrow.","I think will it rain tomorrow."],a:0,why:"El orden correcto es: I think it will rain tomorrow."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “It will be probably sunny.” ¿Cuál es?",opts:["“Probably” va antes del verbo: It will probably be sunny.","Falta “will”.","No hay ningún error."],a:0,why:"El orden correcto es: will + probably + verbo."},
{t:"build",q:"Arma la frase: “Probablemente estará soleado.”",words:["probably","sunny","will","It","be"],a:"It will probably be sunny"},
{t:"real",book:"Meteorological conditions will likely include precipitation.",real:"I think it will probably rain.",es:"Creo que probablemente va a llover.",ctx:"Nadie habla del clima así con un amigo; “I think it will probably rain” es simple y natural.",tags:["Everyday"],fast:"ai zink it uil próbabli rein"},
{t:"speak",say:"I think it will rain tomorrow. The sky is already gray.",es:"Practica hacer predicciones sobre el clima.",tip:"Pronuncia “will” rápido y suave — casi como “ll” en conversación."},
{t:"fact",body:"En conversación, “will” casi siempre se contrae: I will → I'll, it will → it'll. Escucharás “it'll rain” mucho más que “it will rain” en inglés hablado natural.",note:"No te preocupes por escribir la forma completa siempre — la contracción es la norma."},
{t:"trivia",qs:[
{q:"¿Cuál es el orden correcto?",opts:["It will probably rain.","It probably will rain.","It rain will probably."],a:0,why:"El orden correcto es: will + probably + verbo."},
{q:"¿Para qué usamos “will” en esta lección?",opts:["Para hacer predicciones.","Para hablar del pasado.","Para dar órdenes."],a:0,why:"“Will” se usa para predicciones sobre el futuro."}]}]},
{t:"Talking About Your Dreams",m:8,c:[
{t:"mission",title:"Talk about your dreams and goals.",goal:"Usa “would like to” y “hope to” para hablar de tus sueños y metas.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","What's your dream job?","¿Cuál es tu trabajo soñado?"],["You","I'd like to be a photographer. I hope to travel the world someday.","Me gustaría ser fotógrafo. Espero viajar por el mundo algún día."],["Maya","That sounds amazing! Where would you like to go first?","¡Suena increíble! ¿A dónde te gustaría ir primero?"],["You","Japan, definitely. I've always dreamed of visiting Tokyo.","Japón, definitivamente. Siempre he soñado con visitar Tokio."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I'd like to be a photographer.","Me gustaría ser fotógrafo.","Everyday","aid laik tu bi a fotógrafer"],["I hope to travel the world.","Espero viajar por el mundo.","Everyday","ai jop tu trável de uérld"],["My dream is to open my own business.","Mi sueño es abrir mi propio negocio.","Neutral","mai driim is tu ópen mai oun bísnes"],["Someday, I want to learn to fly.","Algún día, quiero aprender a volar.","Everyday","samdéi ai uánt tu lern tu flai"]]},
{t:"understand",title:"Would like to / hope to para sueños",body:"Para hablar de sueños y metas usamos “I'd like to...” (me gustaría), “I hope to...” (espero) y “My dream is to...” (mi sueño es). Todas van seguidas del verbo en infinitivo: I'd like to travel, I hope to learn, My dream is to open a business.",note:"“Someday” (algún día) es una palabra clave para hablar de sueños a largo plazo, sin una fecha exacta."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que te gustaría ser fotógrafo. ¿Qué dices?",opts:["I'd like to be a photographer.","I like be a photographer.","I would to be a photographer."],a:0,why:"“I'd like to” + infinitivo es la forma correcta: I'd like to be."},
{t:"build",q:"Arma la frase: “Espero viajar por el mundo.”",words:["travel","hope","the","I","world","to"],a:"I hope to travel the world"},
{t:"fact",body:"“I've always dreamed of...” es una forma muy natural y expresiva de hablar de un sueño de toda la vida. Va seguida de gerundio: I've always dreamed of visiting Japan, I've always dreamed of learning to paint.",note:"Guárdala — suena mucho más genuina que solo decir “I want to...”."},
{t:"speak",say:"I'd like to be a photographer. I hope to travel the world someday.",es:"Practica hablar de tus sueños y metas.",tip:"Pon energía en “someday” — ayuda a transmitir ilusión por tu sueño."},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I'd like to be a photographer.","I like be a photographer.","I would to be a photographer."],a:0,why:"“I'd like to” + infinitivo."},
{q:"¿Qué significa “someday”?",opts:["Algún día.","Todos los días.","Nunca."],a:0,why:"“Someday” significa “algún día”, sin fecha exacta."}]}]},
{t:"Decisions Mission",m:9,c:[
{t:"mission",title:"Handle a real decision-making conversation.",goal:"Combina going to, will y planes para tomar y hablar de decisiones.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","Have you decided what you're going to study?","¿Ya decidiste qué vas a estudiar?"],["You","Not yet, but I think I'll choose something related to technology.","Todavía no, pero creo que voy a elegir algo relacionado con tecnología."],["Sam","That's a great field. It'll probably keep growing.","Es un gran campo. Probablemente va a seguir creciendo."],["You","Yeah, that's part of why I'm considering it.","Sí, esa es parte de la razón por la que lo estoy considerando."]]},
{t:"situation",intro:"Un amigo te pregunta sobre tus planes para el próximo año.",start:["Jordan","So, what are you going to do next year?","Entonces, ¿qué vas a hacer el próximo año?"],branches:[
{opt:"I'm going to start a new job. I already accepted the offer.",npc:"Wow, congratulations! That's exciting.",best:true,tag:"Claro y natural"},
{opt:"I will maybe start a new job I don't know.",npc:"Oh... okay, good luck with that.",best:false,tag:"Confuso",why:"Mezclar “will” con “maybe” y “I don't know” suena confuso; si ya lo decidiste, usa “going to”."},
{opt:"New job next year me.",npc:"Sorry, what do you mean?",best:false,tag:"Gramática incompleta",why:"Falta una oración completa con sujeto y verbo: I'm going to start a new job."}],outro:"Tu amigo entendió tu plan claramente. ¡Bien hecho explicando tu decisión!"},
{t:"choose",tag:"Elige la respuesta natural",q:"Ya decidiste qué vas a estudiar. ¿Cómo lo dices?",opts:["I've decided. I'm going to study technology.","I decide will study technology.","Technology I will."],a:0,why:"“I'm going to” es correcto para un plan ya decidido."},
{t:"build",q:"Arma la frase: “Probablemente va a seguir creciendo.”",words:["growing","probably","keep","It'll"],a:"It'll probably keep growing"},
{t:"speak",say:"I think I'll choose something related to technology.",es:"Practica hablar de una decisión que estás considerando.",tip:"Pronuncia “related to” de forma fluida, como una sola unidad."},
{t:"fact",body:"Cuando todavía no decides algo con seguridad, frases como “I'm considering...”, “I'm thinking about...” o “I might...” son perfectas — muestran que lo estás pensando sin comprometerte al 100%.",note:"“I might” (podría) es más incierto que “I will” o “I'm going to”."},
{t:"trivia",qs:[
{q:"¿Qué usamos para un plan que ya decidiste?",opts:["Going to.","Might.","Present simple."],a:0,why:"“Going to” es para planes ya decididos."},
{q:"¿Qué significa “I'm considering...”?",opts:["Lo estoy pensando.","Ya lo decidí.","Nunca lo haré."],a:0,why:"“I'm considering” muestra que aún lo estás pensando."}]}]},
{t:"Plans & Future Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos going to, will, invitaciones, predicciones y sueños.",wolf:"Let's go!"},
{t:"fact",body:"Esta unidad te dio las herramientas para hablar del futuro de varias formas: planes decididos (going to), decisiones espontáneas y predicciones (will), invitaciones (Do you want to...?/How about...?), y sueños a largo plazo (I'd like to.../I hope to...).",note:"Intenta describir 3 planes tuyos para el próximo mes usando going to."},
{t:"trivia",qs:[
{q:"¿Cuál usamos para un plan ya decidido?",opts:["Going to.","Will.","Both are the same."],a:0,why:"“Going to” para planes ya decididos."},
{q:"¿Cuál usamos para una predicción con opinión?",opts:["I think it will...","I going think...","Will I think..."],a:0,why:"“I think it will...” es la forma natural de predecir con opinión."},
{q:"¿Cómo invitas a alguien de forma natural?",opts:["Do you want to get lunch?","You lunch want?","Lunch now."],a:0,why:"“Do you want to...?” es natural para invitar."},
{q:"¿Cuál es correcta para hablar de un sueño?",opts:["I'd like to be a photographer.","I like be a photographer.","I would to be a photographer."],a:0,why:"“I'd like to” + infinitivo."}]}]}
],["Distinguir going to (planes decididos) de will (decisiones espontáneas y predicciones).","Invitar a alguien y organizar planes con expresiones naturales.","Hacer predicciones sobre el futuro con will, probably e I think.","Hablar de sueños y metas con I'd like to, I hope to y My dream is to.","Manejar una conversación real sobre decisiones y planes futuros."],"#D97706"),
U(7,"Life, Work & Technology","bot","Trabajo, tecnología y tus primeras experiencias con presente perfecto.",[
{t:"Jobs & Routines",m:8,c:[
{t:"mission",title:"Talk about your job and daily routine.",goal:"Habla de tu trabajo y tu rutina diaria en el ámbito laboral.",wolf:"Ready?"},
{t:"dialog",lines:[["Maya","What do you do for a living?","¿A qué te dedicas?"],["You","I work as a graphic designer. I usually start at 9am.","Trabajo como diseñador gráfico. Normalmente empiezo a las 9am."],["Maya","Do you work from home?","¿Trabajas desde casa?"],["You","Sometimes. I work from home twice a week.","A veces. Trabajo desde casa dos veces por semana."]]},
{t:"discover",title:"Expresiones nuevas",items:[["What do you do for a living?","¿A qué te dedicas?","Everyday","uát du iu du for a lívin"],["I work as a graphic designer.","Trabajo como diseñador gráfico.","Everyday","ai uérk as a gráfic desáiner"],["I work from home.","Trabajo desde casa.","Everyday","ai uérk from jom"],["I'm in charge of the marketing team.","Estoy a cargo del equipo de marketing.","Neutral","aim in chárch of de márketin tiim"]]},
{t:"understand",title:"Hablar del trabajo",body:"“What do you do?” o “What do you do for a living?” son las formas naturales de preguntar a qué se dedica alguien. Para responder usamos “I work as a...” (trabajo como...) + profesión, o “I'm a...” + profesión. “I'm in charge of...” significa que estás a cargo de algo.",note:"“I work for [empresa]” se usa para decir dónde trabajas: I work for Google. “I work as [puesto]” se usa para el rol: I work as a designer."},
{t:"choose",tag:"Elige la respuesta natural",q:"Alguien pregunta a qué te dedicas. ¿Qué dices?",opts:["I work as a graphic designer.","I designer work graphic.","Work I designer."],a:0,why:"“I work as a + profesión” es la forma natural de responder."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I work in home.” ¿Cuál es?",opts:["Debe ser “from home”: I work from home.","Falta “the”.","No hay ningún error."],a:0,why:"La expresión correcta es “work from home”, no “work in home”."},
{t:"build",q:"Arma la frase: “Trabajo desde casa dos veces por semana.”",words:["a","home","from","week","I","twice","work"],a:"I work from home twice a week"},
{t:"real",book:"My professional occupation involves graphic design.",real:"I work as a graphic designer.",es:"Trabajo como diseñador gráfico.",ctx:"Nadie habla así de su trabajo en una charla casual; “I work as a graphic designer” es simple y natural.",tags:["Everyday"],fast:"ai uérk as a gráfic desáiner"},
{t:"speak",say:"I work as a graphic designer. I usually start at 9am.",es:"Practica hablar de tu trabajo y tu horario.",tip:"Pronuncia “graphic designer” claramente, palabra por palabra."},
{t:"fact",body:"“What do you do?” es una de las preguntas más comunes al conocer a alguien nuevo en inglés — casi tan común como preguntar el nombre. Prepara tu respuesta de antemano para sentirte más seguro.",note:"Si aún estás estudiando, puedes decir: “I'm a student. I study [carrera].”"},
{t:"trivia",qs:[
{q:"¿Cómo preguntas a qué se dedica alguien?",opts:["What do you do?","What you do?","Do you what?"],a:0,why:"“What do you do?” es la forma natural de preguntar."},
{q:"¿Cuál es correcta?",opts:["I work from home.","I work in home.","I work at home from."],a:0,why:"La expresión correcta es “work from home”."}]}]},
{t:"Talking About Technology",m:8,c:[
{t:"mission",title:"Talk about the technology you use every day.",goal:"Habla de dispositivos, apps y hábitos tecnológicos.",wolf:"Let's go!"},
{t:"dialog",lines:[["Sam","How many hours a day do you spend on your phone?","¿Cuántas horas al día pasas en tu teléfono?"],["You","Probably too many! I use it for work and social media.","¡Probablemente demasiadas! Lo uso para trabajo y redes sociales."],["Sam","Do you use any apps to stay organized?","¿Usas alguna app para organizarte?"],["You","Yes, I use a calendar app and a to-do list app.","Sí, uso una app de calendario y una de lista de pendientes."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I spend a lot of time on my phone.","Paso mucho tiempo en mi teléfono.","Everyday","ai spend a lat of taim on mai fon"],["I use a calendar app.","Uso una app de calendario.","Everyday","ai ius a cálendar ap"],["My laptop is really slow.","Mi laptop está muy lenta.","Everyday","mai láptap is rili slóu"],["I need to charge my phone.","Necesito cargar mi teléfono.","Everyday","ai niid tu charch mai fon"]]},
{t:"understand",title:"Hablar de tecnología",body:"“Spend time on...” se usa para hablar de cuánto tiempo pasas usando algo: I spend a lot of time on my phone. “Use” es el verbo general para dispositivos y apps: I use my laptop for work. Vocabulario clave: app, device, screen, battery, wifi, charger.",note:"“Charge” (cargar la batería) no se traduce como “cargo” — cuidado con este falso amigo."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que pasas mucho tiempo en tu teléfono. ¿Qué dices?",opts:["I spend a lot of time on my phone.","I pass a lot of time in my phone.","I expend much time on phone."],a:0,why:"“Spend time on...” es la forma natural en inglés."},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “My laptop is very slowly.” ¿Cuál es?",opts:["Debe ser el adjetivo “slow”, no el adverbio: My laptop is very slow.","Falta “really”.","No hay ningún error."],a:0,why:"Después de “be” usamos un adjetivo (slow), no un adverbio (slowly)."},
{t:"build",q:"Arma la frase: “Necesito cargar mi teléfono.”",words:["charge","need","phone","I","my","to"],a:"I need to charge my phone"},
{t:"real",book:"I utilize a digital calendar application for organizational purposes.",real:"I use a calendar app to stay organized.",es:"Uso una app de calendario para organizarme.",ctx:"Nadie habla así de sus apps; “I use a calendar app to stay organized” es simple y natural.",tags:["Everyday"],fast:"ai ius a cálendar ap tu stei órganaisd"},
{t:"speak",say:"I use my phone for work and social media.",es:"Practica hablar de cómo usas la tecnología.",tip:"Pronuncia “social media” con el acento en la segunda sílaba de cada palabra: soSHal MEdia."},
{t:"fact",body:"“My phone is dying” (literalmente “mi teléfono se está muriendo”) es una forma súper común e informal de decir que la batería está muy baja. Es totalmente natural en conversación.",note:"También puedes decir: “My battery is almost dead.”"},
{t:"trivia",qs:[
{q:"¿Cuál es correcta?",opts:["I spend a lot of time on my phone.","I pass a lot of time in my phone.","I expend much time on phone."],a:0,why:"“Spend time on...” es la forma natural."},
{q:"¿Qué significa “My phone is dying”?",opts:["La batería está muy baja.","El teléfono se rompió.","El teléfono es viejo."],a:0,why:"“My phone is dying” significa que la batería está casi agotada."}]}]},
{t:"Have You Ever...?",m:8,c:[
{t:"mission",title:"Ask and talk about life experiences.",goal:"Usa el presente perfecto con “ever” y “never” para preguntar sobre experiencias.",wolf:"Ready?"},
{t:"dialog",lines:[["Jess","Have you ever worked remotely?","¿Alguna vez has trabajado a distancia?"],["You","Yes, I have. I've worked remotely for two years.","Sí. He trabajado a distancia durante dos años."],["Jess","Have you ever used an AI app for work?","¿Alguna vez has usado una app de IA para trabajar?"],["You","No, I haven't. I've never tried one.","No. Nunca he probado una."]]},
{t:"discover",title:"Expresiones nuevas",items:[["Have you ever worked remotely?","¿Alguna vez has trabajado a distancia?","Everyday","jav iu éver uérkd rimóutli"],["I've worked remotely for two years.","He trabajado a distancia durante dos años.","Everyday","aiv uérkd rimóutli for tu íers"],["I've never tried it.","Nunca lo he probado.","Everyday","aiv néver traid it"],["Have you ever used an AI app?","¿Alguna vez has usado una app de IA?","Neutral","jav iu éver iuzd an ei ai ap"]]},
{t:"understand",title:"Presente perfecto: have/has + participio",body:"El presente perfecto se forma con have/has + participio pasado (worked, used, tried). Se usa con “ever” en preguntas (Have you ever...?) para preguntar si algo pasó alguna vez en la vida, sin importar cuándo. Se usa con “never” en negativas (I've never...) para decir que nunca ha pasado. La respuesta corta es: Yes, I have. / No, I haven't.",note:"“Ever” significa “alguna vez” y solo se usa en preguntas y con “never” (negativas). No lo uses en afirmativas normales."},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres preguntar si alguna vez trabajó a distancia. ¿Qué dices?",opts:["Have you ever worked remotely?","Do you ever worked remotely?","You have ever work remotely?"],a:0,why:"El presente perfecto se forma con Have + sujeto + participio: Have you ever worked...?"},
{t:"choose",tag:"Detecta el error",q:"Hay un error: “I never have tried it.” ¿Cuál es?",opts:["El orden correcto es: I've never tried it.","Falta “ever”.","No hay ningún error."],a:0,why:"El orden correcto es: sujeto + have + never + participio: I've never tried it."},
{t:"build",q:"Arma la frase: “He trabajado a distancia durante dos años.”",words:["remotely","I've","for","worked","years","two"],a:"I've worked remotely for two years"},
{t:"real",book:"I have not previously utilized an artificial intelligence application.",real:"I've never used an AI app.",es:"Nunca he usado una app de IA.",ctx:"Nadie habla así en conversación normal; “I've never used an AI app” es simple y natural.",tags:["Everyday"],fast:"aiv néver iuzd an ei ai ap"},
{t:"speak",say:"Have you ever worked remotely? I've worked remotely for two years.",es:"Practica preguntar y hablar de experiencias con el presente perfecto.",tip:"Contrae “I have” a “I've” — así suena mucho más natural."},
{t:"fact",body:"El presente perfecto (have + participio) es diferente del pasado simple: “I've worked remotely” habla de la experiencia en general, sin decir cuándo exactamente. “I worked remotely last year” es pasado simple, con un tiempo específico. Vas a seguir practicando esta diferencia.",note:"Por ahora, enfócate en usar “Have you ever...?” para preguntar sobre experiencias de vida."},
{t:"trivia",qs:[
{q:"¿Cuál es la estructura del presente perfecto?",opts:["Have/has + participio.","Have/has + infinitivo.","Be + participio."],a:0,why:"El presente perfecto se forma con have/has + participio."},
{q:"¿Cuál es la respuesta corta correcta a “Have you ever…?”",opts:["Yes, I have.","Yes, I do.","Yes, I am."],a:0,why:"Con “Have you ever…?” la respuesta corta es “Yes, I have” / “No, I haven't”."}]}]},
{t:"Apps & the Internet",m:9,c:[
{t:"mission",title:"Talk about apps and the internet.",goal:"Habla de tus hábitos en línea y lee sobre el uso de internet.",wolf:"Let's go!"},
{t:"dialog",lines:[["Maya","Have you ever tried online banking?","¿Alguna vez has probado la banca en línea?"],["You","Yes, I have. I use it every week — it's so convenient.","Sí. La uso cada semana — es muy conveniente."],["Maya","What about video calls? Do you use them for work?","¿Y las videollamadas? ¿Las usas para trabajar?"],["You","All the time. My whole team works online.","Todo el tiempo. Todo mi equipo trabaja en línea."]]},
{t:"discover",title:"Expresiones nuevas",items:[["I use online banking.","Uso la banca en línea.","Everyday","ai ius ónlain bánkin"],["It's really convenient.","Es muy conveniente.","Everyday","its rili convínient"],["We have video calls every week.","Tenemos videollamadas cada semana.","Everyday","uí jav vídeo cols évri uík"],["I need to update the app.","Necesito actualizar la app.","Everyday","ai niid tu apdéit de ap"]]},
{t:"understand",title:"Vocabulario de internet y apps",body:"Vocabulario clave: online (en línea), download (descargar), update (actualizar), upload (subir archivo), sign in / log in (iniciar sesión), password (contraseña), wifi connection (conexión wifi). “Convenient” significa “conveniente/práctico”.",note:"“Log in” / “sign in” son intercambiables para “iniciar sesión”; “log out” / “sign out” para “cerrar sesión”."},
{t:"reading",title:"Life Online",text:"Most people today use the internet every day for many different things. Ana uses her phone to check her email, pay bills, and talk to friends on video calls. She has never used a desktop computer at home — she does everything on her phone! Her father, on the other hand, prefers using a laptop because he finds phone screens too small for work. Both of them agree that a good wifi connection is one of the most important things in daily life.",qs:[
{q:"¿Qué usa Ana para pagar sus cuentas?",opts:["Su teléfono.","Una laptop.","Una computadora de escritorio."],a:0,why:"El texto dice: “Ana uses her phone to check her email, pay bills...”"},
{q:"¿Por qué el papá de Ana prefiere la laptop?",opts:["Porque la pantalla del teléfono es muy pequeña para trabajar.","Porque no tiene teléfono.","Porque es más barata."],a:0,why:"El texto dice: “he finds phone screens too small for work.”"}]},
{t:"choose",tag:"Elige la respuesta natural",q:"Quieres decir que algo es muy práctico. ¿Qué dices?",opts:["It's really convenient.","It's really convenience.","It's a convenient."],a:0,why:"“Convenient” es un adjetivo: It's really convenient."},
{t:"build",q:"Arma la frase: “Necesito actualizar la app.”",words:["update","need","the","I","app","to"],a:"I need to update the app"},
{t:"fact",body:"“Wifi” se pronuncia “uái-fai” en inglés, no “güifi” como se dice a veces en español. Es una de las palabras técnicas más usadas en conversación diaria.",note:"Presta atención a cómo se pronuncia en videos o series en inglés."},
{t:"trivia",qs:[
{q:"¿Qué significa “log in”?",opts:["Iniciar sesión.","Cerrar sesión.","Descargar."],a:0,why:"“Log in” significa iniciar sesión."},
{q:"Según el texto, ¿qué prefiere el papá de Ana?",opts:["Usar una laptop.","Usar su teléfono.","No usar tecnología."],a:0,why:"El texto dice que él prefiere usar una laptop."}]}]},
{t:"Tech Problems Mission",m:9,c:[
{t:"mission",title:"Handle a tech problem in real English.",goal:"Describe un problema técnico y pide ayuda.",wolf:"Ready?"},
{t:"dialog",lines:[["Sam","My computer won't turn on. Can you help me?","Mi computadora no enciende. ¿Me puedes ayudar?"],["You","Have you tried charging it? Maybe the battery is dead.","¿Ya intentaste cargarla? Tal vez la batería está muerta."],["Sam","I did, but it's still not working.","Lo hice, pero todavía no funciona."],["You","Let's try restarting it. Sometimes that fixes it.","Intentemos reiniciarla. A veces eso lo arregla."]]},
{t:"situation",intro:"Estás ayudando a un compañero de trabajo con un problema técnico.",start:["Colleague","The wifi isn't working. Can you take a look?","El wifi no funciona. ¿Puedes revisar?"],branches:[
{opt:"Sure, have you tried restarting the router?",npc:"Good idea, let me try that.",best:true,tag:"Útil y natural"},
{opt:"I don't know computer things sorry no.",npc:"Oh, okay, no problem.",best:false,tag:"Gramática confusa",why:"La frase está mal estructurada; mejor: “I'm not sure, sorry.”"},
{opt:"Restart router you.",npc:"Sorry, what do you mean?",best:false,tag:"Falta estructura",why:"Falta un sujeto y verbo claros: “Have you tried restarting the router?”"}],outro:"Ayudaste a tu compañero a resolver el problema. ¡Bien hecho!"},
{t:"choose",tag:"Elige la respuesta natural",q:"Tu computadora no enciende. ¿Cómo lo describes?",opts:["My computer won't turn on.","My computer no turn on.","My computer not turning."],a:0,why:"“Won't turn on” es la forma natural de decir que algo no enciende."},
{t:"build",q:"Arma la frase: “A veces eso lo arregla.”",words:["fixes","that","Sometimes","it"],a:"Sometimes that fixes it"},
{t:"speak",say:"Have you tried restarting it? Sometimes that fixes it.",es:"Practica ofrecer ayuda con un problema técnico.",tip:"Pronuncia “restarting” completo y claro — es una palabra clave en soporte técnico."},
{t:"fact",body:"“Have you tried...?” + gerundio es la forma más común de sugerir una solución en inglés: Have you tried restarting it? Have you tried updating the app? Es útil, natural y cortés.",note:"Guarda esta estructura — te sirve para resolver casi cualquier problema técnico en inglés."},
{t:"trivia",qs:[
{q:"¿Cómo dices que algo no enciende?",opts:["It won't turn on.","It no turns on.","It not turning."],a:0,why:"“Won't turn on” es la forma natural."},
{q:"¿Cómo sugieres una solución de forma natural?",opts:["Have you tried restarting it?","You try restart it?","Restart try you it?"],a:0,why:"“Have you tried...? + gerundio” es la forma natural de sugerir."}]}]},
{t:"Life & Work Review",m:6,kind:"review",c:[
{t:"mission",title:"Time for a quick review.",goal:"Repasemos trabajo, tecnología, presente perfecto y resolución de problemas.",wolf:"Let's go!"},

{t:"trivia",qs:[
{q:"¿Cómo preguntas a qué se dedica alguien?",opts:["What do you do?","What you do?","Do you what?"],a:0,why:"“What do you do?” es la forma natural."},
{q:"¿Cuál es la estructura del presente perfecto?",opts:["Have/has + participio.","Have/has + infinitivo.","Be + participio."],a:0,why:"Have/has + participio."},
